const LONGS={"ano": {"title": "脹著的肚子，睡不著的夜", "sub": "厭食症｜18 歲，大學一年級", "nodes": [{"p": "病人坐在床邊，雙手抱著肚子：「我睡不著……肚子好脹。」", "i": "今晚吃了一整碗飯，我好害怕。", "stage": "", "ch": [["「肚脹讓你很不舒服，好像還有些事情讓你睡不著。」", 2, "", "使用技巧：反映"], ["「吃飽了當然會脹，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "輕視感受，錯過了他背後的擔憂。"]]}, {"p": "「我覺得自己今晚吃得太多。」", "i": "明早量體重一定會增加。", "stage": "", "ch": [["「一想到今晚吃了多少，你就很緊張。可以多說一點，那種緊張是怎樣的嗎？」", 2, "", "使用技巧：反映＋開放式問題"], ["「你也沒有吃很多啊。」", 0, "他沒有再作聲，好像把自己封閉起來。", "討論食物份量，會令他更專注在數字上。"]]}, {"p": "「心跳得好快，手都在抖……整個人好慌。」", "i": "我控制不了自己。", "stage": "", "ch": [["「你現在很慌，心跳快、手在抖，身體都感受到。我們一起慢慢吸一口氣，再慢慢呼出來，好嗎？」", 2, "", "使用技巧：反映＋陪伴放鬆"], ["「你想太多了，不要那麼緊張。」", 0, "他沒有再作聲，好像把自己封閉起來。", "否定焦慮，他只會覺得沒有人明白。"]]}, {"p": "（慢慢呼吸幾次之後）「……好一點了。」", "i": "原來可以這樣。", "stage": "", "ch": [["「你願意和我一起嘗試，還察覺到自己好了一點，這很不容易。」", 2, "", "使用技巧：肯定"], ["「你看，我就說沒事吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "好像在說他之前小題大做。"]]}, {"p": "「其實不吃東西的時候，我會沒那麼慌，好像所有事情都在我的控制之內。」", "i": "這是我唯一能控制的事。", "stage": "", "ch": [["「聽起來限制飲食是你應付焦慮的方法，它讓你覺得有控制感。不過它也讓你的身體很辛苦。」", 2, "", "使用技巧：反映＋教育：焦慮與厭食行為的關係"], ["「不吃東西會死的！」", 0, "他沒有再作聲，好像把自己封閉起來。", "恐嚇只會增加焦慮和抗拒。"]]}, {"p": "「上大學之後，什麼都很亂，功課、同學、家人的期望……」", "i": "我很怕讓人失望。", "stage": "", "ch": [["「很多壓力同時湧來，你好像覺得一定要做到最好才行。哪一樣最壓著你？」", 2, "", "使用技巧：反映＋開放式問題"], ["「大家上大學都是這樣。」", 0, "他沒有再作聲，好像把自己封閉起來。", "正常化用錯了地方，會令他覺得自己太軟弱。"]]}, {"p": "「我不想家人覺得我是個麻煩。」", "i": "他們因為我入院很擔心。", "stage": "", "ch": [["「你很在乎家人的感受。你入院不是麻煩，而是生病了需要照顧，和患上其他病一樣。」", 2, "", "使用技巧：肯定＋去污名"], ["「你知道他們擔心，就快點多吃一點吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "用內疚逼他進食，會破壞信任。"]]}, {"p": "「明天早餐……我真的很害怕。」", "i": "我怕自己吃不下，又怕吃了之後更慌。", "stage": "", "ch": [["「很多和你一樣的病人都會害怕進食前後那段時間，你不是一個人。明天吃早餐時，護理師和營養師都會陪著你，一起面對。」", 2, "", "使用技巧：正常化＋支持"], ["「明天一定要全部吃完。」", 0, "他沒有再作聲，好像把自己封閉起來。", "增加壓力，沒有提供支援。"]]}, {"p": "「如果害怕的時候，我可以怎樣做？」", "i": "我想試試其他方法。", "stage": "", "ch": [["「你願意想其他方法，很棒。教你一個叫『五四三二一』的方法：說出五樣你看到的東西……四種聽到的聲音……三樣摸到的東西……兩種聞到的氣味……一種嚐到的味道。」病人跟著做，慢慢說：「窗簾、床頭燈……冷氣聲……被子很軟……」他的肩膀放鬆了。「害怕的時候都可以用，或者找護理師聊聊。」", 2, "", "使用技巧：肯定＋教授著地練習"], ["「不要想就可以了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "方法空泛，幫不了他。"]]}, {"p": "「……今晚和你聊完，好像沒那麼害怕了。」", "i": "原來說出來會好一點。", "stage": "", "ch": [["「謝謝你信任我。今晚你說了吃完飯很慌、限制飲食是你應付焦慮的方法，還有很擔心家人和明天的早餐。我會把你的擔憂交班，讓團隊一起幫你。試著休息一下吧。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「好了，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了總結和跟進的機會。"]]}], "end": "他終於睡著了。06:30，他小聲問：「明天早上……可以有人陪我吃早餐嗎？」", "lessons": ["焦慮很多時和厭食行為有密切關係。", "不要討論卡路里、體重或食物份量。", "用反映、肯定、開放式問題和摘要，幫助病人說出背後的擔憂。"], "principle": ""}, "dep": {"title": "凌晨的窗邊", "sub": "憂鬱症｜40 多歲，失業後入院", "nodes": [{"p": "病人站在窗邊，望著外面：「我睡不著。」", "i": "每晚都是這樣，睡不著又起不了床。", "stage": "", "ch": [["靜靜地站在他身旁：「我陪你站一會兒。」", 2, "", "使用技巧：沉默陪伴"], ["「很晚了，回去睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "立即趕他回床，錯過了談話的機會。"]]}, {"p": "「我在想，家人現在怎樣呢……」", "i": "他們沒有了我的收入，怎樣過日子？", "stage": "", "ch": [["「你很想念家人，也很擔心他們。可以多說一點嗎？你最擔心的是什麼？」", 2, "", "使用技巧：反映＋開放式問題"], ["「他們沒事的，不用擔心。」", 0, "他沒有再作聲，好像把自己封閉起來。", "空泛的保證。"]]}, {"p": "「我沒有了工作，連房貸都不知道怎麼辦。我以前是家裡的支柱。」", "i": "我現在是個廢人。", "stage": "", "ch": [["「你一直為家人撐著，現在沒有了工作，好像連自己的角色也一併失去了。」", 2, "", "使用技巧：反映"], ["「再找一份工作不就行了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太快解決問題，沒有理會他的失落。"]]}, {"p": "「家人以為我懶惰，連早上起床都做不到。」", "i": "我也覺得自己很沒用。", "stage": "", "ch": [["「沒有力氣起床是憂鬱的徵狀，不是懶惰。你願意入院治療，已經是為家人和自己踏出了一步。」", 2, "", "使用技巧：教育＋肯定"], ["「你再努力一點就可以了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "令他更自責。"]]}, {"p": "「有時……我覺得如果睡著了不再醒來，就不用再這麼辛苦。」", "i": "說了出來，他會怎樣看我？", "stage": "", "ch": [["冷靜、直接地說：「謝謝你告訴我。我想問清楚：你現在有沒有想過結束自己的生命？」", 2, "", "使用技巧：直接評估自殺風險"], ["「不要亂說話！」", 0, "他沒有再作聲，好像把自己封閉起來。", "會令病人把念頭藏起來。"]]}, {"p": "「……有想過，但我沒有計畫。」", "i": "他沒有被嚇到，還願意聽。", "stage": "", "ch": [["「你願意說出來，需要很大的勇氣。這件事我要告訴醫師和團隊，讓大家一起保護你，我不能替你保密，但我會一直在這裡。」", 2, "", "使用技巧：肯定＋誠實說明不能保密"], ["「好，我不會告訴別人。」", 0, "他沒有再作聲，好像把自己封閉起來。", "答應保密是錯的，會延誤處理。"]]}, {"p": "「我的腦停不下來，一直想、一直想。」", "i": "一個人在這裡，越想越黑暗。", "stage": "", "ch": [["「我教你一個方法：我們一起坐下，閉上眼睛，慢慢吸氣數四下，停一停，再慢慢呼氣數六下。有念頭飄過不要緊，再把注意力拉回呼吸上。」病人跟著做了幾次。", 2, "", "使用技巧：呼吸冥想"], ["「不要想那麼多。」", 0, "他沒有再作聲，好像把自己封閉起來。", "說易行難，沒有教方法。"]]}, {"p": "「……心靜了一點。」", "i": "很久沒有這樣了。", "stage": "", "ch": [["「你做得很好。睡不著或思緒很亂的時候，都可以這樣做，也可以隨時找護理師。」", 2, "", "使用技巧：肯定＋鞏固方法"], ["「這樣就行了，沒事了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太快當作問題已經解決。"]]}, {"p": "「我還能回頭嗎？」", "i": "我很想相信自己會好起來。", "stage": "", "ch": [["「憂鬱症是可以治療的，很多人配合藥物和輔導後都慢慢好起來。社工也可以幫你想想工作和經濟上的安排。」", 2, "", "使用技巧：灌輸希望＋實際支援"], ["「我怎麼知道。」", 0, "他沒有再作聲，好像把自己封閉起來。", "冷漠，令他更絕望。"]]}, {"p": "「謝謝你今晚陪著我。」", "i": "原來說出來沒有想像中那麼可怕。", "stage": "", "ch": [["「謝謝你信任我。今晚你說了擔心家人、覺得自己沒用，還有想過不想再醒來。我會交班給醫師和團隊跟進，今晚會多些來看你。試著休息一下吧。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「不用客氣，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了總結和跟進。"]]}], "end": "他回床躺下。之後每 15 分鐘巡房，他都在床上，04:30 睡著了。", "lessons": ["直接詢問自殺念頭不會增加風險。", "自殺念頭不可以保密，要誠實告訴病人會通知團隊。", "沒有力氣起床是憂鬱的徵狀，不是懶惰。", "呼吸冥想可以幫助自己從紛亂的思緒回到當下。"], "principle": ""}, "fep": {"title": "我是不是瘋了？", "sub": "思覺失調初發｜19 歲，第一次入院", "nodes": [{"p": "病人戴著耳機坐在床上，沒有播放音樂：「我睡不著。」", "i": "戴著耳機，好像會聽少一點。", "stage": "", "ch": [["坐在他旁邊的椅子上：「我看到你戴著耳機，但沒有播音樂。我陪你坐一會兒，好嗎？」", 2, "", "使用技巧：觀察＋陪伴"], ["「把耳機摘下，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "命令式，錯過了耳機背後的原因。"]]}, {"p": "「那些聲音今晚還沒出現，但我怕它們會回來。」", "i": "如果同學知道我聽到聲音，會怎樣看我？", "stage": "", "ch": [["「怕它們回來……聽到那些聲音的時候，是怎樣的感覺？」", 2, "", "使用技巧：開放式問題"], ["「沒有人說話，你只是聽錯了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "否定他的經歷，他以後不會再說。"]]}, {"p": "「好像有人在耳邊罵我，說我沒用……好害怕。」", "i": "我分不清哪些是真的。", "stage": "", "ch": [["「我聽不到那些聲音，但我相信你真的聽到，也真的很害怕。你現在在醫院，很安全，我在這裡。」", 2, "", "使用技巧：承認感受，不爭拗、不附和"], ["「它說什麼？它叫你做什麼？」", 0, "他沒有再作聲，好像把自己封閉起來。", "只顧追問內容，沒有照顧他的恐懼。"]]}, {"p": "「我是不是瘋了？我還可以回去上學嗎？」", "i": "我的人生是不是完了？", "stage": "", "ch": [["「你不是『瘋了』，你是生病了。思覺失調是可以治療的，很多年輕人及早治療後，都能回去上學、做自己喜歡的事。」", 2, "", "使用技巧：去污名＋灌輸希望"], ["「你現在才想著上學？」", 0, "他沒有再作聲，好像把自己封閉起來。", "輕視了他最大的擔憂。"]]}, {"p": "「醫師說要吃藥……我是不是要吃一輩子？會不會變得很呆？」", "i": "同學會不會發現我在吃藥？", "stage": "", "ch": [["「很多人都擔心這一點。藥物會幫你減少那些聲音，要吃多久視乎你的情況。如果有副作用，例如很累，可以和醫師商量，調整藥物。」", 2, "", "使用技巧：正常化＋提供資訊"], ["「醫師叫你吃就吃吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "欠缺解釋，會影響他服藥的意願。"]]}, {"p": "「我怕變胖，又怕整天很睏，上課時睡著。」", "i": "終於說出了真正的擔憂。", "stage": "", "ch": [["「你擔心體重和上課時的精神，這些擔憂很實在。我會記下來，交班請醫師明早和你商量。」", 2, "", "使用技巧：反映＋跟進"], ["「健康比胖不胖重要吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "忽略了他的擔憂。"]]}, {"p": "「我不想同學知道我住進了這裡。」", "i": "他們一定會覺得我是怪人。", "stage": "", "ch": [["「你的病情是你的隱私，要不要說、說多少都由你決定。社工和職能治療師也可以幫你想想重返校園的安排。」", 2, "", "使用技巧：尊重自主＋實際支援"], ["「有什麼好怕的？」", 0, "他沒有再作聲，好像把自己封閉起來。", "輕視了他對污名的恐懼。"]]}, {"p": "「如果那些聲音又回來，我應該怎樣做？」", "i": "我很怕控制不了自己。", "stage": "", "ch": [["「我教你一個方法，叫『五四三二一』：說出五樣你看到的東西、四種聽到的聲音、三樣摸到的東西、兩種聞到的氣味、一種嚐到的味道。」病人慢慢說：「床頭燈、窗簾……冷氣聲、你的聲音……被子……」", 2, "", "使用技巧：教授著地練習"], ["「不要理它就行了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "說易行難。"]]}, {"p": "「……做完好像安定了一點。」", "i": "原來我可以做些什麼。", "stage": "", "ch": [["「你做得很好。聲音回來的時候，可以用這個方法，也可以聽音樂、深呼吸，或者立即找護理師。你不用一個人撐著。」", 2, "", "使用技巧：肯定＋鞏固方法"], ["「這樣就可以了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "沒有幫他鞏固方法。"]]}, {"p": "「謝謝你陪我聊天。」", "i": "也許……還沒有完。", "stage": "", "ch": [["「謝謝你信任我。今晚你說了怕那些聲音回來、擔心上學和同學的看法，還有對藥物的顧慮。我會記下來，交班請醫師跟進。試著休息一下吧。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「好了，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了總結和跟進。"]]}], "end": "02:55，他摘下耳機，終於有點睏了。06:30，他主動問：「醫師幾點巡房？我想問問副作用的事。」", "lessons": ["不要與幻聽內容爭拗，也不要附和，承認病人的感受。", "思覺失調是可以治療的，及早治療很重要。", "五四三二一著地練習可以幫助自己回到當下。", "尊重隱私，減少污名帶來的恐懼。"], "principle": ""}, "eld": {"title": "我要搭公車回家", "sub": "失智症長者｜80 多歲，阿茲海默症", "nodes": [{"p": "長者拿著一個塑膠袋，站在門口：「我要搭公車回家！」", "i": "天黑了，家人在等我。", "stage": "", "ch": [["慢慢走近，蹲下來和他一樣高，輕聲說：「你想回家。」", 2, "", "使用技巧：簡短反映"], ["「你現在在醫院，回不了家的！」", 0, "他沒有再作聲，好像把自己封閉起來。", "直接否定，他會更激動。"]]}, {"p": "「是啊！我兒子在等我吃飯！」", "i": "我遲了，他會擔心。", "stage": "", "ch": [["「你很疼你的兒子。」", 2, "", "使用技巧：回應感受，不糾正"], ["「你兒子今天白天才來探望過你，你不記得嗎？」", 0, "他沒有再作聲，好像把自己封閉起來。", "資訊太多，又令他覺得自己記性差。"]]}, {"p": "「你是誰？我不認識你。」", "i": "為什麼有個陌生人在這裡？", "stage": "", "ch": [["指著自己的名牌：「我是護理師。我陪你。」", 2, "", "使用技巧：簡單介紹，配合名牌"], ["「你又不記得我？我剛剛才和你聊完！」", 0, "他沒有再作聲，好像把自己封閉起來。", "責怪記性，令長者難受。"]]}, {"p": "「我要找我的錢！塑膠袋裡有錢的！」", "i": "沒有錢怎樣搭公車？", "stage": "", "ch": [["「你擔心你的錢。我們一起看看塑膠袋，好嗎？」（陪他打開，裡面有一條毛巾和一張舊照片）", 2, "", "使用技巧：一次做一件事"], ["「你的錢在醫院保險箱裡，入院時已經登記了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太複雜，長者難以理解。"]]}, {"p": "長者拿起照片：「這是我兒子。」", "i": "他小時候很可愛。", "stage": "", "ch": [["「他很英俊。是不是你的兒子？」", 2, "", "使用技巧：用「是不是」問題延續話題"], ["「你兒子現在幾歲？做什麼工作？」", 0, "他沒有再作聲，好像把自己封閉起來。", "問題太多、太難回答。"]]}, {"p": "「是啊……他很乖。」長者坐了下來。", "i": "想起以前的事，心安定了。", "stage": "", "ch": [["陪他坐著，輕輕拍拍他的手，不急著說話。", 2, "", "使用技巧：沉默陪伴＋身體語言"], ["「好了，回去睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太快打斷，他可能又想離開。"]]}, {"p": "「我很冷。」", "i": "晚上很冷。", "stage": "", "ch": [["「我拿一張被子給你，好嗎？」", 2, "", "使用技巧：二選一／「是不是」問題，處理實際需要"], ["「冷氣不是很冷啊。」", 0, "他沒有再作聲，好像把自己封閉起來。", "否定他的感覺。"]]}, {"p": "長者抱著被子，望著你：「我有點害怕。」", "i": "這裡很陌生。", "stage": "", "ch": [["「不用怕，我在這裡。我們一起慢慢吸氣……慢慢呼氣。」護理師握著他的手，一起做了幾次簡單的呼吸。", 2, "", "使用技巧：簡單呼吸放鬆，配合觸摸"], ["「有什麼好怕的？」", 0, "他沒有再作聲，好像把自己封閉起來。", "否定感受。"]]}, {"p": "「你想去廁所，還是想再坐一會兒？」長者回答：「去廁所。」", "i": "原來是想上廁所。", "stage": "", "ch": [["陪他去廁所，再陪他回床。", 2, "", "使用技巧：二選一問題，發現真正需要"], ["「你剛剛才去過廁所。」", 0, "他沒有再作聲，好像把自己封閉起來。", "長者未必記得，他的需要是真實的。"]]}, {"p": "長者躺下：「謝謝你啊，護理師。」", "i": "這個人很好。", "stage": "", "ch": [["「不用客氣。我在這裡，你安心睡吧。」", 2, "", "使用技巧：簡短、溫和、給予安全感"], ["一句話也不說就走開", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了建立安全感的機會。"]]}], "end": "他握著照片，慢慢睡著了。交班時記錄他晚上想離開病房、擔心錢和家人，原來是想上廁所，以及哪些方法有效。", "lessons": ["「想回家」背後可能是不安、想念家人，或生理需要（例如肚餓、寒冷、想上廁所）。", "不要糾正或爭拗，先回應感受。", "用簡單詞彙、短句、「是不是」或二選一問題。", "配合名牌、手勢和觸摸。"], "principle": "用簡單詞彙、短句；一次說一件事；用「是不是」或二選一問題，不用開放式問題；配合手勢和身體語言；先回應感受。"}, "alc": {"title": "就一口", "sub": "酒精依賴｜50 多歲，入院戒酒第二晚", "nodes": [{"p": "病人在床上翻來覆去，滿頭大汗：「我睡不著……平時要喝兩罐才睡得著。」", "i": "沒有酒，整個人都不對勁。", "stage": "", "ch": [["「沒有喝酒，今晚特別難入睡，身體也很不舒服。」", 2, "", "使用技巧：反映"], ["「要喝酒才睡得著，就表示你有問題了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "批判會打擊他的動機。"]]}, {"p": "「我的手抖得很厲害，心又跳得很快。」", "i": "是不是又來了？上次很辛苦。", "stage": "", "ch": [["「這些可能是戒酒的反應，我立即幫你量血壓、脈搏和體溫，用戒斷評估表評估一下，再告訴醫師。」", 2, "", "使用技巧：即時評估戒斷徵狀"], ["「忍一忍就過去了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "忽略了可能有危險的戒斷徵狀。"]]}, {"p": "「就讓我喝一口，一口就夠。」", "i": "喝一口就不會這麼辛苦。", "stage": "量完之後", "ch": [["「你現在很辛苦，很想喝一口。這種很想喝的感覺會一陣一陣地來，也會慢慢過去。醫師有藥物可以幫你減輕戒斷反應。」", 2, "", "使用技巧：反映＋教育渴求感會過去"], ["「不行！你進來就是要戒酒！」", 0, "他沒有再作聲，好像把自己封閉起來。", "只是拒絕，沒有回應他的辛苦。"]]}, {"p": "「我試過很多次戒酒，每次都失敗。」", "i": "我是不是戒不掉？", "stage": "", "ch": [["「你試過很多次，代表你一直都想改變，這很重要。這次你願意入院，有醫師和護理師陪著你，和以前不一樣。」", 2, "", "使用技巧：肯定改變的動機"], ["「怎麼戒都戒不掉，就是你不夠決心。」", 0, "他沒有再作聲，好像把自己封閉起來。", "令他更絕望。"]]}, {"p": "「我太太說，如果再喝就和我離婚。」", "i": "我不想失去這個家。", "stage": "", "ch": [["「你很重視家庭，也不想失去他們。對你來說，戒酒最重要的原因是什麼？」", 2, "", "使用技巧：反映＋開放式問題，找出動機"], ["「早知道就別喝，不就沒事了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "責備，沒有幫助。"]]}, {"p": "「我想……看著女兒結婚。」", "i": "我想做個好爸爸。", "stage": "", "ch": [["「你想陪著女兒，見證她人生中重要的日子。這是很有力的理由，難熬的時候可以想想她。」", 2, "", "使用技巧：反映＋強化動機"], ["「那你就別再喝了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太簡化。"]]}, {"p": "「我的工作……如果老闆知道我入院，會不會解僱我？」", "i": "沒有了工作，家裡怎麼辦？", "stage": "", "ch": [["「你很擔心工作和家庭開支。社工可以和你談談病假證明和經濟支援，我們一步一步處理。」", 2, "", "使用技巧：處理實際擔憂"], ["「先別想著上班了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "迴避他的擔憂。"]]}, {"p": "「我以前一有壓力就喝酒……出院後怎麼辦？」", "i": "沒有了酒，我不知道怎樣減壓。", "stage": "", "ch": [["「我教你一個方法，叫漸進式肌肉放鬆：先用力握緊兩個拳頭，數五下，再慢慢放鬆，感受一下手的分別；接著肩膀、臉和腳也這樣做。」病人跟著做了一次。", 2, "", "使用技巧：教授漸進式肌肉放鬆"], ["「出院再說吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了教授應對方法的機會。"]]}, {"p": "「……手好像沒那麼抖了。」", "i": "原來不喝酒也可以放鬆。", "stage": "", "ch": [["「你做得很好。壓力大或很想喝酒的時候，可以用這個方法，也可以找人聊聊、散散步。出院後也有戒酒互助小組和回診跟進。」", 2, "", "使用技巧：肯定＋預防復發計畫"], ["「這樣就不用喝酒了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太簡化，沒有提及長遠支援。"]]}, {"p": "「謝謝你今晚陪著我。」", "i": "這次也許真的可以。", "stage": "", "ch": [["「謝謝你信任我。今晚你說了很想喝酒、怕戒不掉，還有擔心家庭和工作；你也說了想陪著女兒。我會交班給醫師跟進你的戒斷徵狀，今晚會多些來看你。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「好了，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了總結和跟進。"]]}], "end": "他服了醫師開的藥，04:00 睡著了。之後再量生命徵象，徵狀有改善。", "lessons": ["手震、出汗、心跳加快可能是戒酒反應，要即時評估並通知醫師。", "渴求感會一陣一陣地來，也會慢慢過去。", "肯定病人想改變的動機，不要批判。", "漸進式肌肉放鬆可以幫助自己放鬆。"], "principle": ""}, "mania": {"title": "我不需要睡覺", "sub": "躁狂｜30 多歲，雙相情緒障礙，躁狂期", "nodes": [{"p": "病人在走廊走來走去，說話很快：「我不需要睡覺！我有很多計畫要做！」", "i": "腦袋停不下來，好興奮。", "stage": "", "ch": [["用平穩、緩慢的語氣：「你現在有很多想法，很有精神。我們到交誼廳安靜一點的位置坐下聊聊，好嗎？」", 2, "", "使用技巧：反映＋減少刺激"], ["「小聲點！大家都在睡覺！」", 0, "他沒有再作聲，好像把自己封閉起來。", "大聲指責，會令他更激動。"]]}, {"p": "「我要開一間公司！我已經全部想好了，一定能賺大錢！」", "i": "為什麼沒有人明白我有多厲害？", "stage": "", "ch": [["「你對這個計畫很有熱誠。不如先寫下來，等你休息好了，再和醫師及家人一起看看。」", 2, "", "使用技巧：不附和、不爭拗，引導延後決定"], ["「你哪有錢開公司？」", 0, "他沒有再作聲，好像把自己封閉起來。", "爭拗會引起衝突。"]]}, {"p": "「我不想再睡了，睡覺浪費時間！」", "i": "我的腦袋有很多事情等著我做。", "stage": "", "ch": [["「你覺得很有精神。不過連續幾天沒睡，身體會撐不住，情緒也會更加起伏。我們試試把燈調暗一點，躺下休息也好。」", 2, "", "使用技巧：教育＋溫和設定界線"], ["「睡不睡隨你。」", 0, "他沒有再作聲，好像把自己封閉起來。", "放任會令病情惡化。"]]}, {"p": "「你們是不是想控制我？」聲音大了起來。", "i": "他們不明白我。", "stage": "", "ch": [["保持距離，語氣平穩：「我看到你很生氣。我不是想控制你，我希望你能好好休息。」", 2, "", "使用技巧：反映＋降溫"], ["「你再這樣就要打針！」", 0, "他沒有再作聲，好像把自己封閉起來。", "恐嚇會令情況升級。"]]}, {"p": "（坐了下來）「……其實我也很累，但停不下來。」", "i": "身體很累，腦袋還在轉。", "stage": "", "ch": [["「身體很累，腦袋卻停不下來，一定很辛苦。你願意說出來，很好。」", 2, "", "使用技巧：反映＋肯定"], ["「累了就睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "太簡化。"]]}, {"p": "「我怎樣才能讓腦袋停下來？」", "i": "我想試試。", "stage": "", "ch": [["「我教你一個方法：把注意力放在呼吸上。慢慢吸氣數四下，停一停，再慢慢呼氣數六下。如果思緒跑掉了，不要緊，再拉回來數呼吸。」病人跟著做了幾次，說話慢了一點。", 2, "", "使用技巧：呼吸冥想"], ["「不要想東西就行了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "說易行難。"]]}, {"p": "「我剛剛傳了很多訊息給朋友……他們會不會覺得我很奇怪？」", "i": "我是不是又搞砸了？", "stage": "", "ch": [["「你擔心朋友怎樣看你。等你情緒穩定一點，我們可以一起想想怎樣向他們解釋；現在先幫你保管手機，讓你休息。」", 2, "", "使用技巧：反映＋保護社交關係"], ["「你這樣當然很奇怪。」", 0, "他沒有再作聲，好像把自己封閉起來。", "批判會傷害病人。"]]}, {"p": "「上次發作，我把錢全花光了……我很怕又會這樣。」", "i": "我不想再傷害家人。", "stage": "", "ch": [["「你很清楚上次發生了什麼事，也想保護自己和家人。之後可以和醫師、社工一起訂一個計畫，例如及早察覺復發的警號。」", 2, "", "使用技巧：肯定病識感＋預防復發"], ["「你知道就別再這樣了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "責備，沒有幫助。"]]}, {"p": "「有什麼警號？」", "i": "我想早點知道。", "stage": "", "ch": [["「很多人會留意：睡得很少也不覺得累、說話很快、很多大計畫、很想購物。發現這些，就要及早看醫師。你想不想現在一起寫下來？」", 2, "", "使用技巧：教育復發警號＋共同參與"], ["「醫師會告訴你。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了自我管理的教育機會。"]]}, {"p": "「……我想試試躺下。」", "i": "原來慢下來也挺舒服的。", "stage": "", "ch": [["「好啊。今晚你說了腦袋停不下來、很累，還擔心朋友和上次把錢花光的事；你也試了呼吸方法。我會交班給醫師跟進，我陪你走回床邊。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「早就應該睡了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "令他覺得被指責。"]]}], "end": "他躺下了，04:30 睡著。交班時記錄他的睡眠時數、情緒、衝動行為和擔憂。", "lessons": ["和躁狂病人說話要簡短、平穩，減少刺激。", "不附和、不爭拗誇大的想法。", "睡眠不足會令躁狂加劇。", "認識復發警號，及早求醫。", "呼吸冥想可以幫助腦袋慢下來。"], "principle": "句子簡短、語氣平穩；減少刺激（燈光、聲音、人群）；溫和而清楚地設定界線；不附和誇大的想法，也不爭拗。"}, "grief": {"title": "她還在的", "sub": "親人離世｜50 多歲，母親兩個月前離世後因情緒低落入院", "nodes": [{"p": "病人拿著電話：「我想打給媽媽，她今晚還沒回覆我。」", "i": "她一定是睡著了。", "stage": "否認", "ch": [["坐在他身邊，溫和地說：「你很想念媽媽。」", 2, "", "使用技巧：先回應感受"], ["「你媽媽已經走了，你不記得嗎？」", 0, "他沒有再作聲，好像把自己封閉起來。", "太直接、太快，沒有照顧他的心情。"]]}, {"p": "「我常常覺得她還在，好像一回家就會見到她。」", "i": "我不想相信她走了。", "stage": "否認", "ch": [["「失去很親近的人，很多人都會覺得對方好像還在，這是很常見的反應。」", 2, "", "使用技巧：正常化｜否認：心靈在保護自己，慢慢消化難以接受的消息。"], ["「你要面對現實。」", 0, "他沒有再作聲，好像把自己封閉起來。", "逼得太急。"]]}, {"p": "聲音大了起來：「為什麼醫師不早點發現？為什麼偏偏是她？」", "i": "這個世界很不公平。", "stage": "憤怒", "ch": [["「你很憤怒，覺得很不公平。這些感受可以說出來，我在這裡聽。」", 2, "", "使用技巧：反映＋接納情緒｜憤怒：可能指向醫師、家人、自己，甚至離世的人。"], ["「不要怪醫師，他們已經盡力了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "急著替別人辯護，他會覺得不被理解。"]]}, {"p": "「我也氣自己……那段時間我太忙，沒有時間陪她。」", "i": "都是我不好。", "stage": "憤怒", "ch": [["「你很愛媽媽，所以才會這樣自責。你願意說說你和她之間有什麼回憶嗎？」", 2, "", "使用技巧：反映＋開放式問題"], ["「是啊，早知道就多陪陪她。」", 0, "他沒有再作聲，好像把自己封閉起來。", "加重內疚。"]]}, {"p": "「如果那天我早點帶她看醫師……如果我沒有搬出去住……」", "i": "如果我做得好一點，她可能還在。", "stage": "討價還價", "ch": [["「你不斷在想『如果』，很想把時間倒轉。很多喪親的人都會有這些想法。」", 2, "", "使用技巧：反映＋正常化｜討價還價：不斷想著「如果……就……」，想改變已經發生的事。"], ["「想也沒用。」", 0, "他沒有再作聲，好像把自己封閉起來。", "否定他的感受。"]]}, {"p": "病人哭了：「沒有了她，我不知道怎樣活下去。」", "i": "好空虛，什麼都沒有意義。", "stage": "憂鬱", "ch": [["遞上紙巾，靜靜地陪著他，過了一會兒：「你很痛。我在這裡陪你。」", 2, "", "使用技巧：沉默陪伴＋同理心｜憂鬱：深深的悲傷、空虛，什麼都提不起勁。"], ["「別哭了，媽媽也不想看到你這樣。」", 0, "他沒有再作聲，好像把自己封閉起來。", "壓抑他的情緒。"]]}, {"p": "「有時我覺得，不如跟她一起走了算了。」", "i": "說出來會不會好一點？", "stage": "憂鬱", "ch": [["冷靜、直接地說：「謝謝你告訴我。我想問清楚：你現在有沒有想過結束自己的生命？」病人：「有想過，但沒有計畫。」護理師：「你願意說出來很重要，我會告訴醫師和團隊，一起保護你。」", 2, "", "使用技巧：直接評估自殺風險＋誠實說明不能保密"], ["「不要亂說話。」", 0, "他沒有再作聲，好像把自己封閉起來。", "會令病人把念頭藏起來。"]]}, {"p": "「我的心很亂，很痛。」", "i": "一想起她就停不下來。", "stage": "", "ch": [["「我教你一個方法，叫『五四三二一』：說出五樣你看到的東西、四種聽到的聲音、三樣摸到的東西、兩種聞到的氣味、一種嚐到的味道。」病人慢慢地做，呼吸平穩了。", 2, "", "使用技巧：教授著地練習"], ["「想開點吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "沒有教方法。"]]}, {"p": "「媽媽以前常常燉湯給我喝……我很想念那碗湯。」", "i": "原來想起她，也可以是溫暖的。", "stage": "接受的開始", "ch": [["「聽起來媽媽很疼你。她煲的湯，是你們之間很溫暖的回憶。」", 2, "", "使用技巧：反映＋幫助回顧正面回憶"], ["「外面也有湯可以喝。」", 0, "他沒有再作聲，好像把自己封閉起來。", "完全錯過重點。"]]}, {"p": "「或者……我可以學她燉湯，這樣就好像她還陪著我。」", "i": "她會一直在我心裡。", "stage": "接受", "ch": [["「好主意。接受不是忘記媽媽，而是帶著對她的愛繼續生活。慢慢來，不用急。」", 2, "", "使用技巧：肯定＋解釋接受的意思｜接受：不是「放下」或「沒事」，而是學會與失去共存。"], ["「這樣就好了，你沒事了。」", 0, "他沒有再作聲，好像把自己封閉起來。", "哀傷不會一晚就結束。"]]}, {"p": "「謝謝你今晚陪我談媽媽。」", "i": "很久沒有和人談過她了。", "stage": "", "ch": [["「謝謝你和我分享媽媽的事。今晚你說了很想念她、憤怒和自責、想過不想活下去，還有她燉湯的回憶。我會交班給醫師和團隊跟進，今晚會多些來看你。試著休息一下吧。」", 2, "", "使用技巧：摘要＋交代跟進"], ["「好了，睡吧。」", 0, "他沒有再作聲，好像把自己封閉起來。", "錯過了總結和跟進。"]]}], "end": "他握著媽媽的照片，04:00 睡著了。交班時記錄他的情緒、自殺念頭和對話重點，建議轉介臨床心理學家進行哀傷輔導。", "lessons": ["哀傷的五個階段（否認、憤怒、討價還價、憂鬱、接受）不一定按次序，也可能反覆出現。", "每個人哀傷的方式都不同。", "陪伴和聆聽比勸人「想開點」更有用。", "喪親者也可能有自殺念頭，要直接詢問。", "接受不是忘記，而是帶著愛繼續生活。"], "principle": "讓大眾經歷喪親者常見的哀傷五個階段：否認、憤怒、討價還價、憂鬱、接受。解釋泡泡要說明：五個階段不一定按次序出現，可以反覆、重疊，每個人的哀傷都不同，沒有「對」或「錯」的哀傷方式。"}};
STORIES.grief={title:'',sub:'',e:'🕯️',scn:25,intro:'夜深，一位 50 多歲的病人坐在床邊，手裡握著電話。他的母親兩個月前離世，之後情緒一直很低落，這次入院。',nodes:[]};
STORIES.mania.intro='夜深，一位 30 多歲的病人在走廊走來走去，說話很快。他患有雙相情緒障礙，現在處於躁狂期，已經幾天沒怎麼睡過。';
STORIES.fep.intro='夜深，一位 19 歲的大學生戴著耳機坐在床上，耳機沒有播放音樂。他兩星期前開始聽到聲音、無法入睡，這次是第一次確診思覺失調，也是第一次入院。';
for(const k in LONGS){const L=LONGS[k],S0=STORIES[k];S0.title=L.title;S0.sub=L.sub;S0.nodes=L.nodes;S0.endGood=L.end;S0.endMid=L.end;S0.lessons=L.lessons;S0.principle=L.principle}
STORIES.ano.lessons=['厭食症病人為什麼會肚脹？長期吃得少，胃排空和腸道蠕動都會變慢，吃一點點就覺得很飽、很脹，也容易便秘；重新進食初期最明顯，營養改善後會慢慢好轉；焦慮也會令病人對身體感覺特別敏感。所以病人說肚脹是真實的感受，不是藉口。',...(STORIES.ano.lessons||[])];
{const n0=STORIES.ano.nodes[0];n0.p='病人坐在床邊，雙手抱著肚子：「我睡不著……肚子好脹，好像整個胃頂住似的。」';n0.ch.forEach(c=>{if(c[1]===2)c[3]+='｜💡 為什麼會肚脹？厭食症病人長期少吃，胃排空和腸道蠕動會變慢；重新進食初期，即使吃一點點也會覺得很脹、很飽滯。這是常見的身體反應，會隨著營養改善慢慢好轉，但會令病人更焦慮、更想少吃。'})}

{id:1,dx:'Schizophrenia',risk:['Violence risk','High'],zone:'hall',e:'🪑',urg:6,intim:1,
desc:'Shouting from the day room! Bed {b}: the patient is holding a chair above their head, yelling: “The voice is telling me to throw it at them!” Other patients are nearby.',
ch:[['Move the other patients away and keep a safe distance; speak calmly, acknowledge how distressing the voices must be, and invite them to put the chair down slowly. Meanwhile ask the Second to call the doctor and get colleagues ready to help',2,'You kept everyone safe first, then used de-escalation to help the patient calm down.'],['Rush in alone and grab the chair',0,'Charging in alone can easily injure you both, and makes the patient more frightened and agitated.'],['Shout: “Put it down! Or you’re getting tied up!”',0,'Threats only increase the patient’s fear and hostility, and make the situation harder to manage.']],
learn:'Hearing voices is a common symptom of schizophrenia, and to the patient the voice feels very real and frightening. Nurses don’t argue about whether the voice is real; they de-escalate: keep the area safe, keep a distance, speak steadily and offer choices. Restraint is only a last resort.',
vet:'When a patient is holding something, check the exits and the other patients first. Stand at an angle and don’t block their way out, so they feel less cornered.'},
{id:2,dx:'Personality disorder with long-term substance misuse',risk:['Violence risk','Moderate'],zone:'ns',e:'🚬',urg:15,intim:1,
desc:'Bed {b} The patient bangs on the nurses’ station counter: “No smoking? I’ll trash your ward!”',
ch:[['Stay calm and clearly explain the no-smoking rule and why; offer alternatives, such as asking the doctor to assess for nicotine patches or gum, and talk about other ways to cope with stress',2,'Firm but respectful, with real support. The patient gradually agrees to sit down and talk.'],['To keep the peace, quietly let them go out for one cigarette',0,'It breaks the rules and the boundary, so they’ll try the same thing next time; taking a patient off the ward also risks them going missing.'],['Ignore them completely until they tire themselves out',1,'Not reacting to provocation can sometimes help, but you must keep observing and offer support — you can’t ignore them completely.']],
learn:'Some patients with personality disorders test boundaries. Nurses aim to be “firm but respectful”: consistent rules and a calm manner, while offering withdrawal support such as nicotine replacement therapy.',
vet:'Before stating the rule, try “I know you really want a cigarette — withdrawal is tough.” They’ll be far more likely to listen.'},
{id:3,dx:'Mild intellectual disability',risk:['Self-harm risk','Moderate'],zone:'hall',e:'🧱',urg:6,intim:1,
desc:'Bed {b} Upset that there are no snacks, the patient keeps banging their head against the wall; their forehead is already red.',
ch:[['Go straight over and protect their head with a cushion or your hand; use simple words: “Snacks come at snack time — let’s look at the clock together”, then redirect them to an activity they enjoy; afterwards check their head for injury',2,'You kept them safe first, then used simple, clear communication and distraction. They gradually stopped.'],['Give them a snack straight away so they stop',1,'It stops the harm for now, but in the long run they learn “banging my head gets me snacks”.'],['Tell them to go to their room and calm down alone',0,'They’ll keep banging their head, and being alone is more dangerous.']],
learn:'People with intellectual disability may have limited ways to express themselves; head-banging may be how they show they’re upset. Nurses keep them safe first, then use simple communication, visual schedules and a behaviour plan to teach other ways to express needs.',
vet:'With these patients, keep sentences short and concrete, and use gestures and picture cards — it works much better.'},
{id:4,dx:'Mild intellectual disability',risk:['Violence risk','Low'],zone:'hall',e:'🩲',urg:15,
desc:'Bed {b} The patient has undressed in the day room again; there is faeces and urine on the floor, and they’ve smeared it on the wall.',
ch:[['First protect their privacy with a towel or screen and take them to the shower to clean up and change; ask support staff to clean and disinfect the area; record the behaviour and later plan regular toileting with the team',2,'You protected the patient’s dignity and handled infection control well.'],['Tell them off in front of everyone: “That’s disgusting!”',0,'Humiliation hurts the patient’s dignity and won’t change the behaviour.'],['Tell the other patients not to look and wait for them to dress themselves',0,'Privacy and cleaning weren’t dealt with straight away; the infection risk is high.']],
learn:'This kind of behaviour may relate to cognitive ability, not having learned toileting, or sensory needs. Nurses protect the patient’s dignity and privacy and work with occupational therapists and the team on a toilet-training plan.',
vet:'Taking them to the toilet every two hours often prevents this from happening again.'},
{id:5,dx:'Depression',risk:['Suicidal risk','High'],zone:'bed',e:'🩹',urg:5,
desc:'On your dorm round, you see Bed {b}: the patient is sitting on the bed with a fresh, bleeding cut on their arm and a hidden sharp object beside them.',
ch:[['Call colleagues for help straight away, stay calmly with the patient and remove the sharp object; stop the bleeding and assess the wound, inform the doctor; then talk with them about how they’re feeling, increase observation and do a full safety search',2,'You kept the patient safe straight away without judging them, and they finally opened up about how much they’re hurting.'],['Scold them for doing it',0,'Scolding makes the patient feel more ashamed and more withdrawn.'],['Go and fetch dressings, leaving them alone',0,'A patient at high suicide risk must not be left alone.']],
learn:'Self-harm is a sign of extreme distress, not “attention-seeking”. Nurses treat the wound straight away, keep the patient safe, listen without judgement and arrange close observation according to risk (suicidal observation chart).',
vet:'Afterwards, check the bed, clothing and belongings — sharp objects are often hidden in unexpected places.'},
{id:6,dx:'Adult psychiatric patients (two)',risk:['Violence risk','High'],zone:'hall',e:'📺',urg:6,two:1,
desc:'Bed {b} and Bed {b2}: the patients are arguing over which TV channel to watch, and one is already walking over with a clenched fist!',
ch:[['Call for help straight away, separate the two patients to different areas and listen to each of them; then agree a rota for choosing the channel',2,'You separated them in time; no one was hurt, and you found a longer-term solution.'],['Turn the TV off so nobody can watch',1,'Removing the trigger helps for now, but it must go with separating and calming them — it doesn’t end there.'],['Stand between them and pull them apart yourself',0,'Standing between them alone is a good way to get hurt; only step in with enough staff.']],
learn:'Living space on a ward is limited and small things can spark conflict. Nurses watch for rising tension early, only step in with enough staff, and use fair, clear rules to prevent conflict.',
vet:'Fights usually have warning signs: raised voices, standing close, clenched fists. When you see them, go over straight away — don’t wait.'},
{id:7,dx:'Dementia (limited mobility)',risk:['Risk of falls and going missing','High'],zone:'hall',e:'🧓',urg:8,
desc:'Sitting in the recliner, the patient in Bed {b} — an older person — suddenly tries to stand up alone: “I need the toilet! I’m getting the bus home!” Then keeps heading towards the ward door.',
ch:[['Go over and steady them, take them to the toilet first for their urgent need; then calm them with a familiar topic, such as asking about their family; meanwhile keep an eye on the ward entrance',2,'You dealt with their real need first (the urge to pee), then calmed them with validation. They stopped insisting on leaving.'],['Tell them to sit still and wait until a colleague is free to take them to the toilet',0,'If the urge isn’t dealt with, they’ll get up alone again — and the risk of falling goes up.'],['Tell them: “You can’t go home!”',0,'Contradicting them flatly makes a person with dementia more anxious and more determined to leave.']],
learn:'When a person with dementia says “I want to go home”, they’re often expressing unease or an unmet need (such as hunger or needing the toilet). Nurses use validation: respond to the feeling first, then meet the need.',
vet:'When they keep saying they want to go home, try asking “Who’s waiting for you at home?” — chatting about it often helps them relax.'},
{id:8,dx:'Schizophrenia (refusing medication)',risk:['Violence risk','Moderate'],zone:'ns',e:'💊',urg:10,trig:'med',intim:1,
desc:'During the medication round, Bed {b}: the patient pushes the medicine cup away: “This isn’t medicine, it’s poison! You’re trying to kill me!”',
ch:[['Don’t force it; listen calmly to their worries; explain the medicine’s name and purpose, and let them see the label on the packet; if they still refuse, record it and inform the doctor',2,'You respected the patient. They didn’t take it this time, but their trust in you grew, and the doctor can adjust treatment early.'],['Tell them: “If you won’t take it, you’re getting an injection!”',0,'Threats damage the therapeutic relationship and make them feel even more that someone wants to harm them.'],['Secretly mix the medicine into their food',0,'Giving medicine without the patient’s knowledge breaches professional ethics.']],
learn:'Refusing medication may come from delusions, side effects or limited insight into the illness. Nurses find out why, explain clearly, record it and inform the doctor — never forcing or deceiving the patient.',
vet:'Sometimes having a colleague the patient trusts give the medicine, or trying again 15 minutes later, works better.'},
{id:9,dx:'Schizophrenia (fear of poisoning)',risk:['Violence risk','Moderate'],zone:'hall',e:'🍚',urg:12,trig:'meal',shifts:'AP',
desc:'At mealtime, Bed {b}: the patient pushes the meal box away: “You’ve poisoned the food!”',
ch:[['Don’t argue; show you understand their worry; let them choose their own meal box, or open a sealed meal in front of them; record what they eat and inform the dietitian and doctor',2,'You gave the patient a sense of control, and in the end they ate half the box.'],['Tell them: “If you don’t eat this, you get nothing!”',0,'Threats make them even less willing to eat, and nutrition becomes a problem.'],['Taste a mouthful in front of them to prove it’s safe',1,'It sometimes works, but it’s unhygienic and not a long-term solution.']],
learn:'Patients with persecutory delusions may believe their food is unsafe. Nurses respect them and offer choices, while monitoring nutrition and weight.',
vet:'A sealed ready-made meal, or letting them choose for themselves, puts them much more at ease.'},
{id:10,dx:'Patient with a nasogastric tube',zone:'bed',e:'🧪',urg:10,
desc:'Bed {b}: the patient is pulling at their feeding tube, and the tape is already half off.',
ch:[['Gently stop them straight away and check the tube’s position and length marking; if it has moved, pause feeding and inform the doctor; explain to the patient what the tube is for and find out why they’re uncomfortable',2,'Caught early — you avoided the danger of feeding through a displaced tube.'],['Carry on with the feed as usual',0,'Feeding through a displaced tube can send feed into the lungs.'],['Pull the tube out for them',0,'Nurses can’t decide on their own to remove the tube; the doctor must assess.']],
learn:'Tube-fed patients need regular checks of the tube position, and the position must be confirmed before each feed. Find out why the patient pulls at it, e.g. discomfort or confusion.',
vet:'Taping the tube at two points — nose and cheek — and securing it to clothing with a clip reduces pulling.'},
{id:11,dx:'Patient with a urinary catheter',zone:'bed',e:'🧴',urg:15,
desc:'A support worker reports: “Charge nurse, Bed {b}: there’s very little urine in the bag and it’s very dark. The patient says their lower belly hurts.“',
ch:[['Check the catheter for kinks or blockage, observe the urine and take a temperature; record intake and output (intake and output chart) and inform the doctor',2,'The tube was kinked. Once sorted, urine drained freely, and the doctor arranged a urine test.'],['Just empty the bag',0,'A possible blockage or infection hasn’t been dealt with.'],['Tell the patient to drink more water and check again next shift',1,'Fluids help, but lower abdominal pain with low urine output needs checking now.']],
learn:'Patients with catheters need regular bag emptying and urine output records, and watching for infection, blockage or self-removal.',
vet:'Keep the bag below the bladder and the tube unkinked — that alone prevents many problems.'},
{id:12,dx:'Mania (bipolar disorder)',zone:'hall',e:'⚡',urg:15,
desc:'Bed {b}: the patient is talking very fast, chatting to everyone, saying they’ll give away all their money, and asking other patients for their phone numbers.',
ch:[['Take them somewhere quieter to reduce stimulation; use short, clear sentences and set gentle limits; protect their belongings and other patients’ privacy; complete the mood chart',2,'With less stimulation, they gradually calmed down a little.'],['Chat excitedly along with them',0,'It’ll make them even more elevated.'],['Tell them to shut up',0,'Likely to provoke them and start a conflict.']],
learn:'During mania, patients are elevated, sleep little and have poorer judgement, so they make impulsive decisions (like overspending). Nurses reduce stimulation, protect safety and belongings, and make sure they rest, eat and drink enough.',
vet:'Simple activities that don’t need much thought, like folding towels, help them use up energy.'},
{id:13,dx:'Alcohol withdrawal',risk:['Medical risk (withdrawal complications)','High'],zone:'bed',e:'🍺',urg:8,
desc:'Bed {b}: on the patient’s second day, their hands are shaking badly; they’re sweating, their heart is racing, and they point at the wall saying insects are crawling on it.',
ch:[['Take vital signs straight away, complete a CIWA-Ar to assess withdrawal severity, and inform the doctor (medication may be needed); keep the room well lit and quiet, and take precautions against falls and seizures',2,'Prompt assessment and informing the doctor prevented the withdrawal from getting worse.'],['Tell them “There are no insects, you’re hallucinating”, then walk away',0,'Severe alcohol withdrawal can be life-threatening — it can’t be ignored.'],['Wait until the next round of vital signs',0,'Withdrawal symptoms can worsen quickly and need dealing with now.']],
learn:'Alcohol withdrawal usually starts 1–3 days after stopping drinking; severe cases can bring hallucinations, seizures and even risk to life. Nurses assess regularly with the CIWA-Ar and work with the doctor’s treatment.',
vet:'Withdrawal patients are especially confused at night; leaving a small light on makes them less frightened.'},
{id:14,dx:'Obsessive-compulsive disorder (OCD)',zone:'wc',e:'🧼',urg:20,
desc:'Bed {b}: the patient has been washing their hands in the toilets for half an hour; their hands are cracked and sore, and other patients are queueing at the door.',
ch:[['Talk to them gently and agree a limit (e.g. two more minutes), staying with them as they slowly stop; direct the other patients to another cubicle; then help them put on moisturiser, and follow up with the clinical psychologist',2,'You patiently helped them stop step by step, and they became less anxious.'],['Turn off the tap at once and order them out',0,'Interrupting forcefully makes anxiety shoot up.'],['Let them wash as long as they like',0,'Their skin will be damaged, and it affects other patients too.']],
learn:'People with OCD know the behaviour is excessive but can’t stop, because not doing it causes intense anxiety. Treatment includes CBT; day to day, nurses support them in gradually reducing the compulsions.',
vet:'Don’t tell them “Your hands are clean now” — the more you reassure, the more they need to check. A timer works better.'},
{id:15,dx:'Eating disorder',zone:'hall',e:'🥄',urg:20,trig:'meal',shifts:'AP',
desc:'A support worker quietly tells you that Bed {b}: the patient has been hiding food in tissues and pockets.',
ch:[['Don’t confront them in public; talk with them gently in private; then sit with them at meals, record food intake and weight, and inform the dietitian and doctor',2,'You helped the patient save face, and they opened up about their fear of gaining weight.'],['Search their pockets in front of everyone',0,'It will shame the patient and make them hide food even more.'],['If they won’t eat, respect that and leave them be',0,'Eating disorders can be life-threatening — you can’t just leave it.']],
learn:'An eating disorder isn’t “being picky”; it’s a serious mental illness. Nurses monitor intake and weight, offer supportive company and work with dietitians and psychologists.',
vet:'At mealtimes, chat about light topics rather than focusing on food and weight.'},
{id:16,dx:'Schizophrenia (persecutory delusions)',zone:'bed',e:'🕵️',urg:20,intim:1,
desc:'Bed {b}: the patient is huddled by the bed: “Someone outside is following me — I’m not going out!” They won’t come out for meals or medication.',
ch:[['Don’t argue about the delusion; acknowledge their fear; have a colleague they trust talk with them from a safe distance and let them decide where to eat; record mood and intake',2,'The patient felt respected and agreed to eat at the bedroom door.'],['Tell them “No one’s following you, you’re overthinking”',1,'Flat denial usually doesn’t work, and may make them feel you don’t understand.'],['Get several colleagues to pull them out of the room',0,'It reinforces their belief that “someone wants to harm me”.']],
learn:'A delusion is a belief the patient holds firmly; reasoning rarely changes it. Nurses build trust, reduce the sense of threat and, alongside medication, help things improve over time.',
vet:'When you talk with them, sit down and don’t stand too close — they’ll feel safer.'},
{id:17,dx:'Schizophrenia (refusing to shower)',zone:'wc',e:'🚿',urg:20,trig:'bath',shifts:'A',intim:1,
desc:'At shower time, Bed {b}: the patient hasn’t showered for days and has a noticeable odour. They shout: “I’m not showering!”',
ch:[['Find out why they won’t shower (e.g. fear of water, privacy, voices); offer choices: shower a bit later, pick their own clothes, be helped by a colleague they trust; you could start with a wash at the sink',2,'They said they were worried the water was too hot. Once you adjusted it, they agreed to shower.'],['Get several colleagues to force them into the shower room',0,'Force makes patients feel humiliated, and they’ll resist even more next time.'],['Let them skip showering',0,'Long-term lack of hygiene leads to skin problems and infection.']],
learn:'People with schizophrenia may neglect personal hygiene because of low motivation (negative symptoms) or delusions. Nurses find out why and encourage them with patience and choices.',
vet:'Step by step: wash face today, change clothes tomorrow, shower the day after — that’s easier to accept.'},
{id:18,dx:'Long-term illness with diabetes (awaiting discharge)',zone:'ns',e:'🩸',urg:20,
desc:'Bed {b} The patient is waiting to be discharged, but says they don’t want their insulin, and they’ve secretly eaten chocolate. Blood glucose is 15.2 mmol/L (millimoles per litre).',
ch:[['Record the glucose and inform the doctor; talk simply with them about diet and why insulin matters; ask the dietitian to review their meal plan, and teach them how to self-manage after discharge',2,'The patient understood why they need the injections and is willing to learn to check their own glucose.'],['Tell them off for not listening',0,'Scolding won’t change the behaviour, and they’ll be less honest with you afterwards.'],['Wait until the next glucose check',0,'High blood glucose needs prompt action and the doctor must be told.']],
learn:'Psychiatric patients can have physical illnesses too. Nurses care for body and mind together, and teach self-management before discharge to help patients settle back into the community.',
vet:'They say the injections hurt — you can teach them to rotate injection sites.'},
{id:19,dx:'Young first-episode patient',zone:'ns',e:'📞',urg:20,
desc:'Admitted for the first time, Bed {b}: the young patient is crying, saying they’re scared; their family has already phoned five times today asking how they are.',
ch:[['Sit with the patient, show them around the ward and explain the daily routine, and answer their questions; on the phone, confirm the caller’s identity and the patient’s consent before sharing anything, then arrange for the doctor and social worker to talk with the family',2,'The patient is less frightened, and the family feels reassured.'],['Tell the caller everything about the patient’s condition over the phone',0,'Sharing information without confirming identity and getting consent breaches privacy.'],['Tell the family to stop calling',0,'The family’s worry is normal and needs proper support.']],
learn:'A first admission to a psychiatric ward is frightening for patients and families. A short introduction or a word of explanation from a nurse can ease a lot of fear and misunderstanding.',
vet:'Showing them the daily timetable, so they know what happens when, makes them feel less lost.'},
{id:21,dx:'Schizophrenia (grandiose delusions)',zone:'hall',e:'👑',urg:20,
desc:'Bed {b}: the patient tells others: “I know lots of big shots — whoever wants to start a company, I’ll fund it! This whole building is mine!” Some patients start asking to borrow money.',
ch:[['Don’t laugh or argue with them in front of others; gently change the subject; remind the other patients not to exchange money; record their behaviour and mood, and inform the doctor',2,'You protected patients’ money and belongings without hurting their self-esteem.'],['Laugh at them: “If you’re so rich, why are you here?”',0,'Mockery hurts their dignity and may anger them.'],['Play along with them',0,'Going along with it reinforces the delusion.']],
learn:'A grandiose delusion is a firm belief in having a special identity, abilities or wealth. Nurses neither go along with it nor mock it; they stay neutral and keep everyone safe.',
vet:'You don’t need to answer every claim. Bring them back to what they did today to help ground them.'},
{id:22,dx:'Patient with a tendency to violence',zone:'hall',e:'🆘',urg:5,
desc:'A support worker is helping Bed {b} with their meal when the patient suddenly hits them, and the colleague falls!',
ch:[['Call loudly for colleagues’ help straight away; separate the patient from the injured colleague and have the colleague’s injuries checked; calm the patient with de-escalation and inform the doctor; complete an incident report afterwards',2,'The situation is under control, the injured colleague is cared for, and the incident is fully documented.'],['Look after the colleague and leave it there — no need for a report',1,'Incident reports matter: they protect staff and help the team prevent similar incidents.'],['Have the patient restrained straight away as punishment',0,'Restraint is not a punishment; it’s a last resort, used only according to procedure.']],
learn:'Assaults on frontline staff aren’t rare. Wards need clear response procedures, enough staff and support afterwards; every incident should be recorded and reviewed.',
vet:'Your colleague has had a fright — afterwards, check on how they’re feeling, not just their physical injuries.'},
{id:23,dx:'Overdose of sleeping pills (transferred from medical ward)',zone:'bed',e:'💤',urg:15,
desc:'Transferred from the medical ward, Bed {b} — admitted after an overdose of sleeping pills — says they can’t sleep and asks for an extra sleeping pill.',
ch:[['Assess their alertness and vital signs and use the NGASR to assess suicide risk; check the bedside for hidden medicines; use non-drug ways to help sleep (e.g. relaxation exercises), and inform the doctor if needed',2,'You looked after both their sleep and their safety, and they were willing to talk about recent stresses.'],['Give them another pill',0,'Nurses can’t add medication on their own, and this patient is at risk of overdose.'],['Tell them to count sheep',1,'It helps a little, but you haven’t assessed risk or found out why.']],
learn:'Patients admitted after an overdose may have suicidal intent or drug dependence. Nurses assess risk, prevent hoarding of medicines, and address the underlying sleep and mood problems.',
vet:'During medication rounds, watch them swallow and ask them to open their mouth, to prevent hoarding.'}];

const SUD={
fever:{name:'Patient with a fever',e:'🌡️',zone:'bed',urg:15,
desc:'Support worker: “Charge nurse, Bed {b}’s vital signs are done — their temperature is a bit high!“<br><br>📋 Temp: 37.8°C | BP: 128/78 mmHg | Pulse: 96 /min | Resp. rate: 20 /min | Glucose: 6.2 mmol/L (millimoles per litre) | SpO2: 97%',
ch:[['Recheck the temperature yourself, look for other symptoms, then ask the Second to inform the doctor',2,'The recheck confirmed a fever, and the doctor is following up.'],['Ask the Second to inform the doctor straight away',1,'Informing the doctor is right, but rechecking and looking for other symptoms first makes your report more accurate.'],['Leave it until the next round of observations',0,'A fever may be an early sign of infection (e.g. flu) and needs prompt follow-up.']],
learn:'Correct approach: recheck the temperature and look for other symptoms, then inform the doctor; consider whether it might be flu and take infection-control measures if needed.'},
bleed:{name:'Blood in the incontinence pad',e:'🩸',zone:'bed',urg:10,
desc:'Support worker: “Charge nurse! Bed {b} — when I changed their pad, it was full of blood!“',
ch:[['Go straight over and check where the bleeding is from and how much',2,'You find it’s bleeding from haemorrhoids. You take BP and pulse, record the bleeding, and ask the Second to inform the doctor.'],['Tell the colleague to just change the pad',0,'Heavy bleeding can be very dangerous; you must assess it yourself.']],
learn:'Correct approach: check straight away, identify the source (e.g. haemorrhoids), take BP and pulse, record the bleeding, then ask the Second to inform the doctor.'},
flu:{name:'Flu outbreak on the ward',e:'🤧',zone:'ns',urg:20,
desc:'Three patients already have a fever and cough, and rapid flu tests are positive!',
ch:[['Inform the doctor and the infection-control team; cohort or isolate patients with symptoms; masks for the whole ward, more hand hygiene and cleaning; restrict visits and group activities; record the cases',2,'Prompt infection control stopped the flu from spreading further.'],['Wait until tomorrow to see if more people get sick',0,'The ward is crowded, and flu can spread very quickly.'],['Only ask the patients with fever to wear masks',1,'It helps, but it’s not enough.']],
learn:'Psychiatric ward patients share a lot of space, and some may not be able to protect themselves, so infection-control measures must start straight away in an outbreak.'},
family:{name:'Family complaint',e:'😡',zone:'visit',urg:15,
desc:'At visiting time, Bed {b}’s family are angry in the visiting room: “Why is there bruising on their arm and their hand is all scratched? Are you hitting them?”<br><br>(📝 According to the records: the marks were caused by the patient scratching themselves.)',
ch:[['Invite the family somewhere quiet and show you understand their worry; check the notes and mood chart, and explain honestly that the marks are self-inflicted scratches and how the ward manages and prevents them; arrange for the doctor to explain if needed',2,'The family understood what happened and even worked with you on ways to help the patient scratch less.'],['Deny it at once: “It’s nothing to do with us!”',0,'A defensive response makes the family trust you even less.'],['Tell the family to go and complain themselves',1,'Families have the right to complain, but you can listen and explain first.']],
learn:'Complaints from families often come from worry. Clear, honest communication plus complete records are the best tools for handling them.'},
keys:{name:'Missing key',e:'🔑',zone:'ns',urg:15,
desc:'During the key count, one key is missing! If a key to a gazetted (locked) ward ends up with a patient, it could lead to someone going missing or other danger.',
ch:[['Tell colleagues straight away, stop patients going in and out, search systematically, and report it according to procedure',2,'Everyone is on alert; no patient seems to be acting unusually so far.'],['Say nothing and look for it yourself later',0,'Keys matter as much as the patient count — a missing key must be dealt with straight away.']],
learn:'On a psychiatric ward, keys matter as much as the patient count. Count them at every handover and put them back in their fixed place straight after use.'},
patrolEmpty:{name:'Empty bed on patrol',e:'🛏️',zone:'bed',urg:8,
desc:'On your night patrol, you find Bed {b} empty!',
ch:[['Check the toilets and every area straight away, while alerting colleagues and confirming the patient count and the state of the main door',2,'The patient was in the toilet — they couldn’t sleep. You chatted with them for a while and they went back to bed.'],['Come back and check later',0,'A patient missing from bed must be found straight away — they may be at risk of going missing or self-harm.']],
learn:'A night patrol isn’t just “seeing if someone’s there”; you must confirm patients are safe and breathing normally.'},
patrolCover:{name:'Patrol: head under the blanket',e:'🌙',zone:'bed',urg:8,
desc:'Bed {b} The patient has the blanket over their whole head, and you can’t see whether they’re breathing. They’re at high suicide risk.',
ch:[['Gently lift the blanket a little to confirm they’re breathing and responsive, and record it on the suicidal observation chart',2,'The patient is safe; they just don’t like the light. You dim the nearby lights for them.'],['Walk past so you don’t wake them',0,'For high-suicide-risk patients, breathing and safety must always be confirmed.']],
learn:'High-suicide-risk patients must be observed closely according to the suicidal observation chart — including at night.'},
fg:{name:'New colleague asks for help',e:'🌱',zone:'tr',urg:20,
desc:'A newly graduated colleague asks you quietly: “Charge nurse, I’ve never given medication through a feeding tube. Could you show me?”',
ch:[['Take a few minutes to demonstrate, then watch them do it, and encourage them to ask any time',2,'The new colleague is very grateful and much more confident next time.'],['Tell them to read the procedure manual',1,'The manual helps, but the first time it’s best to have someone demonstrate and supervise.'],['“You can’t even do something this simple?”',0,'Sarcasm makes new staff afraid to ask, which actually increases the risk of mistakes.']],
learn:'Supporting new colleagues is part of ward safety. A team culture where people ask and teach reduces errors.'}};


/* ===== New scenario: borrowing a pen ===== */
SCN.push({id:24,dx:'Depression (borrowing a pen)',zone:'hall',e:'🖊️',urg:15,pen:1,
desc:'Bed {b} A patient comes over: “Nurse, could I borrow a pen? I want to write a letter to my family.”',
ch:[['Lend it, saying it must come straight back when they’re done; remember to collect the pen yourself',2,'The patient happily sits down to write. Remember: collect the pen later!'],['Refuse, telling them pens aren’t allowed on the ward',1,'Safe, but the patient is very disappointed. You can lend it, as long as someone supervises and collects it straight away.'],['Lend it and tell them to leave it by the bed when they’re done',0,'A pen nobody collects can become a tool for self-harm or hurting others.']],
learn:'On a psychiatric ward, everyday items like pens, cutlery and cords can become dangerous. Lending them isn’t the problem — the key is supervision, collecting them straight after use and counting them back.',

<h2>📖 About the game</h2>
<ul class="det"><li><b>Your role</b>: You are the charge nurse on a psychiatric ward. It’s a gazetted psychiatric observation and treatment ward (gazetted area), with over twenty patients with different conditions.</li>
<li><b>Your team</b>: Each shift has four nurses (charge nurse, Second, Nurse 3 for the day room, Nurse 4 for the dormitory), who are either RNs (Registered Nurses) or ENs (Enrolled Nurses); plus three support workers. Allied health staff visit during the day.</li>
<li><b>Look after yourself</b>: Watch your stress, fatigue, thirst, toilet needs and hunger. If you’re too tired or stressed, you’ll make mistakes more easily — and you’ll walk more slowly too.</li>
<li><b>Tips</b>: Time pauses whenever a window is open. The game has sound — playing with sound on is recommended. It covers how symptoms of mental illness, self-harm and violence are handled, without detailed descriptions.</li></ul>

  let pickY=ys.slice(0,2);const dd=ys.find(p=>dueAt(p,k.slot).some(m=>m.dd));if(dd&&!pickY.includes(dd))pickY[0]=dd;
  rows=[...pickY.map(p=>({p,need:true,done:false,orders:dueAt(p,k.slot)})),...ns.slice(0,4).map(p=>({p,need:false})),...ys.filter(p=>!pickY.includes(p)).slice(0,Math.max(0,4-ns.length)).map(p=>({p,need:false,other:true}))];

function buildDrawer(m){const r=m.cur,slot=m.k.slot;const packs=r.orders.map(o=>({o,bed:r.p.bed,slot,name:o.n,ok:true}));

 const later=r.p.meds.find(x=>FREQ[x.fq]&&FREQ[x.fq].includes(otherT));
 const dis=[{o:base,bed:r.p.bed,slot:otherT,name:later?later.n:pick(ANYDRUG),why:`Right time: this packet is the ${otherT} dose, not the ${slot}`}];
 if(LASA[base.n])dis.push({o:base,bed:r.p.bed,slot,name:LASA[base.n],why:`Right drug: ${LASA[base.n]} ≠ ${base.n} — a look-alike, sound-alike drug that is completely different (LASA)`});
 else{const alt=pick(ANYDRUG.filter(d=>d!==base.n));dis.push({o:base,bed:r.p.bed,slot,name:alt,why:`Right drug: the order doesn’t include ${alt}`})}

  return openM(`${head}<div class="sys"><p>Medication administration　${m.k.slot}　<span class="small"> (<span class="Y">Y</span> medication due　<span class="N">N</span> no medication due)</span></p>${m.rows.map(x=>`<div class="row" data-h="${hb(()=>{if(x.need&&!x.done){m.cur=x;buildDrawer(m);m.step='pick';medRender(m)}else if(x.done||x.other)toast('This patient has already had their medication');else{S.score-=3;toast('❌ This patient is N — no medication due this time','b')}})}"><span>Bed ${x.p.bed}　<span class="small">${x.p.diag}</span></span>${x.done||x.other?'✅':x.need?'<span class="Y">Y</span>':'<span class="N">N</span>'}</div>`).join('')}</div>`)}

 if(stNow){const p=S.patients.find(x=>x.bed===S.stBed);trays.splice(R(0,trays.length),0,{p,card:'Normal diet',got:'Normal diet',ok:false,ans:null,st:1,why:`The speech therapist has changed the diet to ${S.stDiet}, but the menu hasn’t been updated yet — a normal diet can’t be served`})}
 if(npoNow){const p=S.patients.find(x=>x.bed===S.npoBed);trays.splice(R(0,3),0,{p,card:'Normal diet',got:'Normal diet',ok:false,ans:null,npo:1,why:'The Diary says fasting bloods this morning — breakfast can’t be served'})}
 const rd=()=>openM(`<h2>${k.e} ${k.title}</h2><p class="small">Before serving ${meal?'meals':'snacks'}, check each one against the ${meal?'menu':'dietary instructions'} and what is actually being served.<b>📔 Remember to check the Diary and the latest ward updates too (e.g. the speech therapist changing a diet)!</b></p>${meal?'':`<div class="sys">📋 Snack list this round: Bed ${sList.join(', ')}</div>`}${B('📔 Open the Diary',()=>{openM(`<h2>📔 Diary</h2>${S.diary.map(d=>`<div class="task"><div class="tt">${d.done?'✅':'⬜'} ${d.x}</div></div>`).join('')}${B('Back to serving ▶',rd,'pri block ctr')}`)},'sm')}
 ${trays.map(t=>`<div class="task"><div class="tt"><b>Bed ${t.p.bed}</b><br>📄 Instruction: ${t.card}<br>${meal?'🍱':'🍪'} Actual: <b>${t.got}</b></div><div style="display:flex;flex-direction:column;gap:6px">${B('✅ Serve',()=>{t.ans=true;rd()},'sm'+(t.ans===true?' sel':''))}${B('❌ Don’t serve',()=>{t.ans=false;rd()},'sm'+(t.ans===false?' sel':''))}</div></div>`).join('')}
 ${B('Check complete ▶',()=>{if(trays.some(t=>t.ans===null)){toast('⚠️ Not all checked yet','w');return}if(!meal&&missAns===null){askMiss();return}res()},'pri block ctr')}`);

/* --- New admission --- */
function miniAdmission(e){const st=pick(['Voluntary admission','Compulsory admission (Forms 1, 2, 3)']);
 const items=[...shuffle([['Wallet (cash)','safe'],['Watch','safe'],['Mobile phone','safe']]).slice(0,2),...shuffle([['Change of clothes','store'],['Slippers','store'],['Books','store']]).slice(0,2),...shuffle([['Lighter','danger'],['Box cutter','danger'],['Cable ties','danger']]).slice(0,2)];
 const sorted={};const bpHigh=Math.random()<.5;const bp=bpHigh?'168/102':'124/78';
 const forms=['DASA','NGASR','Morse Fall Scale','Norton Scale','FTOCC','Admission notification form','CIWA-Ar'];const fsel={};
 let step=0,score=0;const N=7;const nb=S.nextBed++;
 const wrap=h=>openM(`<h2>📞 New admission (${step+1}/${N})</h2><div class="prog"><i style="width:${(step+1)/N*100}%"></i></div>${h}`);

 function draw(){
  if(step===0)wrap(`<h3>① Check the admission documents (most important!)</h3><div class="sys">📄 Admission documents<br>Patient: new admission (Bed ${nb} )<br>Admission status: <b>${st}</b><br>Referred by: A&E</div><p><b>What admission status is on the documents?</b></p>${['Voluntary admission','Compulsory admission (Forms 1, 2, 3)'].map(o=>B(o,()=>{if(o===st){score+=10;SFX.ping()}else{score-=10;SFX.bad()}next();if(o!==st)toast(`❌ The documents state “${st} “ — read them carefully`,'b')},'block')).join('')}<div class="learn small">💡 Forms 1, 2 and 3 are one set of documents under the Mental Health Ordinance for compulsory admission for observation — not three separate statuses. Nurses must check whether the patient is a voluntary or compulsory admission and, if compulsory, whether the full set of documents is complete, because it affects the patient’s rights.</div>`);

 const rd=()=>openM(`<h2>📋 Prepare for handover</h2><p class="small">Choose the key points to hand over to the next shift (remember to check unfinished items in the Diary): </p>${items.map((it,i)=>B((sel[i]?'☑️ ':'⬜ ')+it[0],()=>{sel[i]=!sel[i];rd()},'block'+(sel[i]?' okc':''))).join('')}
 ${B('Hand over ▶',()=>{let c=0;items.forEach((it,i)=>{if(!!sel[i]===!!it[1])c++});eff(c*4,0,-3);
  let key='';if(S.lostKey){key=`<div class="fb m">🔑 Before handover you put your hand in your pocket… the “${S.lostKeyName} “ key was in your pocket all along! 😅<br><span class="small">${S.keyReported?'Luckily you’d reported it early and stayed alert, so no harm was done.':'Luckily nothing happened, but not counting properly at handover is dangerous.'} Remember: return keys to their fixed place straight after use.</span></div>`;log('🔑 Key found: it was in your own pocket!')}
  const L='A good handover focuses on: patients involved in incidents, changes in high-risk patients, unfinished Diary items, and an accurate count of patients and keys.';addLearn(L);
  openM(`<h2>📋 Handover complete</h2><div class="small mute">Key handover points chosen correctly ${c}/${items.length}</div>${key}<div class="learn">💡 ${L} (patient count: ${S.patients.length})</div>${B('Done ✅',()=>{S.handoverDone=1;finishTask(k,15)},'pri block ctr')}`)},'pri block ctr')}`);
 rd()}
