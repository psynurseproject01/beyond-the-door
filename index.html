<style>

.fb{padding:10px 12px;border-radius:10px;margin:8px 0}.fb.g{background:#1f4532}.fb.b{background:#4a2426}.fb.m{background:#4a3c1e}
.learn{background:#1f3341;border:1px solid #35607a;border-radius:10px;padding:10px 12px;margin:8px 0}
.vet{background:#2f2a45;border:1px solid #6b5fa8;border-radius:10px;padding:10px 12px;margin:8px 0}
.hot{background:#3a1f26;border:1px solid #d77a8a;border-radius:12px;padding:12px 14px;margin:10px 0}
.hot b{color:#ffd0d8}.hot div{padding:3px 0}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:30;width:min(92vw,520px);pointer-events:none}
.toast{background:#0f1c20;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}
.prog{height:6px;background:#14201f;border-radius:9px;margin:6px 0 12px}.prog i{display:block;height:100%;background:var(--acc);border-radius:9px}
.people{font-size:22px;letter-spacing:2px;line-height:1.3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a{color:var(--acc)}

.chat{display:flex;flex-direction:column;gap:8px;margin-top:8px}

.who{font-size:12px;opacity:.75;display:block;margin-bottom:2px}
.credit{text-align:center;font-size:14px;color:var(--mute);margin:14px 0 4px}.credit a{font-weight:700}

.me-ring{animation:pulse2 1.4s infinite}@keyframes pulse2{50%{opacity:.35}}
.inner{background:#3b3358;border:1px dashed #a593e0;color:#e6defc;font-style:italic;align-self:flex-start;max-width:86%;padding:8px 12px;border-radius:14px;font-size:15px}
table.mini td,table.mini th{font-size:13px;padding:5px 4px}
.innerin{margin-top:8px;padding-top:6px;border-top:1px dashed #6a63a0;font-style:italic;font-size:14px;color:#d9d0ff}
.fbbox textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:#14232a;color:var(--ink);padding:12px;font:inherit;font-size:16px}
.stars{display:flex;gap:4px}.stars .btn{font-size:22px;min-width:0;flex:1;padding:8px 0;margin:4px 0;justify-content:center}

<script type="text/plain" id="g-zh">let STQ=[];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cl=v=>Math.max(0,Math.min(100,v));
const fmt=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
let H=[];const hb=f=>(H.push(f),H.length-1);
const B=(label,fn,cls='',dis=false)=>`<button class="btn ${cls}" data-h="${hb(fn)}" ${dis?'disabled':''}>${label}</button>`;
let PD=null,lastTapT=0;
document.addEventListener('pointerdown',ev=>{const b=ev.target.closest('[data-h]');if(!b||b.disabled||ev.target.closest('#joy')){PD=null;return}PD={h:+b.dataset.h,x:ev.clientX,y:ev.clientY,t:performance.now()}},true);
document.addEventListener('pointerup',ev=>{if(!PD)return;const p=PD;PD=null;if(Math.hypot(ev.clientX-p.x,ev.clientY-p.y)<14&&performance.now()-p.t<1500){lastTapT=performance.now();ac();const f=H[p.h];if(f)f()}},true);
document.addEventListener('pointercancel',()=>{PD=null},true);
document.addEventListener('click',ev=>{if(performance.now()-lastTapT<700)return;const b=ev.target.closest('[data-h]');if(b&&!b.disabled){ac();const f=H[+b.dataset.h];if(f)f(b)}});
/* 提示訊息：唔會遮住內容（喺視窗頂或者狀態列入面顯示） */
let tickT=null;
function toast(msg,c=''){
 if(S.modal&&$('#mtoast')){const m=$('#mtoast');m.className=c;m.innerHTML=msg;return}
 const t=$('#ticker');if(t){t.className=c;t.innerHTML=msg;S.tick=[msg,c];return}
 const d=document.createElement('div');d.className='toast';d.innerHTML=msg;$('#toasts').prepend(d);setTimeout(()=>d.remove(),3000)}

/* ===== 聲效 ===== */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f,d,type='sine',when=0,vol=.14){const a=AC;if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime+when);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+when+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+d+.05)}catch(e){}}
const SFX={ok(){tone(880,.14);tone(1320,.25,'sine',.12)},bad(){for(let i=0;i<4;i++){tone(540,.17,'square',i*.24,.1);tone(360,.17,'square',i*.24+.12,.1)}},ping(){tone(660,.12,'triangle')},beep(){tone(1500,.09,'square',0,.08)},phone(){for(let i=0;i<3;i++){tone(950,.08,'sine',i*.3);tone(1180,.08,'sine',i*.3+.1)}},alarm(){for(let i=0;i<3;i++)tone(720,.28,'sawtooth',i*.33,.08)}};

{k:'溫柔型',y:3,q:'EN',e:'🌸',d:'講嘢細聲輕柔，特別擅長安撫焦慮同情緒低落嘅病人。'},
{k:'行動型',y:4,q:'RN',e:'⚡',d:'反應快、手腳快，暴力事件發生時第一個衝去處理。'},
{k:'幽默型',y:5,q:'EN',e:'😄',d:'親切搞笑，識得用輕鬆方法化解病人之間嘅衝突。'},
{k:'聆聽型',y:6,q:'RN',e:'👂',d:'好有耐性，肯坐低慢慢聽病人講心事，病人好信任佢。'},

{k:'嚴謹型',y:10,q:'EN',e:'📏',d:'一絲不苟，派藥同文件紀錄從來唔會出錯，但有時顯得太緊張。'},
{k:'直率型',y:12,q:'RN',e:'🗣️',d:'firm handling，講嘢好直接，病人激動時會即刻定下清晰界線。'},
{k:'恐嚇型',y:15,q:'EN',bad:1,e:'😠',d:'反面教材：習慣用恐嚇令病人就範，又成日用暫時性約束嚟威脅唔合作嘅病人。'},
{k:'老練型',y:20,q:'RN',vet:1,e:'🦉',d:'經驗豐富，好識睇病人情緒變化；佢返工嗰更會主動提點你。'}];

A:{name:'A 更',range:'07:00–14:30',start:420,end:870,support:3},
P:{name:'P 更',range:'14:00–21:30',start:825,end:1290,support:3}};

const ZONES={bed:['睡房','🛏️','病人休息嘅地方，由四號護士負責。'],ns:['護士站','🧑‍⚕️','病房嘅統籌中心。'],hall:['大廳','🛋️','有梳化、枱、凳同電視機，由三號護士負責。'],wc:['廁所／沖涼房','🚿','廁格同沖涼房都用半截門，護士行近時可以望到入面情況，保障安全。'],tr:['Treatment room','💉','同護士站隔住一條走廊，儲存藥物、針筒等醫療用品，亦係擺藥車嘅地方。'],pantry:['茶水間','🫖','支援部同事斟水、存放病人零食嘅地方。'],visit:['探病室','👪','喺病房另一邊，俾家屬探病用。'],door:['出入口','🚪','病房出入口。']};

const CREDIT='<div class="credit">🎮 Game designed by <a href="https://www.instagram.com/psynurse.project01/" target="_blank" rel="noopener">@psynurse.project01</a></div>';
const SCN=[
{id:1,dx:'思覺失調',risk:['Violence risk','High'],zone:'hall',e:'🪑',urg:6,intim:1,
desc:'大廳突然傳嚟嗌聲！{b} 號床病人雙手舉起張凳，大叫：「把聲叫我掟落佢哋度！」周圍仲有幾位病人。',
ch:[['先疏散周圍病人，保持安全距離；用平靜語氣叫佢、承認佢聽到聲音好辛苦，邀請佢慢慢放低張凳；同時叫 Second 通知醫生、同事準備支援',2,'你先保障咗所有人嘅安全，再用降溫技巧（de-escalation）令病人慢慢冷靜落嚟。'],['即刻一個人衝上前搶走張凳',0,'單獨衝前好易令雙方受傷，亦會令病人更驚、更激動。'],['大聲喝佢：「放低！唔係就綁你！」',0,'威嚇只會加劇病人嘅恐懼同敵意，令場面更難收拾。']],
learn:'幻聽係思覺失調常見嘅病徵，對病人嚟講，嗰把聲係好真實、好可怕嘅。護士唔會同病人爭拗把聲係咪真，而係用降溫技巧：確保環境安全、保持距離、語氣平穩、俾病人有選擇。約束只係最後手段。',

{id:2,dx:'人格障礙兼長期濫藥',risk:['Violence risk','Moderate'],zone:'ns',e:'🚬',urg:15,intim:1,
desc:'{b} 號床病人喺護士站前面拍枱：「唔俾我食煙？我拆咗你個病房！」',
ch:[['保持冷靜，清楚講明病房禁煙規定同原因；同時提出替代方法，例如請醫生評估使唔使用尼古丁貼或者香口膠，再傾吓其他減壓方法',2,'堅定但尊重，仲俾咗佢實際嘅支援，病人慢慢肯坐低傾。'],['為咗息事寧人，偷偷俾佢出去食一支',0,'違反規定、破壞界線，下次佢會用同一招；而且帶病人出病房有走失風險。'],['完全唔理佢，等佢嗌到攰',1,'暫時唔回應挑釁有時有用，但要持續觀察，同埋要提供支援，唔可以完全唔理。']],
learn:'有啲人格障礙病人會試探界線。護士要做到「堅定但尊重」：規則一致、態度溫和，同時提供戒斷支援，例如尼古丁替代療法。',
vet:'講規矩之前，先講一句「我明白你好想食煙，戒斷真係好辛苦」，佢會聽得入耳好多。'},
{id:3,dx:'輕度智障',risk:['Self-harm risk','Moderate'],zone:'hall',e:'🧱',urg:6,intim:1,
desc:'{b} 號床病人因為冇零食食，好嬲咁不停用個頭撞牆，額頭已經紅咗一大片。',
ch:[['即刻上前，用軟墊或者手隔開保護佢個頭；用簡單句子同佢講「零食時間到就有，我哋一齊睇個鐘」，再用佢鍾意嘅活動轉移注意力；之後檢查頭部有冇受傷',2,'先保護安全，再用簡單清晰嘅溝通同轉移注意力，佢慢慢停咗落嚟。'],['即刻俾零食佢，等佢停',1,'可以即時停止傷害，但長遠會令佢學識「撞頭就有零食」。'],['叫佢返房自己冷靜',0,'佢會繼續撞頭，自己一個更危險。']],
learn:'智障病人表達能力有限，撞頭可能係佢表達不滿嘅方法。護士會先保障安全，再用簡單溝通、視覺時間表同行為治療計劃，教佢用其他方法講出需要。',
vet:'同呢類病人傾，句子要短、要具體，配合手勢同圖卡，效果好好多。'},
{id:4,dx:'輕度智障',risk:['Violence risk','Low'],zone:'hall',e:'🩲',urg:15,
desc:'{b} 號床病人又喺大廳除晒衫褲，地上有大小便，佢仲用手搽咗落牆度。',
ch:[['先用毛巾或者屏風保護佢私隱，帶佢去沖涼房清潔同換衫；叫支援部同事清理同消毒現場；記錄行為，之後同團隊檢討定時帶佢去廁所',2,'你保住咗病人嘅尊嚴，又處理好感染控制。'],['當眾鬧佢：「好核突呀！」',0,'羞辱會傷害病人尊嚴，亦唔會改善行為。'],['叫其他病人唔好望，等佢自己着返衫',0,'冇即時保護私隱同清潔，感染風險高。']],
learn:'呢類行為可能同認知能力、未學識如廁或者感官需要有關。護士要保障病人嘅尊嚴同私隱，並同職業治療師等團隊制定如廁訓練計劃。',
vet:'每兩個鐘主動帶佢去一次廁所，好多時可以預防返呢類情況。'},
{id:5,dx:'抑鬱症',risk:['Suicidal risk','High'],zone:'bed',e:'🩹',urg:5,
desc:'你巡睡房時，見到 {b} 號床病人坐喺床邊，手臂有新傷口流緊血，身邊有件收埋咗嘅利器。',
ch:[['即刻叫同事支援，冷靜陪住病人、移走利器；為傷口止血同評估傷勢，通知醫生；之後陪佢傾，了解佢嘅感受，並加強觀察同做全面安全檢查',2,'你即時保障咗病人安全，又冇批判佢，佢終於肯講出心入面嘅辛苦。'],['即刻鬧佢點解要咁做',0,'責罵會令病人更羞愧、更封閉。'],['先走去攞敷料，留佢自己喺度',0,'高自殺風險嘅病人唔可以留低一個人。']],
learn:'自傷係表達極度痛苦嘅訊號，唔係「博同情」。護士會即時處理傷口、確保安全，用不批判嘅態度聆聽，並按風險安排密切觀察（自殺觀察表，suicidal observation chart）。',
vet:'事後記得檢查床鋪、衣物同個人物品，利器好多時收埋喺意想不到嘅地方。'},
{id:6,dx:'成人精神科病人（兩位）',risk:['Violence risk','High'],zone:'hall',e:'📺',urg:6,two:1,
desc:'{b} 號床同 {b2} 號床病人為咗睇邊個電視台嗌起上嚟，其中一位已經揸住拳頭行埋去！',
ch:[['即刻叫同事支援，分開兩位病人去唔同位置，分別聆聽佢哋嘅不滿；之後同大家訂一個輪流揀台嘅時間表',2,'及時分開雙方，冇人受傷，仲搵到長遠嘅解決方法。'],['熄咗部電視，大家都冇得睇',1,'暫時移走導火線有用，但要配合分開同安撫，唔係熄完就算。'],['自己企喺兩個人中間硬拉開佢哋',0,'一個人企喺中間好易受傷，要有足夠人手先介入。']],
learn:'病房生活空間有限，小事都可以引發衝突。護士要及早察覺張力，人手足夠先介入，並用公平、清晰嘅規則預防衝突。',
vet:'打交前通常有先兆：聲大、企近、揸拳頭。見到就要即刻行埋去，唔好等。'},
{id:7,dx:'認知障礙症（行動不便）',risk:['跌倒及走失風險','High'],zone:'hall',e:'🧓',urg:8,
desc:'坐喺大班椅嘅 {b} 號床長者突然想自己企起身：「我要去廁所！我要搭巴士返屋企！」之後一直向病房大門方向行。',
ch:[['即刻上前扶住佢，先陪佢去廁所解決急尿；之後用佢熟悉嘅話題安撫，例如問佢屋企嘅事；同時留意病房出入口安全',2,'先處理佢真正嘅需要（急尿），再用確認技巧安撫，佢冇再嚷住走。'],['叫佢坐低唔好郁，等同事得閒先帶佢去廁所',0,'急尿得唔到處理，佢會再自己起身，跌倒風險更高。'],['同佢講：「你返唔到屋企㗎！」',0,'直接否定會令認知障礙病人更焦慮、更想走。']],
learn:'認知障礙症病人嘅「要返屋企」，好多時係表達不安或者有未滿足嘅需要（例如肚餓、急尿）。護士會用確認（validation）技巧，先回應感受，再處理需要。',
vet:'佢成日話要返屋企，可以問佢「屋企有咩人等緊你呀？」，傾吓傾吓佢就會放鬆。'},
{id:8,dx:'思覺失調（拒絕服藥）',risk:['Violence risk','Moderate'],zone:'ns',e:'💊',urg:10,trig:'med',intim:1,
desc:'派藥時，{b} 號床病人一手推開藥杯：「呢啲唔係藥，係毒藥！你哋想毒死我！」',
ch:[['唔強迫，冷靜聆聽佢嘅擔心；向佢解釋藥物名稱同作用，可以俾佢睇藥袋標籤；如果仍然拒絕，記錄低，通知醫生跟進',2,'你尊重咗病人，佢雖然今次未肯食，但對你嘅信任增加咗，醫生亦可以及早調整治療。'],['同佢講：「唔食就同你打針！」',0,'恐嚇會破壞治療關係，令佢更加覺得有人要害佢。'],['偷偷將藥撈落佢啲飯度',0,'喺病人唔知情之下落藥，違反專業操守。']],
learn:'拒絕服藥可能源於妄想、副作用或者對病情缺乏認知。護士會了解原因、解釋清楚、記錄並通知醫生，唔會強迫或者欺騙病人。',
vet:'有時換一位病人信任嘅同事去派，或者遲十五分鐘再試，效果會好啲。'},
{id:9,dx:'思覺失調（懷疑落毒）',risk:['Violence risk','Moderate'],zone:'hall',e:'🍚',urg:12,trig:'meal',shifts:'AP',
desc:'食飯時間，{b} 號床病人推開餐盒：「你哋喺啲飯餸度落咗毒！」',
ch:[['唔爭拗，表示明白佢嘅擔心；可以俾佢自己揀餐盒，或者喺佢面前打開密封餐；記錄進食量，通知營養師同醫生',2,'你俾咗病人掌控感，佢最後食咗半盒飯。'],['同佢講：「唔食就冇得食！」',0,'威脅會令佢更加唔肯食，營養都成問題。'],['喺佢面前試食一啖證明冇毒',1,'有時有用，但唔衛生，亦唔係長遠方法。']],
learn:'被害妄想嘅病人會覺得食物有問題。護士會尊重佢、提供選擇，同時監察營養同體重。',
vet:'密封嘅預製餐、或者俾佢自己揀，佢會安心好多。'},
{id:10,dx:'有胃喉嘅病人',zone:'bed',e:'🧪',urg:10,
desc:'{b} 號床病人用手拉住條胃喉，膠布已經甩咗一半。',
ch:[['即刻溫和制止，檢查胃喉位置同標記長度；如果有移位就暫停餵食、通知醫生；同病人解釋胃喉用途，了解佢點解唔舒服',2,'及早發現，避免咗胃喉移位後餵食嘅危險。'],['照樣繼續餵奶',0,'胃喉移位時餵食，有機會令食物入咗肺。'],['幫佢拔埋條喉',0,'護士唔可以自行決定拔喉，要醫生評估。']],
learn:'有胃喉嘅病人要定時檢查喉嘅位置，餵食前要確認喉喺正確位置；亦要了解病人拔喉嘅原因，例如唔舒服或者思緒混亂。',
vet:'膠布貼喺鼻同面頰兩個位，再用衫夾固定條喉，可以減少佢拉到。'},
{id:11,dx:'有尿喉嘅病人',zone:'bed',e:'🧴',urg:15,
desc:'支援部同事報告：「主管，{b} 號床個尿袋好少尿，顏色好深，病人話下腹痛。」',
ch:[['檢查尿喉有冇扭曲或者閉塞，觀察尿液，量體溫；記錄出入量（intake and output chart），通知醫生',2,'原來條喉扭咗，處理後尿液順利流出，醫生亦安排咗驗尿。'],['倒咗尿袋就算',0,'冇處理到可能嘅閉塞或者感染。'],['叫病人飲多啲水，下更先再睇',1,'飲水有幫助，但下腹痛加尿少要即時檢查。']],
learn:'有尿喉嘅病人要定時清尿袋、記錄尿量，留意有冇感染、閉塞或者被病人自己拔走。',
vet:'尿袋要放低過膀胱位置，條喉唔好壓住，好多問題就咁避免到。'},
{id:12,dx:'躁狂症（雙相情緒障礙）',zone:'hall',e:'⚡',urg:15,
desc:'{b} 號床病人講嘢好快，周圍搵人傾偈，話要將所有錢捐晒出去，仲問其他病人攞電話。',
ch:[['帶佢去安靜啲嘅地方，減少刺激；用簡短清晰嘅句子同佢傾，溫和設定界線；保障佢嘅財物同其他病人私隱；記錄情緒紀錄表',2,'減少刺激之後，佢慢慢平靜咗少少。'],['同佢一齊興奮咁傾',0,'會令佢更亢奮。'],['鬧佢收聲',0,'容易激怒佢，引發衝突。']],
learn:'躁狂期病人精神亢奮、睡眠少、判斷力下降，容易做出衝動決定（例如亂花錢）。護士會減少環境刺激、保障安全同財物，並留意佢有冇足夠休息同飲食。',
vet:'俾佢做啲簡單、唔使諗太多嘅活動，例如摺毛巾，可以幫佢消耗精力。'},
{id:13,dx:'酒精戒斷',risk:['Medical risk（戒斷併發症）','High'],zone:'bed',e:'🍺',urg:8,
desc:'{b} 號床病人入院第二日，雙手好震、大汗、心跳快，指住牆話見到有蟲爬。',
ch:[['即刻量維生指數，填 CIWA-Ar 評估戒斷嚴重程度，通知醫生（可能需要處方藥物）；保持環境光猛安靜，預防跌倒同抽筋',2,'及時評估同通知醫生，避免戒斷惡化。'],['同佢講「冇蟲呀，你幻覺嚟」，然後走開',0,'嚴重酒精戒斷可以有生命危險，唔可以忽視。'],['等下一輪量維生指數先算',0,'戒斷徵狀可以好快惡化，要即時處理。']],
learn:'酒精戒斷通常喺停飲後一至三日出現，嚴重時會有幻覺、抽筋，甚至危及生命。護士會用 CIWA-Ar 定時評估，配合醫生治療。',
vet:'戒斷病人夜晚特別容易混亂，房間開返盞細燈，佢會冇咁驚。'},
{id:14,dx:'強迫症',zone:'wc',e:'🧼',urg:20,
desc:'{b} 號床病人喺廁所洗手洗咗半個鐘，雙手洗到爆拆，其他病人喺門口排緊隊。',
ch:[['溫和同佢傾，約定時間（例如再洗兩分鐘）陪佢慢慢停；安排其他病人用另一格；之後幫佢搽潤膚膏，同臨床心理學家跟進',2,'你用耐性陪佢逐步停止，佢冇咁焦慮。'],['即刻熄水喉，趕佢出嚟',0,'強行打斷會令焦慮急升。'],['由得佢洗夠為止',0,'皮膚會受損，亦影響其他病人。']],
learn:'強迫症病人明知行為過分，但停唔到，因為唔做會好焦慮。治療會用認知行為治療等方法，護士喺日常會支持佢逐步減少強迫行為。',
vet:'唔好同佢講「你洗得好乾淨㗎啦」，越安慰佢越要確認。用計時器幫佢定時間仲好。'},
{id:15,dx:'飲食失調',zone:'hall',e:'🥄',urg:20,trig:'meal',shifts:'AP',
desc:'支援部同事偷偷話你知：{b} 號床病人將啲飯收埋喺紙巾同衫袋入面。',
ch:[['唔當眾指責，私下溫和同佢傾；之後陪佢食飯，記錄進食量同體重，通知營養師同醫生',2,'你保住咗病人面子，佢肯講出佢對體重嘅恐懼。'],['當眾搜佢衫袋',0,'會令病人羞愧，之後更加收埋。'],['佢唔食就由佢，尊重佢',0,'飲食失調可以危及生命，唔可以由得佢。']],
learn:'飲食失調唔係「揀飲擇食」，而係嚴重嘅精神病。護士會監察進食同體重，用支持嘅態度陪伴，並同營養師、心理學家合作。',
vet:'食飯時同佢傾啲輕鬆話題，唔好集中講食物同體重。'},
{id:16,dx:'思覺失調（被害妄想）',zone:'bed',e:'🕵️',urg:20,intim:1,
desc:'{b} 號床病人縮喺床邊：「外面有人跟蹤我，我唔出去！」唔肯出嚟食飯食藥。',
ch:[['唔爭拗妄想內容，承認佢嘅恐懼；由佢信任嘅同事、喺安全距離同佢傾，俾佢自己決定喺邊度食；記錄情緒同進食',2,'病人覺得被尊重，願意喺房門口食飯。'],['同佢講「邊有人跟你，你諗多咗」',1,'直接否定通常冇效，仲可能令佢覺得你唔明佢。'],['幾個同事一齊將佢拉出房',0,'會加強佢「有人要害我」嘅想法。']],
learn:'妄想係病人堅信嘅想法，講道理好難改變。護士會建立信任、減少威脅感，配合藥物治療慢慢改善。',
vet:'同佢傾嘅時候坐低、唔好企得太近，佢會覺得安全啲。'},
{id:17,dx:'思覺失調（拒絕沖涼）',zone:'wc',e:'🚿',urg:20,trig:'bath',shifts:'A',intim:1,
desc:'沖涼時間，{b} 號床病人已經幾日冇沖涼，身上有明顯異味，佢大叫：「我唔沖！」',
ch:[['了解佢唔肯沖涼嘅原因（例如驚水、私隱、幻聽）；俾佢選擇：遲啲先沖、自己揀衫、由佢信任嘅同事協助；可以先由抹身開始',2,'佢話怕水太熱，調好水溫後佢肯沖咗。'],['幾個同事夾硬帶佢入沖涼房',0,'強迫會令病人覺得受辱，以後更抗拒。'],['由得佢唔沖',0,'長期唔清潔會引致皮膚問題同感染。']],
learn:'思覺失調病人可能因為動機下降（陰性病徵）或者妄想而唔肯打理個人衛生。護士會了解原因，用耐性同選擇鼓勵佢。',
vet:'一步一步嚟：今日洗面、聽日換衫、後日沖涼，佢會容易接受啲。'},
{id:18,dx:'長期病患兼糖尿病（等出院）',zone:'ns',e:'🩸',urg:20,
desc:'{b} 號床病人等緊出院，但佢話唔想打胰島素，仲偷食咗朱古力。探完血糖係 15.2 mmol/L（每公升毫摩爾）。',
ch:[['記錄血糖，通知醫生；用簡單方法同佢傾飲食同胰島素嘅重要性，請營養師跟進餐單，教佢出院後點樣自我管理',2,'病人明白咗點解要打針，願意學點樣自己探血糖。'],['鬧佢唔聽話',0,'責罵唔會改變行為，仲會令佢之後唔講真話。'],['等下一次探血糖再算',0,'血糖偏高要及時處理同通知醫生。']],
learn:'精神科病人都可能有身體病。護士要同時照顧身心，出院前教病人自我管理，幫佢順利返回社區。',

/* ===== 隨機（避免連續幾更重複） ===== */
function memGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function memSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function pickFresh(arr,n,key,idf){const last=memGet(key);const fresh=shuffle(arr.filter(x=>!last.includes(idf(x)))),old=shuffle(arr.filter(x=>last.includes(idf(x))));const r=[...fresh,...old].slice(0,n);memSet(key,r.map(idf));return r}

function nextStable(){if(!STQ.length)STQ=shuffle(STABLEP);return STQ.pop()}

function spdF(){const s=S.st;const o=Math.max(...['stress','fatigue','thirst','bladder','hunger'].map(k=>Math.max(0,((s[k]||0)-50)/50)));return Math.max(.55,1-.45*Math.min(1,o))}
const SELFT={stress:[70,'💭 深呼吸……一件一件嚟。'],fatigue:[70,'💭 好攰呀……對腳好重。'],thirst:[70,'💭 成朝冇飲過啖水……個喉好乾。'],bladder:[75,'💭 忍咗好耐……要搵個空檔去廁所。'],hunger:[70,'💭 個肚打晒鼓……幾時先食到飯？']};
function selfThought(){if(S.t%15)return;if(S.bubble&&performance.now()<S.bubble.until)return;S.thoughtAt=S.thoughtAt||{};

function step(){S.t++;const s=S.st,k=S.sick?1.3:1;
 s.fatigue=cl(s.fatigue+.05*k);s.thirst=cl(s.thirst+.13);s.bladder=cl(s.bladder+.1);s.hunger=cl(s.hunger+.08);
 selfThought();
 const act=S.events.filter(e=>e.state==='active').length;

const KEYS=['病房大門','護士站','Treatment room','藥車','DD 櫃','茶水間','探病室','夾萬'];
function miniCount(k){const n=S.patients.length;const wc=R(1,2),bed=R(4,8),vis=S.shift==='P'?R(1,2):0;const z={'🛏️ 睡房':bed,'🚻 廁所／沖涼房':wc};if(vis)z['👪 探病室']=vis;z['🛋️ 大廳']=n-bed-wc-vis;
 const opts=shuffle([n-1,n,n+1]);
 openM(`<h2>🔑 交更點算（1/2）：病人人數</h2><div class="learn small">👥 <b>點人數</b>：確保每位病人都安全喺病房，冇人身體不適或者需要即時關顧而未被發現，亦令接更同事清楚掌握每位病人嘅情況。<br>🔑 <b>點鎖匙</b>：鎖匙可以打開藥櫃、治療室同儲物室，一旦遺失，藥物同潛在危險物品可能落入唔適當嘅人手中，危及病人同職員安全。<br>兩樣都係交接責任嘅一部分，點清楚先算正式接更。</div><p>逐區數吓：</p>
 ${Object.entries(z).map(([a,b])=>`<div class="task"><div class="tt"><b>${a}</b><div class="people">${'🧍'.repeat(b)}</div></div></div>`).join('')}
 <p><b>👉 你點到幾多位？</b></p><div class="grid2">${opts.map(o=>B(o+' 位',()=>{if(o===n){eff(10,0,-2);SFX.ok();countKeys(k,'✅ 人數正確','g')}else{eff(-10,0,6);SFX.bad();countKeys(k,`❌ 數錯咗！應該係 ${n} 位，交更點人數一定要準`,'b')}},'ctr')).join('')}</div>`)}
function countKeys(k,msg,c){let shown=KEYS.slice();if(S.lostKey){S.lostKeyName=pick(KEYS.slice(2));shown=shown.filter(x=>x!==S.lostKeyName)}
 const openKeyEv=()=>{const e={kind:'gen',d:SUD.keys,t:S.t,state:'pending'};S.events.push(e);closeM();activate(e);openEvent(e)};
 openM(`<h2>🔑 交更點算（2/2）：鎖匙</h2><p>鎖匙登記簿寫住應有 <b>${KEYS.length}</b> 條。喺病房入面，鎖匙同病人人數一樣重要！</p>
 <div class="grid2">${shown.map(x=>`<div class="task"><div class="tt">🔑 ${x}</div></div>`).join('')}</div><p><b>👉 鎖匙齊唔齊？</b></p>
 ${B(`✅ ${KEYS.length} 條，齊晒`,()=>{if(!S.lostKey){eff(10,0,-2);SFX.ok();finishTask(k)}else{eff(-25,-5,10);SFX.bad();addLearn(SUD.keys.learn);log('❌ 交更時漏咗發現少咗一條鎖匙！');openM(`<div class="fb b">❌ 你再數一次……只有 ${shown.length} 條！少咗「${S.lostKeyName}」嗰條。</div>${B('即刻跟進 ▶',()=>{k.state='done';S.dirty=true;openKeyEv()},'pri block ctr')}`)}},'block')}
 ${B('⚠️ 少咗一條！',()=>{if(S.lostKey){eff(15,0,4);S.keyReported=true;SFX.alarm();k.state='done';S.score+=10;S.dirty=true;openKeyEv()}else{eff(-5,0,3);toast('🤔 再數一次……其實齊晒。冷靜啲，逐條對。','w');setTimeout(()=>finishTask(k,5),900)}},'block')}`);
 if(msg)toast(msg,c)}

/* ===== 電子派藥（三核五對，用病人真實處方） ===== */
const RIGHTS=[['Right patient','正確嘅病人'],['Right time','正確嘅時間'],['Right drug','正確嘅藥物'],['Right dose','正確嘅分量'],['Right route','正確嘅俾藥途徑']];
const dueAt=(p,slot)=>p.meds.filter(m=>FREQ[m.fq].includes(slot));
function miniMed(k,opt={}){const stat=opt.stat;let rows;
 if(stat){const p=S.patients.find(x=>x.bed===k.bed)||S.patients[0];rows=[{p,need:true,done:false,orders:[{n:'Lorazepam',dose:1,per:1,fq:'STAT',form:'粒',dd:true,route:'口服（STAT）',unit:'mg'}]}]}
 else{const ys=shuffle(S.patients.filter(p=>dueAt(p,k.slot).length));const ns=shuffle(S.patients.filter(p=>!dueAt(p,k.slot).length));
  let pickY=ys.slice(0,2);const dd=ys.find(p=>dueAt(p,k.slot).some(m=>m.dd));if(dd&&!pickY.includes(dd))pickY[0]=dd;
  rows=[...pickY.map(p=>({p,need:true,done:false,orders:dueAt(p,k.slot)})),...ns.slice(0,4).map(p=>({p,need:false})),...ys.filter(p=>!pickY.includes(p)).slice(0,Math.max(0,4-ns.length)).map(p=>({p,need:false,other:true}))];
  if(!pickY.length){const p=pick(S.patients);rows.unshift({p,need:true,done:false,orders:[{n:'Paracetamol',dose:500,per:500,fq:'PRN',form:'粒',route:'口服（有需要時）',unit:'mg'}]})}}
 const m={k,stat,step:stat?'list':'login',rows:stat?rows:shuffle(rows),cur:null,wrong:Math.random()<.4};medRender(m)}
function buildDrawer(m){const r=m.cur,slot=m.k.slot;const packs=r.orders.map(o=>({o,bed:r.p.bed,slot,name:o.n,ok:true}));
 const other=pick(S.patients.filter(p=>p.bed!==r.p.bed));const base=r.orders[0];const otherT=m.k.other;
 const later=r.p.meds.find(x=>FREQ[x.fq]&&FREQ[x.fq].includes(otherT));
 const dis=[{o:base,bed:r.p.bed,slot:otherT,name:later?later.n:pick(ANYDRUG),why:`Right time：呢包係 ${otherT} 嘅藥，唔係 ${slot}`}];
 if(LASA[base.n])dis.push({o:base,bed:r.p.bed,slot,name:LASA[base.n],why:`Right drug：${LASA[base.n]} ≠ ${base.n}，名似但係完全唔同嘅藥（LASA）`});
 else{const alt=pick(ANYDRUG.filter(d=>d!==base.n));dis.push({o:base,bed:r.p.bed,slot,name:alt,why:`Right drug：醫囑冇 ${alt}`})}
 m.drawer=shuffle([...packs,...shuffle(dis).slice(0,2)]);m.pickSel=new Set()}
function medRender(m){const head=`<h2>💊 ${m.k.title}</h2><div class="small mute">🖥️ 電子派藥系統（遊戲模擬）${S.cart?'　🛒 藥車喺你身邊':''}</div>`;const r=m.cur;
 if(m.step==='login')return openM(`${head}<div class="sys" style="text-align:center"><div style="font-size:34px">🔐</div><p>職員編號：●●●●●●<br>密碼：●●●●●●●●</p>${B('登入',()=>{m.step='menu';medRender(m)},'pri ctr')}</div>`);
 if(m.step==='menu')return openM(`${head}<div class="sys"><p>請選擇功能：</p>${shuffle(['臨床派藥','病人資料','報表']).map(x=>B(x,()=>{if(x==='臨床派藥'){m.step='list';medRender(m)}else{S.score-=3;toast('❌ 派藥要揀「臨床派藥」','b')}},'block')).join('')}</div>`);
 if(m.step==='list'){const left=m.rows.filter(x=>x.need&&!x.done).length;
  if(!left){eff(m.stat?20:25,3,-3);const L='三核五對：攞藥袋出嚟、掃藥袋執藥、放返藥袋入櫃桶，三次核對；每次都要確認 Right patient、time、drug、dose、route。最後掃手帶確認病人身份。危險藥物（DD，例如所有 benzodiazepine）要兩位護士核對，至少一位係 RN。';addLearn(L);
   return openM(`<h2>✅ ${m.k.title}完成</h2><div class="learn">💡 <b>三核五對</b><br>${L}</div>${S.vet?'<div class="vet">🦉 老練型同事：「派藥時唔好俾人打擾，有事叫 Second 先頂住。名似嘅藥（LASA）要特別留神。」</div>':''}${B('完成 ✅',()=>finishTask(m.k,10),'pri block ctr')}`)}
  return openM(`${head}<div class="sys"><p>臨床派藥　${m.k.slot}　<span class="small">（<span class="Y">Y</span> 要派藥　<span class="N">N</span> 冇藥派）</span></p>${m.rows.map(x=>`<div class="row" data-h="${hb(()=>{if(x.need&&!x.done){m.cur=x;buildDrawer(m);m.step='pick';medRender(m)}else if(x.done||x.other)toast('呢位已經派咗');else{S.score-=3;toast('❌ 呢位係 N，今次冇藥要派','b')}})}"><span>床 ${x.p.bed}　<span class="small">${x.p.diag}</span></span>${x.done||x.other?'✅':x.need?'<span class="Y">Y</span>':'<span class="N">N</span>'}</div>`).join('')}</div>`)}
 const mar=`<div class="mar"><b>📋 醫囑（床 ${r.p.bed}｜${m.k.slot}）</b>${r.orders.map(o=>`<div><span class="lamp"></span>${o.n}　<b>${o.dose} ${o.unit}</b>　${o.route}${o.dd?'　🔴 DD':''}</div>`).join('')}</div>`;
 if(m.step==='pick')return openM(`${head}${mar}<h3>① 第一次核對：由藥車攞藥袋出嚟</h3><p class="small">呢位病人嘅櫃桶有以下藥袋。對住醫囑，㩒選<b>今次</b>要派、<b>啱藥名、啱時間、啱規格</b>嘅藥袋：</p>
  ${m.drawer.map((pk,i)=>`<button class="pack ${m.pickSel.has(i)?'sel':''}" data-h="${hb(()=>{m.pickSel.has(i)?m.pickSel.delete(i):m.pickSel.add(i);medRender(m)})}"><span class="pi">${pk.o.dd&&pk.ok?'🔴':'💊'}</span><span><b>${pk.name}</b>　${pk.o.per} ${pk.o.unit}/${pk.o.form}<br>${pk.slot}</span><span style="margin-left:auto">${m.pickSel.has(i)?'✅':''}</span></button>`).join('')}
  ${B('攞出，下一步 ▶',()=>{const sel=[...m.pickSel].map(i=>m.drawer[i]);const wrong=sel.filter(p=>!p.ok);const names=[...new Set(r.orders.map(o=>o.n))];const miss=names.filter(n=>!sel.some(p=>p.ok&&p.name===n)).map(n=>({name:n}));const dup=names.filter(n=>sel.filter(p=>p.ok&&p.name===n).length>1);
   if(dup.length){S.score-=3;SFX.bad();toast('❌ 同一隻藥揀一包就得：'+dup.join('、'),'b');return}
   if(wrong.length||miss.length){S.score-=8;SFX.bad();toast('❌ '+[...wrong.map(w=>w.why),...miss.map(p=>'漏咗：'+p.name)].join('；'),'b');return}
   SFX.ok();m.packs=sel.map(p=>({...p,scan:false,cnt:null}));m.step='prep';medRender(m)},'pri block ctr')}`);
 if(m.step==='prep'){const allDone=m.packs.every(p=>p.scan&&p.cnt!==null);
  return openM(`${head}${mar}<h3>② 第二次核對：掃藥袋，執藥</h3>${m.packs.map(p=>{const o=p.o,n=o.dose/o.per;const opts=shuffle([...new Set([n,n*2,Math.max(.5,n/2)])]);
   return `<div class="drug"><b>${p.name}</b>　${o.per} ${o.unit}/${o.form}<br><span class="small">醫囑：${o.dose} ${o.unit}</span><div>${p.scan?'<div class="fb g small">📟 嗶！藥袋吻合 ✅</div>':B('📟 用 hanger 掃藥袋',()=>{p.scan=true;SFX.beep();medRender(m)},'sm')}</div>
   ${p.scan?`<div class="small">要執幾多${o.form}？</div><div>${opts.map(v=>B(`${v} ${o.form}`,()=>{if(v===n){p.cnt=v;SFX.ping();medRender(m)}else{S.score-=6;SFX.bad();toast(`❌ Right dose：${o.dose} ${o.unit} ÷ ${o.per} ${o.unit}/${o.form} = ${n} ${o.form}`,'b')}},'sm'+(p.cnt===v?' okc':''))).join('')}</div>`:''}</div>`}).join('')}
   ${B('下一步 ▶',()=>{if(!allDone){toast('⚠️ 每包藥都要掃描同執好分量','w');return}m.rights=[0,0,0,0,0];m.step='three';medRender(m)},'pri block ctr')}`)}
 if(m.step==='three'){const vals=[`床 ${r.p.bed}`,m.k.slot,m.packs.map(p=>p.name).join('、'),m.packs.map(p=>`${p.o.dose} ${p.o.unit}（${p.cnt} ${p.o.form}）`).join('、'),[...new Set(m.packs.map(p=>p.o.route))].join('、')];
  return openM(`${head}<h3>③ 第三次核對：將藥袋放返入櫃桶前</h3><p class="small">對住醫囑同藥袋，再睇一次五對：</p><div class="mar">${RIGHTS.map((x,i)=>`<div>✔️ <b>${x[0]}</b> ${x[1]}：${vals[i]}</div>`).join('')}</div>
  ${B('✅ 五對無誤，放返藥袋，Proceed ▶',()=>{SFX.ping();m.step=m.packs.some(p=>p.o.dd)?'dd':'sum';medRender(m)},'pri block ctr')}`)}
 if(m.step==='dd'){m.ddSel=m.ddSel||new Set();const ppl=[{k:'你（主管）',q:'RN'},...S.team.map(n=>({k:n.k+'同事',q:n.q})),{k:'支援部同事',q:'—',sup:1}];const dn=m.packs.filter(p=>p.o.dd).map(p=>p.name).join('、');
  return openM(`${head}<h3>🔴 危險藥物（DD）</h3><div class="fb m">${dn} 屬危險藥物（香港所有 benzodiazepine 都係 DD）。派發前要<b>兩位護士</b>一齊核對、點存量同簽 DD 登記簿，當中<b>至少一位係 RN 註冊護士</b>。</div><p>揀兩位負責核對：</p>
  ${ppl.map((p,i)=>B(`${m.ddSel.has(i)?'☑️':'⬜'} ${p.k}　<span class="tag ${p.q}">${p.q}</span>`,()=>{m.ddSel.has(i)?m.ddSel.delete(i):m.ddSel.size<2&&m.ddSel.add(i);medRender(m)},'block'+(m.ddSel.has(i)?' okc':''))).join('')}
  ${B('核對同簽 DD 簿 ▶',()=>{const s=[...m.ddSel].map(i=>ppl[i]);if(s.length<2){toast('⚠️ 要揀兩位','w');return}
   if(s.some(p=>p.sup)){S.score-=8;SFX.bad();toast('❌ DD 核對要由護士負責，支援部同事唔可以','b');return}

  ['「聽落入院令你覺得，好似失去咗最後一樣可以控制嘅嘢，所以好唔安。」',2,'佢眼淚流咗出嚟：「係……我係咪一世都要人睇住食？」','承認病人嘅失落感，令佢覺得被明白。'],
  ['「醫院有醫院嘅規矩。」',0,'佢別過面。','只講規矩，會令病人覺得自己再一次被控制。'],
  ['「你可以控制其他嘢呀，例如溫書。」',1,'「……都唔同嘅。」','可以之後一齊探索，但太快俾建議。']]},
 {p:'「我係咪一世都要人睇住食？同學知道我入咗精神科會點講？」',i:'返學之後，大家會唔會當我怪人？',ch:[
  ['「而家有人陪住食，係康復初期嘅支援，唔係一世。隨住你慢慢好返，會逐步交返主導權俾你。返學嘅事，講唔講、講幾多都由你決定，社工都可以幫手諗。」',2,'佢深呼吸咗一下：「逐步……」','提供清晰資訊，減少對未來嘅恐懼；尊重私隱，處理污名帶嚟嘅擔心。'],
  ['「同學點講都唔關你事啦。」',1,'「點會唔關事……」','想減輕佢嘅擔心，但輕視咗社交壓力。'],
  ['「你唔食就梗係要人睇住。」',0,'佢縮埋一舊。','帶責備嘅講法會加深羞愧感。']]},
 {s:'佢喊咗一陣，你遞咗張紙巾俾佢。',p:'「其實……我有時會偷偷收埋啲飯。你會唔會話俾人知？」',i:'講咗出嚟，佢會唔會鬧我？',ch:[
  ['「多謝你肯老實同我講，我知道唔容易。呢樣嘢關乎你嘅健康，我需要同醫生同營養師講，但我哋會一齊諗點樣幫你，唔係要罰你。」',2,'佢猶豫咗一陣，點頭。','誠實但唔批判。飲食失調嘅隱瞞行為要同團隊分享，以安全為先。'],
  ['「我唔講，你下次唔好再收就得。」',0,'佢鬆咗口氣，但聽日佢照樣收埋咗啲飯。','答應保密，團隊會錯過重要資訊，病人亦會繼續有風險。'],
  ['「你點可以咁做？浪費晒啲食物！」',0,'佢縮埋一舊：「我就知唔應該講。」','責罵會令病人以後更加收埋。']]},
 {p:'「其實我都好攰……成日諗住食物同體重，好似個腦俾佢佔據咗。」',i:'我好想停，但停唔到。',ch:[
  ['「飲食失調係一個病，令你成日被呢啲念頭困住，唔係你嘅錯。治療係可以慢慢幫你搵返自己。」',2,'「……唔係我嘅錯？」佢重複咗一次。','將病同人分開（externalising），可以減少病人嘅羞愧感。'],
  ['「意志力強啲就得啦。」',0,'「我已經好努力……」','厭食症唔係意志力問題，係需要治療嘅精神病。'],
  ['「大把人想瘦都瘦唔到。」',0,'佢眼神閃咗一閃，冇出聲。','呢類說話會強化病態信念。']]},
 {p:'「今晚個肚仲脹，我真係瞓唔落。」',i:'會唔會脹到爆？',ch:[
  ['「我幫你量吓血壓、脈搏，睇吓有冇唔妥；之後可以試吓暖水袋同放鬆練習。如果唔舒服加劇，我會通知醫生。」',2,'「好……」佢慢慢躺低。','重新進食期間要留意身體狀況（例如維生指數同驗血結果），有異常要通知醫生。'],
  ['「唔舒服就唔好食咁多啦。」',0,'佢眼睛一亮：「真係？」','鼓勵減少進食，會破壞治療計劃。'],
  ['「忍吓啦。」',1,'佢冇出聲。','冇評估身體狀況，可能錯過重要變化。']]},
 {s:'佢終於合埋眼。',p:'（均勻嘅呼吸聲）',i:'（夢入面，佢喺課室同同學一齊笑）',ch:[
  ['喺護理紀錄同情緒紀錄表記低今晚嘅對話、身體情況同收埋食物嘅事，通知醫生同營養師，交更時交代',2,'下一更嘅同事一接更就知道點樣跟進。','完整紀錄同交更，令團隊可以一致咁支援病人。'],
  ['唔記錄，等佢自己講',0,'團隊唔知道佢收埋食物，治療計劃冇調整。','重要資訊一定要記錄同交更。'],
  ['只寫「病人瞓唔著」',1,'紀錄太簡單，錯過咗重點。','紀錄要具體：病人講咗咩、身體情況、採取咗咩措施。']]}],
 endGood:'06:30，你叫醒佢。佢細聲講：「今朝個早餐……我試吓食多一啖。」',endMid:'06:30，佢起咗身，望住個早餐盒好耐，終於打開咗。'},
fep:{title:'我係咪癲咗？',sub:'思覺失調初發｜19 歲',e:'🎧',scn:19,
 intro:'夜深，一位 19 歲嘅大學生攬住個枕頭坐喺床上。佢兩星期前開始聽到聲音、瞓唔著，今次係第一次確診思覺失調，亦係第一次入院。',

  ['「驚佢返嚟……聽到嗰啲聲嘅時候，係點樣嘅感覺？」',2,'「好似有人喺耳邊鬧我……好驚。」','用開放式問題了解病徵同感受。'],
  ['「嗰啲聲唔係真㗎，唔使驚。」',1,'「但我真係聽到……」','直接否定病人經歷，佢會覺得你唔信佢。可以承認佢嘅感受，同時唔附和聲音內容。'],
  ['「瞓啦，唔好諗。」',0,'佢縮埋一舊。','忽略咗病人嘅恐懼。']]},
 {p:'「我係咪癲咗？我仲可唔可以返學？」',i:'我嘅人生係咪完咗？',ch:[
  ['「你唔係『癲咗』，你係病咗。思覺失調係可以治療嘅，好多年輕人及早治療之後，都返到學、做到自己鍾意嘅嘢。」',2,'「……真係？」','用正確資訊減少自我標籤，灌輸希望。及早治療對思覺失調好重要。'],
  ['「你咁樣應該要停學啦。」',0,'佢眼淚流出嚟。','未有評估就下判斷，會加深絕望。'],
  ['「我都唔知喎，你問醫生啦。」',1,'「……哦。」','轉介醫生啱，但可以先回應佢嘅擔心。']]},
 {p:'「醫生話要食藥……我係咪要食一世？食咗會唔會變到好呆？」',i:'班同學會唔會發現我食藥？',ch:[
  ['「好多人都擔心呢樣。藥物會幫你減少嗰啲聲，食幾耐要睇你嘅情況，有副作用可以同醫生調整。你有咩擔心都可以講出嚟。」',2,'「我驚肥同成日眼瞓……」佢終於講出真正嘅擔心。','正視病人對藥物嘅擔心，鼓勵佢同醫生商量，提高服藥依從性。'],
  ['「唔食就會再發作，一定要食。」',0,'佢別過面。','用恐嚇方式勸服藥，會令病人更抗拒。'],
  ['「藥冇事㗎，放心。」',1,'「……」','空泛保證，未回應實際擔心。']]},
 {p:'「我唔想同學知道我入咗嚟呢度。」',i:'佢哋一定會覺得我係怪人。',ch:[
  ['「你嘅病情係你嘅私隱，講唔講、講幾多都由你決定。社工同職業治療師都可以幫你諗返學嘅安排。」',2,'佢鬆咗口氣。','尊重私隱，提供實際支援，減少污名帶嚟嘅恐懼。'],
  ['「有咩好怕？精神病又唔係咩大不了。」',1,'「你唔係我，你唔明。」','出發點想去污名，但輕視咗佢嘅恐懼。'],
  ['「係呀，最好唔好俾人知。」',0,'佢更加覺得自己見唔得人。','會強化羞恥感同污名。']]},
 {s:'佢終於有啲睏。',p:'「多謝你陪我傾。」',i:'可能……都未係完。',ch:[
  ['喺護理紀錄記低病人嘅幻聽情況、擔心同對藥物嘅顧慮，交更同請醫生跟進副作用',2,'醫生聽朝會同佢傾副作用嘅處理。','記錄病人對藥物嘅顧慮，有助團隊提高治療依從性。'],
  ['唔使記錄',0,'團隊錯過咗佢對藥物嘅擔心。','重要資訊要記錄同交更。'],
  ['寫「病人瞓唔著」',1,'紀錄太簡單。','紀錄要具體。']]}],
 endGood:'06:30，佢主動問你：「醫生幾點巡房？我想問吓副作用嘅事。」',endMid:'06:30，佢起咗身，仲有啲驚，但肯出大廳食早餐。'},
eld:{title:'我要搭巴士返屋企',sub:'阿茲海默症｜80 多歲',e:'🧓',scn:7,

  ['「人老咗都係咁㗎啦。」',0,'佢嘆咗口氣。','將病徵當成正常老化，忽略咗長者嘅恐懼。認知障礙症係病，唔係正常老化。'],
  ['「唔會嘅唔會嘅。」',1,'佢仲係好擔心。','空泛保證。']]},
 {p:'「我想去廁所……」',i:'隻腳好軟……驚跌。',ch:[

  ['叫佢自己慢慢行去',0,'佢喺走廊幾乎跌低。','高跌倒風險長者唔可以自己行。'],
  ['俾個便盆佢',1,'可以，但佢唔習慣，好難為情。','要尊重長者意願同尊嚴。']]},

  ['唔使記錄',0,'下一更唔知佢夜晚會行去大門。','重要資訊要記錄同交更。'],

alc:{title:'就一啖',sub:'酒精依賴｜50 多歲',e:'🍺',scn:13,

  ['「戒酒梗係辛苦啦，忍吓。」',0,'佢好煩躁。','嚴重戒斷可以有危險，唔可以叫病人忍。'],

  ['「飲咗咁多年，梗係有問題啦。」',0,'佢好絕望。','責備冇幫助。'],
  ['「唔好諗咁多。」',1,'佢冇出聲。','迴避問題。']]},

  ['「咪唔好同佢哋玩囉。」',1,'「冇咁簡單……」','建議太簡化。'],
  ['「頂唔住就再入嚟囉。」',0,'佢苦笑。','消極嘅回應會打擊信心。']]},

  ['唔使記錄',0,'團隊冇數據調整藥物。','戒斷評估一定要記錄。'],
  ['寫「病人想飲酒」',1,'冇記錄評分同徵狀。','紀錄要具體。']]}],

mania:{title:'我冇病！',sub:'雙相情緒障礙（躁狂）｜20 多歲',e:'⚡',scn:12,

 nodes:[
 {p:'「我好精神！我諗到一個超正嘅生意計劃，你聽我講！」',i:'點解個個叫我瞓？我有好多嘢要做！',ch:[
  ['「你而家好多諗法。夜晚瞓夠，聽朝個腦會更清楚。我哋一齊去安靜啲嘅地方坐吓，慢慢呼吸。」',2,'佢坐低，但腳仲不停郁。','減少刺激、溫和設定界線，協助躁狂病人休息。'],
  ['「好呀！講啦講啦！」',0,'佢越講越快、越大聲。','附和會令躁狂更亢奮。'],

const LONGS={"ano": {"title": "脹住嘅肚，瞓唔著嘅夜", "sub": "厭食症｜18 歲，大學一年級", "nodes": [{"p": "病人坐喺床邊，雙手攬住個肚：「我瞓唔著……個肚好脹。」", "i": "今晚食咗成碗飯，我好驚。", "stage": "", "ch": [["「肚脹令你好唔舒服，好似仲有啲嘢令你瞓唔落。」", 2, "", "用咗：反映"], ["「食飽咗梗係脹啦，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "輕視感受，錯過佢背後嘅擔心。"]]}, {"p": "「我覺得自己今晚食得太多。」", "i": "聽朝磅重一定上咗。", "stage": "", "ch": [["「一諗到今晚食咗幾多，你就好緊張。可唔可以講多少少，嗰種緊張係點樣嘅？」", 2, "", "用咗：反映＋開放式問題"], ["「你都唔係食好多啫。」", 0, "佢冇再出聲，好似收埋咗自己。", "討論食物份量，會令佢更專注喺數字上。"]]}, {"p": "「心跳得好快，手都震……成個人好慌。」", "i": "我控制唔到自己。", "stage": "", "ch": [["「你而家好慌，心跳快、手震，身體都感受到。我哋一齊慢慢吸一啖氣，再慢慢呼出嚟，好唔好？」", 2, "", "用咗：反映＋陪伴放鬆"], ["「你諗多咗，唔好咁緊張。」", 0, "佢冇再出聲，好似收埋咗自己。", "否定焦慮，佢只會覺得冇人明。"]]}, {"p": "（慢慢呼吸幾次之後）「……好少少。」", "i": "原來可以咁樣。", "stage": "", "ch": [["「你肯同我一齊試，仲覺察到自己好返少少，呢個好唔容易。」", 2, "", "用咗：肯定"], ["「你睇吓，都話冇事啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "好似話佢之前小題大做。"]]}, {"p": "「其實唔食嘢嗰陣，我會冇咁慌，好似所有嘢都喺我控制之內。」", "i": "呢個係我唯一控制到嘅嘢。", "stage": "", "ch": [["「聽落限制食嘢係你應付焦慮嘅方法，佢令你覺得有控制。不過佢都令你個身好辛苦。」", 2, "", "用咗：反映＋教育：焦慮同厭食行為嘅關係"], ["「唔食嘢會死㗎！」", 0, "佢冇再出聲，好似收埋咗自己。", "恐嚇只會增加焦慮同抗拒。"]]}, {"p": "「我讀大學之後，乜都好亂，功課、同學、屋企人期望……」", "i": "我好驚令人失望。", "stage": "", "ch": [["「好多壓力同時嚟，你好似覺得要做到最好先得。邊一樣最壓住你？」", 2, "", "用咗：反映＋開放式問題"], ["「大家讀大學都係咁。」", 0, "佢冇再出聲，好似收埋咗自己。", "正常化用錯位，會令佢覺得自己太弱。"]]}, {"p": "「我唔想屋企人覺得我係個麻煩。」", "i": "佢哋為我入院好擔心。", "stage": "", "ch": [["「你好在乎屋企人嘅感受。你入院唔係麻煩，係病咗需要照顧，同生其他病一樣。」", 2, "", "用咗：肯定＋去污名"], ["「你知佢哋擔心就快啲食多啲啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "用內疚逼佢食，會破壞信任。"]]}, {"p": "「聽朝早餐……我真係好驚。」", "i": "我驚自己食唔落，又驚食咗之後更慌。", "stage": "", "ch": [["「好多同你一樣嘅病人都會驚食嘢前後嗰段時間，你唔係一個人。聽朝食早餐嗰陣，護士同營養師都會陪住你，一齊面對。」", 2, "", "用咗：正常化＋支持"], ["「聽朝一定要食晒呀。」", 0, "佢冇再出聲，好似收埋咗自己。", "增加壓力，冇提供支援。"]]}, {"p": "「如果驚嘅時候，我可以點？」", "i": "我想試吓其他方法。", "stage": "", "ch": [["「你願意諗其他方法，好叻。教你一個叫『五四三二一』嘅方法：而家講五樣你睇到嘅嘢……四樣聽到嘅聲音……三樣摸到嘅嘢……兩樣聞到嘅氣味……一樣嚐到嘅味道。」病人跟住做，慢慢講：「窗簾、床頭燈……冷氣聲……張被好軟……」佢肩膊放鬆咗。「驚嘅時候都可以用，或者搵護士傾。」", 2, "", "用咗：肯定＋教著地練習"], ["「唔好諗就得。」", 0, "佢冇再出聲，好似收埋咗自己。", "方法空泛，幫唔到佢。"]]}, {"p": "「……今晚同你傾完，好似冇咁驚。」", "i": "原來講出嚟會好啲。", "stage": "", "ch": [["「多謝你信任我。今晚你講咗食完飯好慌、限制食嘢係你應付焦慮嘅方法，仲有好擔心屋企人同聽朝早餐。我會將你嘅擔心交更，等團隊一齊幫你。試吓休息吖。」", 2, "", "用咗：摘要＋交代跟進"], ["「好啦，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過總結同跟進嘅機會。"]]}], "end": "佢終於瞓著。06:30，佢細聲問：「聽朝……可唔可以有人陪我食早餐？」", "lessons": ["焦慮好多時同厭食行為有密切關係。", "唔好討論卡路里、體重或者食物份量。", "用反映、肯定、開放式問題同摘要，幫病人講出背後嘅擔心。"], "principle": ""}, "dep": {"title": "凌晨嘅窗邊", "sub": "抑鬱症｜40 多歲，失業後入院", "nodes": [{"p": "病人企喺窗邊，望住出面：「我瞓唔著。」", "i": "每晚都係咁，瞓唔著又起唔到身。", "stage": "", "ch": [["靜靜企喺佢身邊：「我陪你企一陣。」", 2, "", "用咗：沉默陪伴"], ["「夜啦，返去瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "即刻趕佢返床，錯過傾偈嘅機會。"]]}, {"p": "「我諗住，屋企人而家點呢……」", "i": "佢哋冇咗我份人工，點過日子？", "stage": "", "ch": [["「你好掛住屋企人，亦都擔心佢哋。可唔可以講多啲，你最擔心邊樣？」", 2, "", "用咗：反映＋開放式問題"], ["「佢哋冇事嘅，唔使擔心。」", 0, "佢冇再出聲，好似收埋咗自己。", "空泛保證。"]]}, {"p": "「我冇咗份工，連供樓都唔知點算。我以前係屋企嘅支柱。」", "i": "我而家係個廢人。", "stage": "", "ch": [["「你一直為屋企撐住，而家冇咗份工，好似連自己嘅角色都唔見埋。」", 2, "", "用咗：反映"], ["「搵過份工咪得囉。」", 0, "佢冇再出聲，好似收埋咗自己。", "太快解決問題，冇理佢嘅失落。"]]}, {"p": "「屋企人以為我懶，連朝早起身都做唔到。」", "i": "我都覺得自己好冇用。", "stage": "", "ch": [["「冇力起身係抑鬱嘅徵狀，唔係懶。你肯入院醫，已經係為屋企同自己踏出一步。」", 2, "", "用咗：教育＋肯定"], ["「你努力啲就得㗎啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "令佢更自責。"]]}, {"p": "「有時……我覺得如果瞓咗唔醒返，就唔使再咁辛苦。」", "i": "講咗出嚟，佢會點睇我？", "stage": "", "ch": [["冷靜、直接：「多謝你同我講。我想問清楚：你而家有冇諗過結束自己嘅生命？」", 2, "", "用咗：直接評估自殺風險"], ["「唔好亂講嘢！」", 0, "佢冇再出聲，好似收埋咗自己。", "會令病人收埋念頭。"]]}, {"p": "「……有諗過，但我冇計劃。」", "i": "佢冇嚇親，仲肯聽。", "stage": "", "ch": [["「你肯講出嚟，需要好大勇氣。呢件事我要話俾醫生同團隊知，等大家一齊保護你，我唔可以幫你保密，但我會一直喺度。」", 2, "", "用咗：肯定＋誠實講明唔可以保密"], ["「好，我唔同人講。」", 0, "佢冇再出聲，好似收埋咗自己。", "答應保密係錯，會延誤處理。"]]}, {"p": "「我個腦停唔到，一路諗、一路諗。」", "i": "一個人喺度，越諗越黑。", "stage": "", "ch": [["「我教你一個方法：我哋一齊坐低，閉埋眼，慢慢吸氣數四下，停一停，再慢慢呼氣數六下。有諗法飄過唔緊要，再將注意力拉返去呼吸度。」病人跟住做咗幾次。", 2, "", "用咗：呼吸冥想"], ["「唔好諗咁多。」", 0, "佢冇再出聲，好似收埋咗自己。", "講易做難，冇教方法。"]]}, {"p": "「……個心靜咗少少。」", "i": "好耐冇試過咁。", "stage": "", "ch": [["「你做得好好。瞓唔著或者諗法好亂嘅時候，都可以咁做，亦可以隨時搵護士。」", 2, "", "用咗：肯定＋鞏固方法"], ["「咁就得啦，冇事喇。」", 0, "佢冇再出聲，好似收埋咗自己。", "太快當問題解決咗。"]]}, {"p": "「我仲有冇得返轉頭？」", "i": "我好想信會好返。", "stage": "", "ch": [["「抑鬱症係可以治療嘅，好多人配合藥物同輔導之後都慢慢好返。社工都可以幫你諗工作同經濟嘅安排。」", 2, "", "用咗：灌輸希望＋實際支援"], ["「我點知呀。」", 0, "佢冇再出聲，好似收埋咗自己。", "冷漠，令佢更絕望。"]]}, {"p": "「多謝你今晚陪我。」", "i": "原來講出嚟冇想像中咁可怕。", "stage": "", "ch": [["「多謝你信任我。今晚你講咗擔心屋企、覺得自己冇用，仲有諗過唔想再醒。我會交更俾醫生同團隊跟進，今晚會密啲嚟睇你。試吓休息吖。」", 2, "", "用咗：摘要＋交代跟進"], ["「唔使客氣，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過總結同跟進。"]]}], "end": "佢返床躺低。之後每 15 分鐘巡房，佢都喺床上，04:30 瞓著咗。", "lessons": ["直接問自殺念頭唔會增加風險。", "自殺念頭唔可以保密，要誠實話俾病人知會通知團隊。", "冇力起身係抑鬱徵狀，唔係懶。", "呼吸冥想可以幫自己由紛亂嘅諗法返回當下。"], "principle": ""}, "fep": {"title": "我係咪癲咗？", "sub": "思覺失調初發｜19 歲，第一次入院", "nodes": [{"p": "病人戴住耳筒坐喺床上，冇播歌：「我瞓唔著。」", "i": "戴住耳筒，好似會聽少啲。", "stage": "", "ch": [["坐喺佢旁邊嘅櫈：「我見你戴住耳筒，但冇播歌。我陪你坐一陣，好唔好？」", 2, "", "用咗：觀察＋陪伴"], ["「除咗耳筒，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "命令式，錯過咗耳筒背後嘅原因。"]]}, {"p": "「啲聲今晚未出現，但我驚佢會返嚟。」", "i": "如果同學知道我聽到聲，會點睇我？", "stage": "", "ch": [["「驚佢返嚟……聽到嗰啲聲嘅時候，係點樣嘅感覺？」", 2, "", "用咗：開放式問題"], ["「冇人講嘢，你聽錯咗啫。」", 0, "佢冇再出聲，好似收埋咗自己。", "否定經歷，佢以後唔會再講。"]]}, {"p": "「好似有人喺耳邊鬧我，話我冇用……好驚。」", "i": "我分唔到邊啲係真。", "stage": "", "ch": [["「我聽唔到嗰啲聲，但我相信你真係聽到，亦都真係好驚。你而家喺醫院，好安全，我喺度。」", 2, "", "用咗：承認感受，唔爭拗、唔附和"], ["「佢講咩？佢叫你做咩？」", 0, "佢冇再出聲，好似收埋咗自己。", "只顧追問內容，冇照顧佢嘅恐懼。"]]}, {"p": "「我係咪癲咗？我仲可唔可以返學？」", "i": "我嘅人生係咪完咗？", "stage": "", "ch": [["「你唔係『癲咗』，你係病咗。思覺失調係可以治療嘅，好多年輕人及早治療之後，都返到學、做到自己鍾意嘅嘢。」", 2, "", "用咗：去污名＋灌輸希望"], ["「你而家先諗返學？」", 0, "佢冇再出聲，好似收埋咗自己。", "輕視佢最大嘅擔心。"]]}, {"p": "「醫生話要食藥……我係咪要食一世？會唔會變到好呆？」", "i": "班同學會唔會發現我食藥？", "stage": "", "ch": [["「好多人都擔心呢樣。藥物會幫你減少啲聲，食幾耐要睇你嘅情況。如果有副作用，例如好攰，可以同醫生傾，調整藥物。」", 2, "", "用咗：正常化＋提供資訊"], ["「醫生叫你食就食啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "欠缺解釋，會影響佢食藥嘅意願。"]]}, {"p": "「我驚肥，又驚成日眼瞓上堂瞓著。」", "i": "終於講咗真正嘅擔心。", "stage": "", "ch": [["「你擔心體重同上堂嘅精神，呢啲擔心好實在。我會記低，交更請醫生聽朝同你傾。」", 2, "", "用咗：反映＋跟進"], ["「健康緊要過肥唔肥啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "忽略咗佢嘅擔心。"]]}, {"p": "「我唔想同學知道我入咗嚟呢度。」", "i": "佢哋一定會覺得我係怪人。", "stage": "", "ch": [["「你嘅病情係你嘅私隱，講唔講、講幾多都由你決定。社工同職業治療師都可以幫你諗返學嘅安排。」", 2, "", "用咗：尊重自主＋實際支援"], ["「有咩好怕？」", 0, "佢冇再出聲，好似收埋咗自己。", "輕視佢對污名嘅恐懼。"]]}, {"p": "「如果啲聲又返嚟，我應該點做？」", "i": "我好驚控制唔到自己。", "stage": "", "ch": [["「我教你一個方法，叫『五四三二一』：講出五樣你睇到嘅嘢、四樣聽到嘅聲音、三樣摸到嘅嘢、兩樣聞到嘅氣味、一樣嚐到嘅味道。」病人慢慢講：「床頭燈、窗簾……冷氣聲、你講嘢……張被……」", 2, "", "用咗：教著地練習"], ["「唔好理佢就得。」", 0, "佢冇再出聲，好似收埋咗自己。", "講易做難。"]]}, {"p": "「……做完好似定咗少少。」", "i": "原來我可以做啲嘢。", "stage": "", "ch": [["「你做得好好。啲聲返嚟嘅時候，可以用呢個方法，亦可以聽歌、深呼吸，或者即刻搵護士。你唔使一個人頂。」", 2, "", "用咗：肯定＋鞏固方法"], ["「咁就得啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "冇幫佢鞏固方法。"]]}, {"p": "「多謝你陪我傾。」", "i": "可能……都未係完。", "stage": "", "ch": [["「多謝你信任我。今晚你講咗驚啲聲返嚟、擔心返學同同學點睇，仲有對藥物嘅顧慮。我會記低，交更請醫生跟進。試吓休息吖。」", 2, "", "用咗：摘要＋交代跟進"], ["「好啦，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過總結同跟進。"]]}], "end": "02:55，佢除低耳筒，終於有啲眼瞓。06:30，佢主動問：「醫生幾點巡房？我想問吓副作用嘅事。」", "lessons": ["唔好同幻聽內容爭拗，亦唔好附和，承認病人嘅感受。", "思覺失調可以治療，及早治療好重要。", "五四三二一著地練習可以幫自己返回當下。", "尊重私隱，減少污名帶嚟嘅恐懼。"], "principle": ""}, "eld": {"title": "我要搭巴士返屋企", "sub": "認知障礙症長者｜80 多歲，阿茲海默症", "nodes": [{"p": "長者揸住個膠袋，企喺門口：「我要搭巴士返屋企！」", "i": "天黑咗，屋企人等緊我。", "stage": "", "ch": [["慢慢行近，蹲低同佢一樣高，細聲講：「你想返屋企。」", 2, "", "用咗：簡短反映"], ["「你而家喺醫院，返唔到屋企㗎！」", 0, "佢冇再出聲，好似收埋咗自己。", "直接否定，佢會更激動。"]]}, {"p": "「係呀！我個仔等緊我食飯！」", "i": "我遲咗，佢會擔心。", "stage": "", "ch": [["「你好錫個仔。」", 2, "", "用咗：回應感受，唔糾正"], ["「你個仔今日日頭先嚟探過你，你唔記得咩？」", 0, "佢冇再出聲，好似收埋咗自己。", "資訊太多，又令佢覺得自己記性差。"]]}, {"p": "「你係邊個？我唔識你。」", "i": "點解有個陌生人喺度？", "stage": "", "ch": [["指住自己個名牌：「我係護士。我陪你。」", 2, "", "用咗：簡單介紹，配合名牌"], ["「你又唔記得我？我啱啱先同你傾完！」", 0, "佢冇再出聲，好似收埋咗自己。", "責怪記性，令長者難受。"]]}, {"p": "「我要搵我啲錢！個膠袋入面有錢㗎！」", "i": "冇錢點搭巴士？", "stage": "", "ch": [["「你擔心啲錢。我哋一齊睇吓個膠袋，好唔好？」（陪佢打開，入面有條毛巾同一張舊相）", 2, "", "用咗：一次做一件事"], ["「你啲錢喺醫院夾萬度，入院嗰陣已經登記咗。」", 0, "佢冇再出聲，好似收埋咗自己。", "太複雜，長者難以理解。"]]}, {"p": "長者攞起張相：「呢個係我個仔。」", "i": "佢細個好得意。", "stage": "", "ch": [["「佢好靚仔。係唔係你個仔？」", 2, "", "用咗：用係唔係問題延續話題"], ["「你個仔而家幾多歲呀？做咩工？」", 0, "佢冇再出聲，好似收埋咗自己。", "問題太多、太難答。"]]}, {"p": "「係呀……佢好乖。」長者坐低咗。", "i": "想起以前，個心定咗。", "stage": "", "ch": [["陪佢坐，輕輕拍佢隻手，唔急住講嘢。", 2, "", "用咗：沉默陪伴＋身體語言"], ["「好啦，返去瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "太快打斷，佢可能又想走。"]]}, {"p": "「我好凍。」", "i": "夜晚好凍。", "stage": "", "ch": [["「我攞張被俾你，好唔好？」", 2, "", "用咗：二揀一／係唔係問題，處理實際需要"], ["「冷氣唔係好凍㗎。」", 0, "佢冇再出聲，好似收埋咗自己。", "否定佢嘅感覺。"]]}, {"p": "長者攬住張被，望住你：「我有啲驚。」", "i": "呢度好陌生。", "stage": "", "ch": [["「唔使驚，我喺度。我哋一齊慢慢吸氣……慢慢呼氣。」護士揸住佢隻手，一齊做幾次簡單嘅呼吸。", 2, "", "用咗：簡單呼吸放鬆，配合觸摸"], ["「有咩好驚？」", 0, "佢冇再出聲，好似收埋咗自己。", "否定感受。"]]}, {"p": "「你想去廁所，定係想坐多陣？」長者答：「去廁所。」", "i": "原來係想去廁所。", "stage": "", "ch": [["陪佢去廁所，再陪佢返床。", 2, "", "用咗：二揀一問題，發現真正需要"], ["「你頭先先去過廁所。」", 0, "佢冇再出聲，好似收埋咗自己。", "長者未必記得，佢嘅需要係真實嘅。"]]}, {"p": "長者躺低：「多謝你呀，姑娘。」", "i": "呢個人好好。", "stage": "", "ch": [["「唔使客氣。我喺度，你安心瞓。」", 2, "", "用咗：簡短、溫和、給予安全感"], ["一句都唔講就行開", 0, "佢冇再出聲，好似收埋咗自己。", "錯過建立安全感嘅機會。"]]}], "end": "佢揸住張相，慢慢瞓著。交更時記錄佢夜晚想離開病房、擔心錢同屋企人，原來係想去廁所，同埋邊啲方法有效。", "lessons": ["「想返屋企」背後可能係不安、掛住家人，或者生理需要（例如肚餓、凍、想去廁所）。", "唔好糾正或者爭拗，先回應感受。", "用簡單詞彙、短句、係唔係或者二揀一問題。", "配合名牌、手勢同觸摸。"], "principle": "用簡單詞彙、短句；一次講一件事；用「係唔係」或者二揀一問題，唔用開放式問題；配合手勢同身體語言；先回應感受。"}, "alc": {"title": "就一啖", "sub": "酒精依賴｜50 多歲，入院戒酒第二晚", "nodes": [{"p": "病人喺床上翻來覆去，一頭汗：「我瞓唔著……平時飲兩罐先瞓得。」", "i": "冇酒，成個人唔妥。", "stage": "", "ch": [["「冇飲酒，今晚特別難瞓，個身都好唔舒服。」", 2, "", "用咗：反映"], ["「飲酒先瞓到覺，即係你有問題啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "批判，會打擊動機。"]]}, {"p": "「我手好震，心又跳得好快。」", "i": "係咪又嚟？上次好辛苦。", "stage": "", "ch": [["「呢啲可能係戒酒嘅反應，我即刻幫你量血壓、脈搏同體溫，用戒斷評估表評估吓，再話俾醫生知。」", 2, "", "用咗：即時評估戒斷徵狀"], ["「忍吓就過。」", 0, "佢冇再出聲，好似收埋咗自己。", "忽略可能有危險嘅戒斷徵狀。"]]}, {"p": "「就俾我飲一啖，一啖就夠。」", "i": "一啖就唔會咁辛苦。", "stage": "量完之後", "ch": [["「你而家好辛苦，好想飲返啖。呢種好想飲嘅感覺會一陣陣嚟，亦會慢慢過去。醫生有藥幫你減輕戒斷反應。」", 2, "", "用咗：反映＋教育渴求感會過去"], ["「唔得！你入嚟就係戒酒！」", 0, "佢冇再出聲，好似收埋咗自己。", "只係拒絕，冇回應佢嘅辛苦。"]]}, {"p": "「我試過好多次戒，次次都失敗。」", "i": "我係咪戒唔到？", "stage": "", "ch": [["「你試過好多次，即係你一直都想改變，呢個好重要。今次你肯入院，有醫生同護士陪你，同之前唔同。」", 2, "", "用咗：肯定改變嘅動機"], ["「戒極都戒唔到，即係你唔夠決心。」", 0, "佢冇再出聲，好似收埋咗自己。", "令佢更絕望。"]]}, {"p": "「我老婆話，再飲就同我離婚。」", "i": "我唔想冇咗屋企。", "stage": "", "ch": [["「你好緊張屋企，亦都唔想失去佢哋。對你嚟講，戒酒最重要嘅原因係咩？」", 2, "", "用咗：反映＋開放式問題，搵出動機"], ["「早知唔好飲咪冇事囉。」", 0, "佢冇再出聲，好似收埋咗自己。", "責備，冇幫助。"]]}, {"p": "「我想……睇住個女結婚。」", "i": "我想做個好老竇。", "stage": "", "ch": [["「你想陪住個女，見證佢人生重要嘅日子。呢個係好有力嘅原因，難頂嘅時候可以諗返佢。」", 2, "", "用咗：反映＋強化動機"], ["「咁你就唔好再飲啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "太簡化。"]]}, {"p": "「我份工……老闆知道我入院，會唔會炒我？」", "i": "冇咗份工，屋企點算？", "stage": "", "ch": [["「你好擔心份工同屋企開支。社工可以同你傾吓病假證明同經濟支援，我哋一步步處理。」", 2, "", "用咗：處理實際擔心"], ["「唔好諗住返工住。」", 0, "佢冇再出聲，好似收埋咗自己。", "迴避佢嘅擔心。"]]}, {"p": "「我以前一有壓力就飲……出院之後點算？」", "i": "冇咗酒，我唔知點減壓。", "stage": "", "ch": [["「我教你一個方法，叫漸進式肌肉放鬆：先用力揸實兩個拳頭，數五下，再慢慢放鬆，感受吓手嘅分別；跟住肩膊、面同腳都咁做。」病人跟住做咗一次。", 2, "", "用咗：教漸進式肌肉放鬆"], ["「出院先算啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過咗教應對方法嘅機會。"]]}, {"p": "「……手好似冇咁震。」", "i": "原來唔飲酒都可以放鬆。", "stage": "", "ch": [["「你做得好好。壓力大或者好想飲嘅時候，可以用呢個方法，亦可以搵人傾、行吓。出院之後都有戒酒互助小組同覆診跟進。」", 2, "", "用咗：肯定＋預防復發計劃"], ["「咁就唔使飲酒啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "太簡化，冇講長遠支援。"]]}, {"p": "「多謝你今晚陪我。」", "i": "呢次可能真係得。", "stage": "", "ch": [["「多謝你信任我。今晚你講咗好想飲、驚戒唔到，仲有擔心屋企同份工；你亦講咗想陪個女。我會交更俾醫生跟進你嘅戒斷徵狀，今晚會密啲嚟睇你。」", 2, "", "用咗：摘要＋交代跟進"], ["「好啦，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過總結同跟進。"]]}], "end": "佢服咗醫生開嘅藥，04:00 瞓著咗。之後再量維生指數，徵狀有改善。", "lessons": ["手震、出汗、心跳快可能係戒酒反應，要即時評估同通知醫生。", "渴求感會一陣陣嚟，亦會慢慢過去。", "肯定病人想改變嘅動機，唔好批判。", "漸進式肌肉放鬆可以幫自己放鬆。"], "principle": ""}, "mania": {"title": "我唔使瞓", "sub": "躁狂｜30 多歲，雙相情緒障礙，躁狂期", "nodes": [{"p": "病人喺走廊行嚟行去，講嘢好快：「我唔使瞓！我有好多計劃要做！」", "i": "個腦停唔到，好興奮。", "stage": "", "ch": [["用平穩、慢嘅語氣：「你而家好多諗法，好有精神。我哋去大廳安靜啲嘅位坐低傾，好唔好？」", 2, "", "用咗：反映＋減少刺激"], ["「細聲啲！大家瞓緊覺！」", 0, "佢冇再出聲，好似收埋咗自己。", "大聲指責，會令佢更激動。"]]}, {"p": "「我要開間公司！我已經諗好晒，一定賺大錢！」", "i": "點解冇人明我有幾勁？", "stage": "", "ch": [["「你對呢個計劃好有熱誠。不如寫低佢，等你休息好咗，再同醫生同屋企人一齊睇。」", 2, "", "用咗：唔附和、唔爭拗，引導延後決定"], ["「你邊有錢開公司？」", 0, "佢冇再出聲，好似收埋咗自己。", "爭拗會引起衝突。"]]}, {"p": "「我唔想再瞓喇，瞓覺嘥時間！」", "i": "我個腦有好多嘢等緊我做。", "stage": "", "ch": [["「你覺得好精神。不過連續幾日冇瞓，個身會頂唔順，情緒都會更加起伏。我哋試吓熄細啲燈，躺低休息都好。」", 2, "", "用咗：教育＋溫和設定界線"], ["「瞓唔瞓隨你。」", 0, "佢冇再出聲，好似收埋咗自己。", "放任會令病情惡化。"]]}, {"p": "「你哋係咪想控制我？」聲音大咗。", "i": "佢哋唔明我。", "stage": "", "ch": [["保持距離，語氣平穩：「我見到你好嬲。我唔係想控制你，我想你休息好啲。」", 2, "", "用咗：反映＋降溫"], ["「你再咁就要打針！」", 0, "佢冇再出聲，好似收埋咗自己。", "恐嚇會令情況升級。"]]}, {"p": "（坐低咗）「……其實我都好攰，但停唔到。」", "i": "身體好攰，個腦仲行緊。", "stage": "", "ch": [["「個身好攰，但個腦停唔到，一定好辛苦。你肯講出嚟，好好。」", 2, "", "用咗：反映＋肯定"], ["「攰就瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "太簡化。"]]}, {"p": "「我點樣先可以停到個腦？」", "i": "我想試吓。", "stage": "", "ch": [["「我教你一個方法：將注意力放喺呼吸度。慢慢吸氣數四下，停一停，再慢慢呼氣數六下。如果諗法走咗出嚟，唔緊要，再拉返去數呼吸。」病人跟住做咗幾次，講嘢慢咗少少。", 2, "", "用咗：呼吸冥想"], ["「唔好諗嘢就得。」", 0, "佢冇再出聲，好似收埋咗自己。", "講易做難。"]]}, {"p": "「我啱啱 send 咗好多訊息俾朋友……佢哋會唔會覺得我好怪？」", "i": "我係咪又搞砸咗？", "stage": "", "ch": [["「你擔心朋友點睇你。等你情緒穩定啲，我哋可以一齊諗點同佢哋解釋；而家先幫你保管部手機，等你休息。」", 2, "", "用咗：反映＋保護社交關係"], ["「你咁樣梗係好怪啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "批判會傷害病人。"]]}, {"p": "「上次發作，我用晒啲錢……我好驚又會咁。」", "i": "我唔想再傷害屋企人。", "stage": "", "ch": [["「你好清楚上次發生咩事，亦都想保護自己同屋企人。之後可以同醫生、社工一齊訂一個計劃，例如早啲察覺復發嘅警號。」", 2, "", "用咗：肯定病識感＋預防復發"], ["「你知就唔好再搞啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "責備，冇幫助。"]]}, {"p": "「有咩警號？」", "i": "我想早啲知道。", "stage": "", "ch": [["「好多人會留意：瞓得好少都唔覺攰、講嘢好快、好多大計劃、好想買嘢。發現呢啲，就早啲搵醫生。你想唔想而家一齊寫低？」", 2, "", "用咗：教育復發警號＋共同參與"], ["「醫生會話你知。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過自我管理嘅教育機會。"]]}, {"p": "「……我想試吓躺低。」", "i": "原來慢落嚟都幾舒服。", "stage": "", "ch": [["「好呀。今晚你講咗個腦停唔到、好攰，仲擔心朋友同上次用晒錢嘅事；你亦試咗呼吸方法。我會交更俾醫生跟進，我會陪你行返床。」", 2, "", "用咗：摘要＋交代跟進"], ["「早就應該瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "令佢覺得被指責。"]]}], "end": "佢躺低咗，04:30 瞓著。交更時記錄佢嘅睡眠時數、情緒、衝動行為同擔心。", "lessons": ["同躁狂病人講嘢要簡短、平穩，減少刺激。", "唔附和、唔爭拗誇大嘅諗法。", "睡眠不足會令躁狂加劇。", "認識復發警號，早啲求醫。", "呼吸冥想可以幫個腦慢落嚟。"], "principle": "句子簡短、語氣平穩；減少刺激（燈光、聲音、人多）；溫和而清楚咁設定界線；唔附和誇大嘅諗法，亦唔爭拗。"}, "grief": {"title": "佢仲喺度㗎", "sub": "親人離世｜50 多歲，母親兩個月前離世後情緒低落入院", "nodes": [{"p": "病人攞住電話：「我想打俾阿媽，佢今晚仲未覆我。」", "i": "佢一定係瞓咗。", "stage": "否認", "ch": [["坐喺佢身邊，溫和咁講：「你好掛住阿媽。」", 2, "", "用咗：先回應感受"], ["「你阿媽已經走咗，你唔記得咩？」", 0, "佢冇再出聲，好似收埋咗自己。", "太直接、太快，冇照顧佢嘅心情。"]]}, {"p": "「我成日覺得佢仲喺度，好似一返屋企就會見到佢。」", "i": "我唔想信佢走咗。", "stage": "否認", "ch": [["「失去咗好親嘅人，好多人都會覺得佢好似仲喺度，呢個係好常見嘅反應。」", 2, "", "用咗：正常化｜否認：心靈保護自己，慢慢消化難以接受嘅消息。"], ["「你要面對現實。」", 0, "佢冇再出聲，好似收埋咗自己。", "逼得太急。"]]}, {"p": "聲音大咗：「點解醫生唔早啲發現？點解偏偏係佢？」", "i": "呢個世界好唔公平。", "stage": "憤怒", "ch": [["「你好嬲，覺得好唔公平。呢啲感覺可以講出嚟，我喺度聽。」", 2, "", "用咗：反映＋接納情緒｜憤怒：可能指向醫生、家人、自己，甚至離世嘅人。"], ["「唔好怪醫生，佢哋已經盡力。」", 0, "佢冇再出聲，好似收埋咗自己。", "急住替人辯護，佢會覺得唔被理解。"]]}, {"p": "「我都嬲自己……嗰排我太忙，冇時間陪佢。」", "i": "都係我唔好。", "stage": "憤怒", "ch": [["「你好錫阿媽，所以先咁自責。你願唔願意講吓，你同佢之間有啲咩回憶？」", 2, "", "用咗：反映＋開放式問題"], ["「係呀，早知就多啲陪佢。」", 0, "佢冇再出聲，好似收埋咗自己。", "加重內疚。"]]}, {"p": "「如果我嗰日早啲帶佢睇醫生……如果我冇搬出去住……」", "i": "如果我做得好啲，佢可能仲喺度。", "stage": "討價還價", "ch": [["「你不斷諗『如果』，好想將時間扭轉返。呢啲諗法好多喪親嘅人都會有。」", 2, "", "用咗：反映＋正常化｜討價還價：不斷諗「如果……就……」，想改變已經發生嘅事。"], ["「諗嚟都冇用。」", 0, "佢冇再出聲，好似收埋咗自己。", "否定佢嘅感受。"]]}, {"p": "病人喊：「冇咗佢，我唔知點樣生活落去。」", "i": "好空，乜都冇意思。", "stage": "抑鬱", "ch": [["遞紙巾，靜靜陪佢，過咗一陣：「你好痛。我喺度陪你。」", 2, "", "用咗：沉默陪伴＋同理心｜抑鬱：好深嘅悲傷、空虛、乜都提唔起勁。"], ["「唔好喊啦，阿媽都唔想見到你咁。」", 0, "佢冇再出聲，好似收埋咗自己。", "壓抑佢嘅情緒。"]]}, {"p": "「有時我覺得，不如跟佢一齊走咗算。」", "i": "講咗出嚟會唔會好啲？", "stage": "抑鬱", "ch": [["冷靜、直接：「多謝你同我講。我想問清楚：你而家有冇諗過結束自己嘅生命？」病人：「有諗過，但冇計劃。」護士：「你肯講出嚟好重要，我會話俾醫生同團隊知，一齊保護你。」", 2, "", "用咗：直接評估自殺風險＋誠實講明唔可以保密"], ["「唔好亂講嘢。」", 0, "佢冇再出聲，好似收埋咗自己。", "會令病人收埋念頭。"]]}, {"p": "「我個心好亂，好痛。」", "i": "一諗起佢就停唔到。", "stage": "", "ch": [["「我教你一個方法，叫『五四三二一』：講出五樣你睇到嘅嘢、四樣聽到嘅聲音、三樣摸到嘅嘢、兩樣聞到嘅氣味、一樣嚐到嘅味道。」病人慢慢做，呼吸平穩咗。", 2, "", "用咗：教著地練習"], ["「諗開啲啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "冇教方法。"]]}, {"p": "「阿媽以前成日煲湯俾我飲……我好掛住嗰碗湯。」", "i": "原來諗起佢，都可以係溫暖。", "stage": "接受的開始", "ch": [["「聽落阿媽好錫你。佢煲嘅湯，係你哋之間好溫暖嘅回憶。」", 2, "", "用咗：反映＋幫助回顧正面回憶"], ["「出面都有湯飲。」", 0, "佢冇再出聲，好似收埋咗自己。", "完全錯過重點。"]]}, {"p": "「或者……我可以學佢煲湯，咁好似佢仲陪住我。」", "i": "佢會一直喺我心入面。", "stage": "接受", "ch": [["「好主意。接受唔係忘記阿媽，而係帶住對佢嘅愛繼續生活。慢慢嚟，唔使急。」", 2, "", "用咗：肯定＋解釋接受嘅意思｜接受：唔係「放低」或者「冇事」，而係學識同失去共存。"], ["「咁就好啦，你冇事喇。」", 0, "佢冇再出聲，好似收埋咗自己。", "哀傷唔會一晚就完。"]]}, {"p": "「多謝你今晚陪我講阿媽。」", "i": "好耐冇同人講過佢。", "stage": "", "ch": [["「多謝你同我分享阿媽。今晚你講咗好掛住佢、嬲同自責、諗過唔想活落去，仲有佢煲湯嘅回憶。我會交更俾醫生同團隊跟進，今晚會密啲嚟睇你。試吓休息吖。」", 2, "", "用咗：摘要＋交代跟進"], ["「好啦，瞓啦。」", 0, "佢冇再出聲，好似收埋咗自己。", "錯過總結同跟進。"]]}], "end": "佢揸住阿媽張相，04:00 瞓著。交更時記錄佢嘅情緒、自殺念頭同對話重點，建議轉介臨床心理學家做哀傷輔導。", "lessons": ["哀傷五個階段（否認、憤怒、討價還價、抑鬱、接受）唔一定按次序，可以反覆出現。", "每個人哀傷嘅方式都唔同。", "陪伴同聆聽比勸人「諗開啲」更有用。", "喪親者都可能有自殺念頭，要直接問。", "接受唔係忘記，而係帶住愛繼續生活。"], "principle": "讓大眾經歷喪親者常見嘅哀傷五個階段：否認、憤怒、討價還價、抑鬱、接受。解釋泡泡要講明：五個階段唔一定按次序出現，可以反覆、重疊，每個人嘅哀傷都唔同，冇「啱」或者「錯」嘅哀傷方式。"}};

STORIES.ano.lessons=['厭食症病人點解會肚脹？長期食得少，胃排空同腸道蠕動都會變慢，食少少都覺得好飽、好脹，亦容易便秘；重新進食初期最明顯，營養改善之後會慢慢好返；焦慮亦會令病人對身體感覺特別敏感。所以病人話肚脹係真實嘅感受，唔係藉口。',...(STORIES.ano.lessons||[])];
{const n0=STORIES.ano.nodes[0];n0.p='病人坐喺床邊，雙手攬住個肚：「我瞓唔著……個肚好脹，好似成個胃頂住咁。」';n0.ch.forEach(c=>{if(c[1]===2)c[3]+='｜💡 點解會肚脹？厭食症病人長期少食，胃排空同腸道蠕動會變慢；重新進食初期，就算食少少都會覺得好脹、好飽滯。呢個係常見嘅身體反應，會隨住營養改善慢慢好轉，但會令病人更焦慮、更想少食。'})}

function scrStoryPick(){return `<div class="card"><h2>🌙 N 更（夜更）：對話模式</h2>

 if(c[1]===0){s.wd=2;s.chat.push({c:'r',x:'❌ '+(s.k==='eld'?'佢皺埋眉，揸實個膠袋，唔肯再望你。':pick(WD_R))+'　😶 病人嘅情緒差咗，信任度下降，之後會講少咗嘢。'})}

 :`<div class="fb m">你巡房次數唔夠，好多病人嘅睡眠情況都唔清楚。</div>${B('照估填晒「瞓得好」',()=>{eff(-15,0,4);SFX.bad();addLearn('睡眠紀錄要根據實際巡房觀察填寫，唔可以估。');openM(`<div class="fb b">❌ 紀錄要根據實際觀察，唔可以估。醫生會用睡眠紀錄評估病情同調整藥物。</div>${B('完成',()=>finishTask(k,0),'block ctr')}`)},'block')}${B('如實寫低觀察到嘅，未觀察到嘅註明，交更時交代',()=>{eff(3,0,0);addLearn('睡眠紀錄要根據實際巡房觀察填寫，有助醫生評估病情。');finishTask(k,5)},'block')}`}`)}

ch:[['Go straight over and protect their head with a cushion or your hand; use simple words: “Snacks come at snack time — let’s look at the clock together”, then redirect them to an activity they enjoy; afterwards check their head for injury',2,'You kept them safe first, then used simple, clear communication and distraction. They gradually stopped.'],['Give them a snack straight away so they stop',1,'It stops the harm for now, but in the long run they learn “banging my head gets me snacks”.'],['Tell them to go to their room and calm down alone',0,'They’ll keep banging their head, and being alone is more dangerous.']],
learn:'People with intellectual disability may have limited ways to express themselves; head-banging may be how they show they’re upset. Nurses keep them safe first, then use simple communication, visual schedules and a behaviour plan to teach other ways to express needs.',
vet:'With these patients, keep sentences short and concrete, and use gestures and picture cards — it works much better.'},
{id:4,dx:'Mild intellectual disability',risk:['Violence risk','Low'],zone:'hall',e:'🩲',urg:15,
desc:'Bed {b} The patient has undressed in the day room again; there is faeces and urine on the floor, and they’ve smeared it on the wall.',
ch:[['First protect their privacy with a towel or screen and take them to the shower to clean up and change; ask support staff to clean and disinfect the area; record the behaviour and later plan regular toileting with the team',2,'You protected the patient’s dignity and handled infection control well.'],['Tell them off in front of everyone: “That’s disgusting!”',0,'Humiliation hurts the patient’s dignity and won’t change the behaviour.'],['Tell the other patients not to look and wait for them to dress themselves',0,'Privacy and cleaning weren’t dealt with straight away; the infection risk is high.']],
learn:'This kind of behaviour may relate to cognitive ability, not having learned toileting, or sensory needs. Nurses protect the patient’s dignity and privacy and work with occupational therapists and the team on a toilet-training plan.',
vet:'Taking them to the toilet every two hours often prevents this from happening again.'},
{id:5,dx:'Depression',risk:['Suicidal risk','High'],zone:'bed',e:'🩹',urg:5,
desc:'On your dorm round, you see Bed {b}: the patient is sitting on the bed with a fresh, bleeding cut on their arm and a hidden sharp object beside them.',
ch:[['Call colleagues for help straight away, stay calmly with the patient and remove the sharp object; stop the bleeding and assess the wound, inform the doctor; then talk with them about how they’re feeling, increase observation and do a full safety search',2,'You kept the patient safe straight away without judging them, and they finally opened up about how much they’re hurting.'],['Scold them for doing it',0,'Scolding makes the patient feel more ashamed and more withdrawn.'],['Go and fetch dressings, leaving them alone',0,'A patient at high suicide risk must not be left alone.']],
learn:'Self-harm is a sign of extreme distress, not “attention-seeking”. Nurses treat the wound straight away, keep the patient safe, listen without judgement and arrange close observation according to risk (suicidal observation chart).',
vet:'Afterwards, check the bed, clothing and belongings — sharp objects are often hidden in unexpected places.'},
{id:6,dx:'Adult psychiatric patients (two)',risk:['Violence risk','High'],zone:'hall',e:'📺',urg:6,two:1,
desc:'Bed {b} and Bed {b2}: the patients are arguing over which TV channel to watch, and one is already walking over with a clenched fist!',
ch:[['Call for help straight away, separate the two patients to different areas and listen to each of them; then agree a rota for choosing the channel',2,'You separated them in time; no one was hurt, and you found a longer-term solution.'],['Turn the TV off so nobody can watch',1,'Removing the trigger helps for now, but it must go with separating and calming them — it doesn’t end there.'],['Stand between them and pull them apart yourself',0,'Standing between them alone is a good way to get hurt; only step in with enough staff.']],
learn:'Living space on a ward is limited and small things can spark conflict. Nurses watch for rising tension early, only step in with enough staff, and use fair, clear rules to prevent conflict.',
vet:'Fights usually have warning signs: raised voices, standing close, clenched fists. When you see them, go over straight away — don’t wait.'},
{id:7,dx:'Dementia (limited mobility)',risk:['Risk of falls and going missing','High'],zone:'hall',e:'🧓',urg:8,
desc:'Sitting in the recliner, the patient in Bed {b} — an older person — suddenly tries to stand up alone: “I need the toilet! I’m getting the bus home!” Then keeps heading towards the ward door.',
ch:[['Go over and steady them, take them to the toilet first for their urgent need; then calm them with a familiar topic, such as asking about their family; meanwhile keep an eye on the ward entrance',2,'You dealt with their real need first (the urge to pee), then calmed them with validation. They stopped insisting on leaving.'],['Tell them to sit still and wait until a colleague is free to take them to the toilet',0,'If the urge isn’t dealt with, they’ll get up alone again — and the risk of falling goes up.'],['Tell them: “You can’t go home!”',0,'Contradicting them flatly makes a person with dementia more anxious and more determined to leave.']],
learn:'When a person with dementia says “I want to go home”, they’re often expressing unease or an unmet need (such as hunger or needing the toilet). Nurses use validation: respond to the feeling first, then meet the need.',
vet:'When they keep saying they want to go home, try asking “Who’s waiting for you at home?” — chatting about it often helps them relax.'},
{id:8,dx:'Schizophrenia (refusing medication)',risk:['Violence risk','Moderate'],zone:'ns',e:'💊',urg:10,trig:'med',intim:1,
desc:'During the medication round, Bed {b}: the patient pushes the medicine cup away: “This isn’t medicine, it’s poison! You’re trying to kill me!”',
ch:[['Don’t force it; listen calmly to their worries; explain the medicine’s name and purpose, and let them see the label on the packet; if they still refuse, record it and inform the doctor',2,'You respected the patient. They didn’t take it this time, but their trust in you grew, and the doctor can adjust treatment early.'],['Tell them: “If you won’t take it, you’re getting an injection!”',0,'Threats damage the therapeutic relationship and make them feel even more that someone wants to harm them.'],['Secretly mix the medicine into their food',0,'Giving medicine without the patient’s knowledge breaches professional ethics.']],
learn:'Refusing medication may come from delusions, side effects or limited insight into the illness. Nurses find out why, explain clearly, record it and inform the doctor — never forcing or deceiving the patient.',
vet:'Sometimes having a colleague the patient trusts give the medicine, or trying again 15 minutes later, works better.'},
{id:9,dx:'Schizophrenia (fear of poisoning)',risk:['Violence risk','Moderate'],zone:'hall',e:'🍚',urg:12,trig:'meal',shifts:'AP',
desc:'At mealtime, Bed {b}: the patient pushes the meal box away: “You’ve poisoned the food!”',
ch:[['Don’t argue; show you understand their worry; let them choose their own meal box, or open a sealed meal in front of them; record what they eat and inform the dietitian and doctor',2,'You gave the patient a sense of control, and in the end they ate half the box.'],['Tell them: “If you don’t eat this, you get nothing!”',0,'Threats make them even less willing to eat, and nutrition becomes a problem.'],['Taste a mouthful in front of them to prove it’s safe',1,'It sometimes works, but it’s unhygienic and not a long-term solution.']],
learn:'Patients with persecutory delusions may believe their food is unsafe. Nurses respect them and offer choices, while monitoring nutrition and weight.',
vet:'A sealed ready-made meal, or letting them choose for themselves, puts them much more at ease.'},
{id:10,dx:'Patient with a nasogastric tube',zone:'bed',e:'🧪',urg:10,
desc:'Bed {b}: the patient is pulling at their feeding tube, and the tape is already half off.',
ch:[['Gently stop them straight away and check the tube’s position and length marking; if it has moved, pause feeding and inform the doctor; explain to the patient what the tube is for and find out why they’re uncomfortable',2,'Caught early — you avoided the danger of feeding through a displaced tube.'],['Carry on with the feed as usual',0,'Feeding through a displaced tube can send feed into the lungs.'],['Pull the tube out for them',0,'Nurses can’t decide on their own to remove the tube; the doctor must assess.']],
learn:'Tube-fed patients need regular checks of the tube position, and the position must be confirmed before each feed. Find out why the patient pulls at it, e.g. discomfort or confusion.',
vet:'Taping the tube at two points — nose and cheek — and securing it to clothing with a clip reduces pulling.'},
{id:11,dx:'Patient with a urinary catheter',zone:'bed',e:'🧴',urg:15,
desc:'A support worker reports: “Charge nurse, Bed {b}: there’s very little urine in the bag and it’s very dark. The patient says their lower belly hurts.“',
ch:[['Check the catheter for kinks or blockage, observe the urine and take a temperature; record intake and output (intake and output chart) and inform the doctor',2,'The tube was kinked. Once sorted, urine drained freely, and the doctor arranged a urine test.'],['Just empty the bag',0,'A possible blockage or infection hasn’t been dealt with.'],['Tell the patient to drink more water and check again next shift',1,'Fluids help, but lower abdominal pain with low urine output needs checking now.']],
learn:'Patients with catheters need regular bag emptying and urine output records, and watching for infection, blockage or self-removal.',
vet:'Keep the bag below the bladder and the tube unkinked — that alone prevents many problems.'},
{id:12,dx:'Mania (bipolar disorder)',zone:'hall',e:'⚡',urg:15,
desc:'Bed {b}: the patient is talking very fast, chatting to everyone, saying they’ll give away all their money, and asking other patients for their phone numbers.',
ch:[['Take them somewhere quieter to reduce stimulation; use short, clear sentences and set gentle limits; protect their belongings and other patients’ privacy; complete the mood chart',2,'With less stimulation, they gradually calmed down a little.'],['Chat excitedly along with them',0,'It’ll make them even more elevated.'],['Tell them to shut up',0,'Likely to provoke them and start a conflict.']],
learn:'During mania, patients are elevated, sleep little and have poorer judgement, so they make impulsive decisions (like overspending). Nurses reduce stimulation, protect safety and belongings, and make sure they rest, eat and drink enough.',
vet:'Simple activities that don’t need much thought, like folding towels, help them use up energy.'},
{id:13,dx:'Alcohol withdrawal',risk:['Medical risk (withdrawal complications)','High'],zone:'bed',e:'🍺',urg:8,
desc:'Bed {b}: on the patient’s second day, their hands are shaking badly; they’re sweating, their heart is racing, and they point at the wall saying insects are crawling on it.',
ch:[['Take vital signs straight away, complete a CIWA-Ar to assess withdrawal severity, and inform the doctor (medication may be needed); keep the room well lit and quiet, and take precautions against falls and seizures',2,'Prompt assessment and informing the doctor prevented the withdrawal from getting worse.'],['Tell them “There are no insects, you’re hallucinating”, then walk away',0,'Severe alcohol withdrawal can be life-threatening — it can’t be ignored.'],['Wait until the next round of vital signs',0,'Withdrawal symptoms can worsen quickly and need dealing with now.']],
learn:'Alcohol withdrawal usually starts 1–3 days after stopping drinking; severe cases can bring hallucinations, seizures and even risk to life. Nurses assess regularly with the CIWA-Ar and work with the doctor’s treatment.',
vet:'Withdrawal patients are especially confused at night; leaving a small light on makes them less frightened.'},
{id:14,dx:'Obsessive-compulsive disorder (OCD)',zone:'wc',e:'🧼',urg:20,
desc:'Bed {b}: the patient has been washing their hands in the toilets for half an hour; their hands are cracked and sore, and other patients are queueing at the door.',
ch:[['Talk to them gently and agree a limit (e.g. two more minutes), staying with them as they slowly stop; direct the other patients to another cubicle; then help them put on moisturiser, and follow up with the clinical psychologist',2,'You patiently helped them stop step by step, and they became less anxious.'],['Turn off the tap at once and order them out',0,'Interrupting forcefully makes anxiety shoot up.'],['Let them wash as long as they like',0,'Their skin will be damaged, and it affects other patients too.']],
learn:'People with OCD know the behaviour is excessive but can’t stop, because not doing it causes intense anxiety. Treatment includes CBT; day to day, nurses support them in gradually reducing the compulsions.',
vet:'Don’t tell them “Your hands are clean now” — the more you reassure, the more they need to check. A timer works better.'},
{id:15,dx:'Eating disorder',zone:'hall',e:'🥄',urg:20,trig:'meal',shifts:'AP',
desc:'A support worker quietly tells you that Bed {b}: the patient has been hiding food in tissues and pockets.',
ch:[['Don’t confront them in public; talk with them gently in private; then sit with them at meals, record food intake and weight, and inform the dietitian and doctor',2,'You helped the patient save face, and they opened up about their fear of gaining weight.'],['Search their pockets in front of everyone',0,'It will shame the patient and make them hide food even more.'],['If they won’t eat, respect that and leave them be',0,'Eating disorders can be life-threatening — you can’t just leave it.']],
learn:'An eating disorder isn’t “being picky”; it’s a serious mental illness. Nurses monitor intake and weight, offer supportive company and work with dietitians and psychologists.',
vet:'At mealtimes, chat about light topics rather than focusing on food and weight.'},
{id:16,dx:'Schizophrenia (persecutory delusions)',zone:'bed',e:'🕵️',urg:20,intim:1,
desc:'Bed {b}: the patient is huddled by the bed: “Someone outside is following me — I’m not going out!” They won’t come out for meals or medication.',
ch:[['Don’t argue about the delusion; acknowledge their fear; have a colleague they trust talk with them from a safe distance and let them decide where to eat; record mood and intake',2,'The patient felt respected and agreed to eat at the bedroom door.'],['Tell them “No one’s following you, you’re overthinking”',1,'Flat denial usually doesn’t work, and may make them feel you don’t understand.'],['Get several colleagues to pull them out of the room',0,'It reinforces their belief that “someone wants to harm me”.']],
learn:'A delusion is a belief the patient holds firmly; reasoning rarely changes it. Nurses build trust, reduce the sense of threat and, alongside medication, help things improve over time.',
vet:'When you talk with them, sit down and don’t stand too close — they’ll feel safer.'},
{id:17,dx:'Schizophrenia (refusing to shower)',zone:'wc',e:'🚿',urg:20,trig:'bath',shifts:'A',intim:1,
desc:'At shower time, Bed {b}: the patient hasn’t showered for days and has a noticeable odour. They shout: “I’m not showering!”',
ch:[['Find out why they won’t shower (e.g. fear of water, privacy, voices); offer choices: shower a bit later, pick their own clothes, be helped by a colleague they trust; you could start with a wash at the sink',2,'They said they were worried the water was too hot. Once you adjusted it, they agreed to shower.'],['Get several colleagues to force them into the shower room',0,'Force makes patients feel humiliated, and they’ll resist even more next time.'],['Let them skip showering',0,'Long-term lack of hygiene leads to skin problems and infection.']],
learn:'People with schizophrenia may neglect personal hygiene because of low motivation (negative symptoms) or delusions. Nurses find out why and encourage them with patience and choices.',
vet:'Step by step: wash face today, change clothes tomorrow, shower the day after — that’s easier to accept.'},
{id:18,dx:'Long-term illness with diabetes (awaiting discharge)',zone:'ns',e:'🩸',urg:20,
desc:'Bed {b} The patient is waiting to be discharged, but says they don’t want their insulin, and they’ve secretly eaten chocolate. Blood glucose is 15.2 mmol/L (millimoles per litre).',
ch:[['Record the glucose and inform the doctor; talk simply with them about diet and why insulin matters; ask the dietitian to review their meal plan, and teach them how to self-manage after discharge',2,'The patient understood why they need the injections and is willing to learn to check their own glucose.'],['Tell them off for not listening',0,'Scolding won’t change the behaviour, and they’ll be less honest with you afterwards.'],['Wait until the next glucose check',0,'High blood glucose needs prompt action and the doctor must be told.']],
learn:'Psychiatric patients can have physical illnesses too. Nurses care for body and mind together, and teach self-management before discharge to help patients settle back into the community.',
vet:'They say the injections hurt — you can teach them to rotate injection sites.'},
{id:19,dx:'Young first-episode patient',zone:'ns',e:'📞',urg:20,
desc:'Admitted for the first time, Bed {b}: the young patient is crying, saying they’re scared; their family has already phoned five times today asking how they are.',
ch:[['Sit with the patient, show them around the ward and explain the daily routine, and answer their questions; on the phone, confirm the caller’s identity and the patient’s consent before sharing anything, then arrange for the doctor and social worker to talk with the family',2,'The patient is less frightened, and the family feels reassured.'],['Tell the caller everything about the patient’s condition over the phone',0,'Sharing information without confirming identity and getting consent breaches privacy.'],['Tell the family to stop calling',0,'The family’s worry is normal and needs proper support.']],
learn:'A first admission to a psychiatric ward is frightening for patients and families. A short introduction or a word of explanation from a nurse can ease a lot of fear and misunderstanding.',
vet:'Showing them the daily timetable, so they know what happens when, makes them feel less lost.'},
{id:21,dx:'Schizophrenia (grandiose delusions)',zone:'hall',e:'👑',urg:20,
desc:'Bed {b}: the patient tells others: “I know lots of big shots — whoever wants to start a company, I’ll fund it! This whole building is mine!” Some patients start asking to borrow money.',
ch:[['Don’t laugh or argue with them in front of others; gently change the subject; remind the other patients not to exchange money; record their behaviour and mood, and inform the doctor',2,'You protected patients’ money and belongings without hurting their self-esteem.'],['Laugh at them: “If you’re so rich, why are you here?”',0,'Mockery hurts their dignity and may anger them.'],['Play along with them',0,'Going along with it reinforces the delusion.']],
learn:'A grandiose delusion is a firm belief in having a special identity, abilities or wealth. Nurses neither go along with it nor mock it; they stay neutral and keep everyone safe.',
vet:'You don’t need to answer every claim. Bring them back to what they did today to help ground them.'},
{id:22,dx:'Patient with a tendency to violence',zone:'hall',e:'🆘',urg:5,
desc:'A support worker is helping Bed {b} with their meal when the patient suddenly hits them, and the colleague falls!',
ch:[['Call loudly for colleagues’ help straight away; separate the patient from the injured colleague and have the colleague’s injuries checked; calm the patient with de-escalation and inform the doctor; complete an incident report afterwards',2,'The situation is under control, the injured colleague is cared for, and the incident is fully documented.'],['Look after the colleague and leave it there — no need for a report',1,'Incident reports matter: they protect staff and help the team prevent similar incidents.'],['Have the patient restrained straight away as punishment',0,'Restraint is not a punishment; it’s a last resort, used only according to procedure.']],
learn:'Assaults on frontline staff aren’t rare. Wards need clear response procedures, enough staff and support afterwards; every incident should be recorded and reviewed.',
vet:'Your colleague has had a fright — afterwards, check on how they’re feeling, not just their physical injuries.'},
{id:23,dx:'Overdose of sleeping pills (transferred from medical ward)',zone:'bed',e:'💤',urg:15,
desc:'Transferred from the medical ward, Bed {b} — admitted after an overdose of sleeping pills — says they can’t sleep and asks for an extra sleeping pill.',
ch:[['Assess their alertness and vital signs and use the NGASR to assess suicide risk; check the bedside for hidden medicines; use non-drug ways to help sleep (e.g. relaxation exercises), and inform the doctor if needed',2,'You looked after both their sleep and their safety, and they were willing to talk about recent stresses.'],['Give them another pill',0,'Nurses can’t add medication on their own, and this patient is at risk of overdose.'],['Tell them to count sheep',1,'It helps a little, but you haven’t assessed risk or found out why.']],
learn:'Patients admitted after an overdose may have suicidal intent or drug dependence. Nurses assess risk, prevent hoarding of medicines, and address the underlying sleep and mood problems.',
vet:'During medication rounds, watch them swallow and ask them to open their mouth, to prevent hoarding.'}];

const SUD={
fever:{name:'Patient with a fever',e:'🌡️',zone:'bed',urg:15,
desc:'Support worker: “Charge nurse, Bed {b}’s vital signs are done — their temperature is a bit high!“<br><br>📋 Temp: 37.8°C | BP: 128/78 mmHg | Pulse: 96 /min | Resp. rate: 20 /min | Glucose: 6.2 mmol/L (millimoles per litre) | SpO2: 97%',
ch:[['Recheck the temperature yourself, look for other symptoms, then ask the Second to inform the doctor',2,'The recheck confirmed a fever, and the doctor is following up.'],['Ask the Second to inform the doctor straight away',1,'Informing the doctor is right, but rechecking and looking for other symptoms first makes your report more accurate.'],['Leave it until the next round of observations',0,'A fever may be an early sign of infection (e.g. flu) and needs prompt follow-up.']],
learn:'Correct approach: recheck the temperature and look for other symptoms, then inform the doctor; consider whether it might be flu and take infection-control measures if needed.'},
bleed:{name:'Blood in the incontinence pad',e:'🩸',zone:'bed',urg:10,
desc:'Support worker: “Charge nurse! Bed {b} — when I changed their pad, it was full of blood!“',
ch:[['Go straight over and check where the bleeding is from and how much',2,'You find it’s bleeding from haemorrhoids. You take BP and pulse, record the bleeding, and ask the Second to inform the doctor.'],['Tell the colleague to just change the pad',0,'Heavy bleeding can be very dangerous; you must assess it yourself.']],
learn:'Correct approach: check straight away, identify the source (e.g. haemorrhoids), take BP and pulse, record the bleeding, then ask the Second to inform the doctor.'},
flu:{name:'Flu outbreak on the ward',e:'🤧',zone:'ns',urg:20,
desc:'Three patients already have a fever and cough, and rapid flu tests are positive!',
ch:[['Inform the doctor and the infection-control team; cohort or isolate patients with symptoms; masks for the whole ward, more hand hygiene and cleaning; restrict visits and group activities; record the cases',2,'Prompt infection control stopped the flu from spreading further.'],['Wait until tomorrow to see if more people get sick',0,'The ward is crowded, and flu can spread very quickly.'],['Only ask the patients with fever to wear masks',1,'It helps, but it’s not enough.']],
learn:'Psychiatric ward patients share a lot of space, and some may not be able to protect themselves, so infection-control measures must start straight away in an outbreak.'},
family:{name:'Family complaint',e:'😡',zone:'visit',urg:15,
desc:'At visiting time, Bed {b}’s family are angry in the visiting room: “Why is there bruising on their arm and their hand is all scratched? Are you hitting them?”<br><br>(📝 According to the records: the marks were caused by the patient scratching themselves.)',
ch:[['Invite the family somewhere quiet and show you understand their worry; check the notes and mood chart, and explain honestly that the marks are self-inflicted scratches and how the ward manages and prevents them; arrange for the doctor to explain if needed',2,'The family understood what happened and even worked with you on ways to help the patient scratch less.'],['Deny it at once: “It’s nothing to do with us!”',0,'A defensive response makes the family trust you even less.'],['Tell the family to go and complain themselves',1,'Families have the right to complain, but you can listen and explain first.']],
learn:'Complaints from families often come from worry. Clear, honest communication plus complete records are the best tools for handling them.'},
keys:{name:'Missing key',e:'🔑',zone:'ns',urg:15,
desc:'During the key count, one key is missing! If a key to a gazetted (locked) ward ends up with a patient, it could lead to someone going missing or other danger.',
ch:[['Tell colleagues straight away, stop patients going in and out, search systematically, and report it according to procedure',2,'Everyone is on alert; no patient seems to be acting unusually so far.'],['Say nothing and look for it yourself later',0,'Keys matter as much as the patient count — a missing key must be dealt with straight away.']],
learn:'On a psychiatric ward, keys matter as much as the patient count. Count them at every handover and put them back in their fixed place straight after use.'},
patrolEmpty:{name:'Empty bed on patrol',e:'🛏️',zone:'bed',urg:8,
desc:'On your night patrol, you find Bed {b} empty!',
ch:[['Check the toilets and every area straight away, while alerting colleagues and confirming the patient count and the state of the main door',2,'The patient was in the toilet — they couldn’t sleep. You chatted with them for a while and they went back to bed.'],['Come back and check later',0,'A patient missing from bed must be found straight away — they may be at risk of going missing or self-harm.']],
learn:'A night patrol isn’t just “seeing if someone’s there”; you must confirm patients are safe and breathing normally.'},
patrolCover:{name:'Patrol: head under the blanket',e:'🌙',zone:'bed',urg:8,
desc:'Bed {b} The patient has the blanket over their whole head, and you can’t see whether they’re breathing. They’re at high suicide risk.',
ch:[['Gently lift the blanket a little to confirm they’re breathing and responsive, and record it on the suicidal observation chart',2,'The patient is safe; they just don’t like the light. You dim the nearby lights for them.'],['Walk past so you don’t wake them',0,'For high-suicide-risk patients, breathing and safety must always be confirmed.']],
learn:'High-suicide-risk patients must be observed closely according to the suicidal observation chart — including at night.'},
fg:{name:'New colleague asks for help',e:'🌱',zone:'tr',urg:20,
desc:'A newly graduated colleague asks you quietly: “Charge nurse, I’ve never given medication through a feeding tube. Could you show me?”',
ch:[['Take a few minutes to demonstrate, then watch them do it, and encourage them to ask any time',2,'The new colleague is very grateful and much more confident next time.'],['Tell them to read the procedure manual',1,'The manual helps, but the first time it’s best to have someone demonstrate and supervise.'],['“You can’t even do something this simple?”',0,'Sarcasm makes new staff afraid to ask, which actually increases the risk of mistakes.']],
learn:'Supporting new colleagues is part of ward safety. A team culture where people ask and teach reduces errors.'}};


/* ===== New scenario: borrowing a pen ===== */
SCN.push({id:24,dx:'Depression (borrowing a pen)',zone:'hall',e:'🖊️',urg:15,pen:1,
desc:'Bed {b} A patient comes over: “Nurse, could I borrow a pen? I want to write a letter to my family.”',
ch:[['Lend it, saying it must come straight back when they’re done; remember to collect the pen yourself',2,'The patient happily sits down to write. Remember: collect the pen later!'],['Refuse, telling them pens aren’t allowed on the ward',1,'Safe, but the patient is very disappointed. You can lend it, as long as someone supervises and collects it straight away.'],['Lend it and tell them to leave it by the bed when they’re done',0,'A pen nobody collects can become a tool for self-harm or hurting others.']],
learn:'On a psychiatric ward, everyday items like pens, cutlery and cords can become dangerous. Lending them isn’t the problem — the key is supervision, collecting them straight after use and counting them back.',
vet:'When you lend something to a patient, note it in the Diary or on the back of your hand straight away, or you’ll forget when things get busy.'});
const PEN_FOUND={name:'Pen found under the pillow',e:'🖊️',zone:'bed',urg:12,
desc:'While making the bed of Bed {b}, a support worker finds a pen under the pillow — its tip has been bent into a sharp point.',
ch:[['Take the pen away straight away and talk calmly with the patient to find out whether they’ve had thoughts of self-harm; do a safety search, inform the doctor, record it and hand it over',2,'The patient admits they’d thought of using it to cut themselves. You caught it in time, and they’re now on increased observation.'],['Just take the pen away and say nothing',0,'You might miss the patient’s self-harm warning sign.'],['Tell the support worker off for not finding it sooner',0,'It was a nurse who lent the pen; take responsibility yourself and review the process.']],
learn:'Items lent out and not collected can become tools for self-harm. Beyond taking them away, it’s more important to assess the risk behind it.'};

/* ===== Patient backgrounds (fictional): medication [name, dose, strength per tablet, frequency, form, DD] ===== */
const FREQ={OM:['0800'],BD:['0800','2000'],ON:['2000'],TDS:['0800','1200','1700'],QID:['0800','1200','1700','2000']};
const FQN={OM:'every morning',BD:'twice daily',ON:'every night',TDS:'three times daily',QID:'four times daily'};
const PBG={
1:{age:'30s',dx:'Schizophrenia (diagnosed at 24)',hx:'Several relapses after stopping medication',adm:'Stopped medication for two months; voices worsened; compulsory admission via A&E',life:'Lives with parents, unemployed, enjoys drawing',meds:[['Risperidone',2,1,'BD']]},
2:{age:'20s',dx:'Borderline personality disorder (diagnosed at 19)',hx:'Long-term methamphetamine and cannabis use; history of self-harm',adm:'Lost control of emotions after drug use, conflict with family; voluntary admission',life:'Shares a flat with friends, does casual work',meds:[['Sodium valproate',500,500,'BD'],['Nicotine patch',21,21,'OM','patch']]},

/* ===== Randomness (avoid repeats across shifts) ===== */
function memGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function memSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function pickFresh(arr,n,key,idf){const last=memGet(key);const fresh=shuffle(arr.filter(x=>!last.includes(idf(x)))),old=shuffle(arr.filter(x=>last.includes(idf(x))));const r=[...fresh,...old].slice(0,n);memSet(key,r.map(idf));return r}

function mkPatient(bed,sc){const bg=sc?PBG[sc.id]:nextStable();return {bed,dx:sc?sc.dx:bg.dx,risk:sc&&sc.risk||null,scn:sc&&sc.id,age:bg.age,diag:bg.dx,hx:bg.hx||'—',adm:bg.adm||'Stable, continuing treatment',life:bg.life||'—',meds:(bg.meds||[]).map(m=>mkMed(m,bg.route)),route:bg.route}}
