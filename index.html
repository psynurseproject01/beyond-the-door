const KEYS=['Ward main door','Nurses’ station','Treatment room','Drug trolley','DD cabinet','Pantry','Visiting room','Safe'];
function miniCount(k){const n=S.patients.length;const wc=R(1,2),bed=R(4,8),vis=S.shift==='P'?R(1,2):0;const z={'🛏️ Dormitory':bed,'🚻 Toilets / showers':wc};if(vis)z['👪 Visiting room']=vis;z['🛋️ Day room']=n-bed-wc-vis;
 const opts=shuffle([n-1,n,n+1]);
 openM(`<h2>🔑 Handover count (1/2): patients</h2><div class="learn small">👥 <b>Counting patients</b>: makes sure every patient is safely on the ward, that no one is unwell or needing attention without being noticed, and that the incoming staff know each patient’s situation.<br>🔑 <b>Counting keys</b>: keys open the medicine cabinets, treatment room and storerooms. If one is lost, medicines and potentially dangerous items could fall into the wrong hands, endangering patients and staff.<br>Both are part of handing over responsibility — the shift only officially starts once they’re counted.</div><p>Count area by area: </p>
 ${Object.entries(z).map(([a,b])=>`<div class="task"><div class="tt"><b>${a}</b><div class="people">${'🧍'.repeat(b)}</div></div></div>`).join('')}
 <p><b>👉 How many did you count?</b></p><div class="grid2">${opts.map(o=>B(o+' (patients)',()=>{if(o===n){eff(10,0,-2);SFX.ok();countKeys(k,'✅ Count correct','g')}else{eff(-10,0,6);SFX.bad();countKeys(k,`❌ Miscounted! It should be ${n} — the handover count must be accurate`,'b')}},'ctr')).join('')}</div>`)}
function countKeys(k,msg,c){let shown=KEYS.slice();if(S.lostKey){S.lostKeyName=pick(KEYS.slice(2));shown=shown.filter(x=>x!==S.lostKeyName)}
 const openKeyEv=()=>{const e={kind:'gen',d:SUD.keys,t:S.t,state:'pending'};S.events.push(e);closeM();activate(e);openEvent(e)};
 openM(`<h2>🔑 Handover count (2/2): keys</h2><p>The key register says there should be <b>${KEYS.length}</b> keys. On a ward, keys matter as much as the patient count!</p>
 <div class="grid2">${shown.map(x=>`<div class="task"><div class="tt">🔑 ${x}</div></div>`).join('')}</div><p><b>👉 Are all the keys there?</b></p>
 ${B(`✅ ${KEYS.length} keys, all present`,()=>{if(!S.lostKey){eff(10,0,-2);SFX.ok();finishTask(k)}else{eff(-25,-5,10);SFX.bad();addLearn(SUD.keys.learn);log('❌ You missed at handover that a key was missing!');openM(`<div class="fb b">❌ You count again… only ${shown.length} keys! The one missing is “${S.lostKeyName} “.</div>${B('Follow up now ▶',()=>{k.state='done';S.dirty=true;openKeyEv()},'pri block ctr')}`)}},'block')}
 ${B('⚠️ One’s missing!',()=>{if(S.lostKey){eff(15,0,4);S.keyReported=true;SFX.alarm();k.state='done';S.score+=10;S.dirty=true;openKeyEv()}else{eff(-5,0,3);toast('🤔 Count again… actually they’re all there. Stay calm and check them one by one.','w');setTimeout(()=>finishTask(k,5),900)}},'block')}`);
 if(msg)toast(msg,c)}

/* ===== e-MAR medication round (three checks, five rights; using the patient’s actual prescription) ===== */
const RIGHTS=[['Right patient','Right patient'],['Right time','Right time'],['Right drug','Right drug'],['Right dose','Right dose'],['Right route','Right route']];
const dueAt=(p,slot)=>p.meds.filter(m=>FREQ[m.fq].includes(slot));
function miniMed(k,opt={}){const stat=opt.stat;let rows;
 if(stat){const p=S.patients.find(x=>x.bed===k.bed)||S.patients[0];rows=[{p,need:true,done:false,orders:[{n:'Lorazepam',dose:1,per:1,fq:'STAT',form:'tab',dd:true,route:'Oral (STAT)',unit:'mg'}]}]}
 else{const ys=shuffle(S.patients.filter(p=>dueAt(p,k.slot).length));const ns=shuffle(S.patients.filter(p=>!dueAt(p,k.slot).length));
  let pickY=ys.slice(0,2);const dd=ys.find(p=>dueAt(p,k.slot).some(m=>m.dd));if(dd&&!pickY.includes(dd))pickY[0]=dd;
  rows=[...pickY.map(p=>({p,need:true,done:false,orders:dueAt(p,k.slot)})),...ns.slice(0,4).map(p=>({p,need:false})),...ys.filter(p=>!pickY.includes(p)).slice(0,Math.max(0,4-ns.length)).map(p=>({p,need:false,other:true}))];
  if(!pickY.length){const p=pick(S.patients);rows.unshift({p,need:true,done:false,orders:[{n:'Paracetamol',dose:500,per:500,fq:'PRN',form:'tab',route:'Oral (when needed)',unit:'mg'}]})}}
 const m={k,stat,step:stat?'list':'login',rows:stat?rows:shuffle(rows),cur:null,wrong:Math.random()<.4};medRender(m)}
function buildDrawer(m){const r=m.cur,slot=m.k.slot;const packs=r.orders.map(o=>({o,bed:r.p.bed,slot,name:o.n,ok:true}));
 const other=pick(S.patients.filter(p=>p.bed!==r.p.bed));const base=r.orders[0];const otherT=m.k.other;
 const later=r.p.meds.find(x=>FREQ[x.fq]&&FREQ[x.fq].includes(otherT));
 const dis=[{o:base,bed:r.p.bed,slot:otherT,name:later?later.n:pick(ANYDRUG),why:`Right time: this packet is the ${otherT} dose, not the ${slot}`}];
 if(LASA[base.n])dis.push({o:base,bed:r.p.bed,slot,name:LASA[base.n],why:`Right drug: ${LASA[base.n]} ≠ ${base.n} — a look-alike, sound-alike drug that is completely different (LASA)`});
 else{const alt=pick(ANYDRUG.filter(d=>d!==base.n));dis.push({o:base,bed:r.p.bed,slot,name:alt,why:`Right drug: the order doesn’t include ${alt}`})}
 m.drawer=shuffle([...packs,...shuffle(dis).slice(0,2)]);m.pickSel=new Set()}
function medRender(m){const head=`<h2>💊 ${m.k.title}</h2><div class="small mute">🖥️ Electronic medication system (game simulation) ${S.cart?'　🛒 The drug trolley is beside you':''}</div>`;const r=m.cur;
 if(m.step==='login')return openM(`${head}<div class="sys" style="text-align:center"><div style="font-size:34px">🔐</div><p>Staff ID: ●●●●●●<br>Password: ●●●●●●●●</p>${B('Log in',()=>{m.step='menu';medRender(m)},'pri ctr')}</div>`);
 if(m.step==='menu')return openM(`${head}<div class="sys"><p>Choose a function: </p>${shuffle(['Medication administration','Patient details','Reports']).map(x=>B(x,()=>{if(x==='Medication administration'){m.step='list';medRender(m)}else{S.score-=3;toast('❌ Choose “Medication administration” to give medication','b')}},'block')).join('')}</div>`);
 if(m.step==='list'){const left=m.rows.filter(x=>x.need&&!x.done).length;
  if(!left){eff(m.stat?20:25,3,-3);const L='Three checks, five rights: take the packet out, scan the packet and pick the tablets, put the packet back in the drawer — three checks; each time confirm the right patient, time, drug, dose and route. Finally scan the wristband to confirm the patient’s identity. Dangerous drugs (DD, e.g. all benzodiazepines) need two nurses to check, at least one an RN.';addLearn(L);
   return openM(`<h2>✅ ${m.k.title} Done</h2><div class="learn">💡 <b>Three checks, five rights</b><br>${L}</div>${S.vet?'<div class="vet">🦉 The Veteran: “Don’t let anyone interrupt you during the round — if something comes up, have the Second cover first. Take extra care with look-alike, sound-alike drugs (LASA).”</div>':''}${B('Done ✅',()=>finishTask(m.k,10),'pri block ctr')}`)}
  return openM(`${head}<div class="sys"><p>Medication administration　${m.k.slot}　<span class="small"> (<span class="Y">Y</span> medication due　<span class="N">N</span> no medication due)</span></p>${m.rows.map(x=>`<div class="row" data-h="${hb(()=>{if(x.need&&!x.done){m.cur=x;buildDrawer(m);m.step='pick';medRender(m)}else if(x.done||x.other)toast('This patient has already had their medication');else{S.score-=3;toast('❌ This patient is N — no medication due this time','b')}})}"><span>Bed ${x.p.bed}　<span class="small">${x.p.diag}</span></span>${x.done||x.other?'✅':x.need?'<span class="Y">Y</span>':'<span class="N">N</span>'}</div>`).join('')}</div>`)}
 const mar=`<div class="mar"><b>📋 Orders (Bed ${r.p.bed} | ${m.k.slot})</b>${r.orders.map(o=>`<div><span class="lamp"></span>${o.n}　<b>${o.dose} ${o.unit}</b>　${o.route}${o.dd?'　🔴 DD':''}</div>`).join('')}</div>`;
 if(m.step==='pick')return openM(`${head}${mar}<h3>① First check: take the packets out of the trolley</h3><p class="small">This patient’s drawer holds the following packets. Checking against the order, select the packets due<b>now</b>— with the<b>right drug name, right time and right strength</b>: </p>
  ${m.drawer.map((pk,i)=>`<button class="pack ${m.pickSel.has(i)?'sel':''}" data-h="${hb(()=>{m.pickSel.has(i)?m.pickSel.delete(i):m.pickSel.add(i);medRender(m)})}"><span class="pi">${pk.o.dd&&pk.ok?'🔴':'💊'}</span><span><b>${pk.name}</b>　${pk.o.per} ${pk.o.unit}/${pk.o.form}<br>${pk.slot}</span><span style="margin-left:auto">${m.pickSel.has(i)?'✅':''}</span></button>`).join('')}
  ${B('Take out, next step ▶',()=>{const sel=[...m.pickSel].map(i=>m.drawer[i]);const wrong=sel.filter(p=>!p.ok);const names=[...new Set(r.orders.map(o=>o.n))];const miss=names.filter(n=>!sel.some(p=>p.ok&&p.name===n)).map(n=>({name:n}));const dup=names.filter(n=>sel.filter(p=>p.ok&&p.name===n).length>1);
   if(dup.length){S.score-=3;SFX.bad();toast('❌ Only one packet per drug: '+dup.join(', '),'b');return}
   if(wrong.length||miss.length){S.score-=8;SFX.bad();toast('❌ '+[...wrong.map(w=>w.why),...miss.map(p=>'Missed: '+p.name)].join('; '),'b');return}
   SFX.ok();m.packs=sel.map(p=>({...p,scan:false,cnt:null}));m.step='prep';medRender(m)},'pri block ctr')}`);
 if(m.step==='prep'){const allDone=m.packs.every(p=>p.scan&&p.cnt!==null);

/* --- Meals / snacks (check against the Diary) --- */
function miniMeal(k,kind){const meal=kind==='meal';
 const diets=meal?['Normal diet','pureed diet','Diabetic diet','Liquid diet']:['Regular snack','Sugar-free snack (diabetes)','Soft snack (swallowing difficulty)'];
 const mis=meal?[['Normal diet','Liquid diet'],['pureed diet','Normal diet'],['Diabetic diet','Normal diet']]:[['Sugar-free snack (diabetes)','Chocolate'],['Soft snack (swallowing difficulty)','Hard biscuits']];
 const npoNow=meal&&S.shift==='A'&&k.t<500&&S.npoBed;
 const stNow=meal&&S.stFired&&!S.stDone&&S.stBed;let pts=shuffle(S.patients.filter(p=>p.scn!==10&&p.bed!==S.npoBed&&p.bed!==S.stBed)).slice(0,(npoNow?3:4)-(stNow?1:0));const bad=R(0,pts.length-1),mm=pick(mis);const missP=!meal&&Math.random()<.5?shuffle(S.patients.filter(p=>p.scn!==10&&!pts.includes(p)))[0]:null;const sList=meal?[]:[...pts.map(p=>p.bed),...(missP?[missP.bed]:[])].sort((x,y)=>x-y);let missAns=null;
 const trays=pts.map((p,i)=>{if(i===bad)return {p,card:mm[0],got:mm[1],ok:false,ans:null,why:`should be “${mm[0]} “, but ” ${mm[1]}”`};const d=pick(diets);return {p,card:d,got:d,ok:true,ans:null}});
 if(stNow){const p=S.patients.find(x=>x.bed===S.stBed);trays.splice(R(0,trays.length),0,{p,card:'Normal diet',got:'Normal diet',ok:false,ans:null,st:1,why:`The speech therapist has changed the diet to ${S.stDiet}, but the menu hasn’t been updated yet — a normal diet can’t be served`})}
 if(npoNow){const p=S.patients.find(x=>x.bed===S.npoBed);trays.splice(R(0,3),0,{p,card:'Normal diet',got:'Normal diet',ok:false,ans:null,npo:1,why:'The Diary says fasting bloods this morning — breakfast can’t be served'})}
 const rd=()=>openM(`<h2>${k.e} ${k.title}</h2><p class="small">Before serving ${meal?'meals':'snacks'}, check each one against the ${meal?'menu':'dietary instructions'} and what is actually being served.<b>📔 Remember to check the Diary and the latest ward updates too (e.g. the speech therapist changing a diet)!</b></p>${meal?'':`<div class="sys">📋 Snack list this round: Bed ${sList.join(', ')}</div>`}${B('📔 Open the Diary',()=>{openM(`<h2>📔 Diary</h2>${S.diary.map(d=>`<div class="task"><div class="tt">${d.done?'✅':'⬜'} ${d.x}</div></div>`).join('')}${B('Back to serving ▶',rd,'pri block ctr')}`)},'sm')}
 ${trays.map(t=>`<div class="task"><div class="tt"><b>Bed ${t.p.bed}</b><br>📄 Instruction: ${t.card}<br>${meal?'🍱':'🍪'} Actual: <b>${t.got}</b></div><div style="display:flex;flex-direction:column;gap:6px">${B('✅ Serve',()=>{t.ans=true;rd()},'sm'+(t.ans===true?' sel':''))}${B('❌ Don’t serve',()=>{t.ans=false;rd()},'sm'+(t.ans===false?' sel':''))}</div></div>`).join('')}
 ${B('Check complete ▶',()=>{if(trays.some(t=>t.ans===null)){toast('⚠️ Not all checked yet','w');return}if(!meal&&missAns===null){askMiss();return}res()},'pri block ctr')}`);
 const askMiss=()=>openM(`<h2>📋 Check the snack list</h2><p class="small">Checking against this round’s snack list (Bed ${sList.join(', ')}), which patient hasn’t had their snack yet?</p>${sList.map(b=>B(`Bed ${b}`,()=>{missAns=b;res()},'block')).join('')}${B('Everyone’s had theirs ✅',()=>{missAns=0;res()},'block')}`);
 const res=()=>{const wrongT=trays.filter(t=>t.ans!==t.ok);const missOk=meal||missAns===(missP?missP.bed:0);if(!missOk)wrongT.push({miss:1});
  trays.filter(t=>t.npo&&t.ans===true).forEach(()=>{S.npoFed=true});if(stNow)S.stDone=true;
  if(!wrongT.length){eff(15,3,-2);SFX.ok()}else{eff(-12*wrongT.length,-4,6);SFX.bad();S.badc++}
  const L=meal?'Serving the wrong meal can be dangerous: a patient with swallowing difficulty given a normal diet may choke; a diabetic patient given a normal diet may lose glucose control; a patient fasting for bloods who eats breakfast gets inaccurate results and needs rebooking; if the speech therapist changes a diet, update the menu and tell the kitchen straight away. Always check the menu, the Diary and the latest instructions before serving.':'Snacks must follow dietary instructions too: sugar-free for diabetes, soft for swallowing difficulty — and don’t miss anyone; some patients get very upset without their snack.';addLearn(L);

 rd()}

/* --- New admission --- */
function miniAdmission(e){const st=pick(['Voluntary admission','Compulsory admission (Forms 1, 2, 3)']);
 const items=[...shuffle([['Wallet (cash)','safe'],['Watch','safe'],['Mobile phone','safe']]).slice(0,2),...shuffle([['Change of clothes','store'],['Slippers','store'],['Books','store']]).slice(0,2),...shuffle([['Lighter','danger'],['Box cutter','danger'],['Cable ties','danger']]).slice(0,2)];
 const sorted={};const bpHigh=Math.random()<.5;const bp=bpHigh?'168/102':'124/78';
 const forms=['DASA','NGASR','Morse Fall Scale','Norton Scale','FTOCC','Admission notification form','CIWA-Ar'];const fsel={};
 let step=0,score=0;const N=7;const nb=S.nextBed++;
 const wrap=h=>openM(`<h2>📞 New admission (${step+1}/${N})</h2><div class="prog"><i style="width:${(step+1)/N*100}%"></i></div>${h}`);
 const next=()=>{step++;draw()};
 function draw(){
  if(step===0)wrap(`<h3>① Check the admission documents (most important!)</h3><div class="sys">📄 Admission documents<br>Patient: new admission (Bed ${nb} )<br>Admission status: <b>${st}</b><br>Referred by: A&E</div><p><b>What admission status is on the documents?</b></p>${['Voluntary admission','Compulsory admission (Forms 1, 2, 3)'].map(o=>B(o,()=>{if(o===st){score+=10;SFX.ping()}else{score-=10;SFX.bad()}next();if(o!==st)toast(`❌ The documents state “${st} “ — read them carefully`,'b')},'block')).join('')}<div class="learn small">💡 Forms 1, 2 and 3 are one set of documents under the Mental Health Ordinance for compulsory admission for observation — not three separate statuses. Nurses must check whether the patient is a voluntary or compulsory admission and, if compulsory, whether the full set of documents is complete, because it affects the patient’s rights.</div>`);
  if(step===1)wrap(`<h3>①b Check the patient’s identity</h3><p>The patient has their ID card. How will you check their identity?</p>${B('Check the ID card: name, ID number and date of birth must match the admission documents and wristband',()=>{score+=10;SFX.ping();next()},'block')}${B('Ask the patient their name — if it matches, that’s enough',()=>{score-=10;SFX.bad();next();toast('❌ Check the ID card and confirm the name, ID number and date of birth match the admission documents and wristband','b')},'block')}`);
  if(step===2)wrap(`<h3>② Check belongings + body search</h3><p class="small">Valuables are logged and kept in the hospital safe; non-valuables go to the ward storeroom; dangerous items are taken away.</p>${items.map((it,i)=>`<div class="card" style="padding:10px;margin:8px 0"><b>${it[0]}</b><div class="grid2" style="grid-template-columns:1fr 1fr 1fr">${[['safe','🔒 Safe'],['store','📦 Storeroom'],['danger','⛔ Dangerous']].map(([v,l])=>B(l,()=>{sorted[i]=v;draw()},'sm ctr'+(sorted[i]===v?' sel':''))).join('')}</div></div>`).join('')}${B('Next step ▶',()=>{if(Object.keys(sorted).length<items.length){toast('⚠️ Not all sorted yet','w');return}const c=items.filter((it,i)=>sorted[i]===it[1]).length;score+=c*3-(items.length-c)*4;next();if(c<items.length)toast(`🟡 Correctly sorted ${c}/${items.length}: wallet, watch and phone to the safe; clothes, slippers and books to the storeroom; lighter, box cutter and cable ties are dangerous items`,'w');else SFX.ping()},'pri block ctr')}`);
  if(step===3){const f=pick(['A bruise about 3 cm across on the right forearm','A graze on the left calf','A red rash on the back']);wrap(`<h3>③ Brief physical check</h3><p>You find: <b>${f}</b>. </p>${B('Record the location and size in detail and inform the doctor',()=>{score+=10;SFX.ping();next()},'block')}${B('It’s nothing major — no need to record it',()=>{score-=10;SFX.bad();next();toast('❌ Any injury on admission must be recorded — it protects both patient and staff','b')},'block')}`)}
  if(step===4)wrap(`<h3>④ Take blood pressure now</h3><div class="sys">BP: ${bp} mmHg<br>Pulse: ${bpHigh?104:82} /min<br>Temp: 36.8°C</div>${B('Record it; if normal, follow up as usual',()=>{if(bpHigh){score-=5}else{score+=8;SFX.ping()}next();if(bpHigh)toast('🟡 BP is high — inform the doctor and recheck later','w')},'block')}${B('Inform the doctor and recheck later',()=>{if(bpHigh){score+=10;SFX.ping()}else score+=3;next();if(!bpHigh)toast('🟡 The readings are normal — just record them','w')},'block')}`);
  if(step===5)wrap(`<h3>⑤ Assessment forms and documents</h3><p class="small">Choose the forms to complete on admission (this patient doesn’t drink alcohol): </p>${forms.map(f=>B((fsel[f]?'☑️ ':'⬜ ')+f,()=>{fsel[f]=!fsel[f];draw()},'block'+(fsel[f]?' okc':''))).join('')}
  <div class="learn small">DASA: short-term violence risk | NGASR: suicide risk | Morse Fall Scale: falls risk | Norton Scale: pressure-ulcer risk | FTOCC: Fever, Travel, Occupation, Contact, Clustering (infection-control screening) | CIWA-Ar: alcohol withdrawal assessment</div>
  ${B('Next step ▶',()=>{const ok=forms.slice(0,6).every(f=>fsel[f])&&!fsel['CIWA-Ar'];if(ok){score+=12;SFX.ping()}else score-=6;next();if(!ok)toast('🟡 You should choose DASA, NGASR, Morse, Norton, FTOCC and the admission notification form; CIWA-Ar is for patients in alcohol withdrawal','w')},'pri block ctr')}`);
  if(step===6)wrap(`<h3>⑥ Contact the family</h3><p>📞 You call the patient’s registered emergency contact.</p>${B('First confirm who they are, tell them the patient has been admitted, and give the visiting hours and what to bring',()=>{score+=10;done()},'block')}${B('Give full details of the condition to whoever answers',()=>{score-=10;done('❌ Confirm their identity first to protect the patient’s privacy')},'block')}`)}
 function done(w){e.state='done';S.dirty=true;S.patients.push({bed:nb,dx:'New admission',diag:'New admission ('+st.replace(' (voluntary admission)','')+')',age:'—',hx:'—',adm:'Admitted today',life:'—',meds:[],risk:null});S.handled.push(`Bed ${nb} New admission`);
  eff(score,2,score>40?-3:5);score>40?SFX.ok():SFX.bad();const L='A new admission involves: checking the admission documents and identity, handling belongings, a physical check and search for dangerous items, taking BP, completing assessment forms (DASA, NGASR, Morse, Norton, FTOCC) and the admission notification form, then informing the family.';addLearn(L);
  log(`✅ New admission complete (Bed ${nb}), total patients ${S.patients.length}`);

 draw()}

const STORY_LESSONS=['Open questions, reflecting feelings and sitting in silence are all therapeutic communication skills.','Don’t rush to contradict or reassure — understand how the person feels first.','Asking directly about suicidal thoughts doesn’t increase risk. Suicidal thoughts can’t be kept secret: tell the patient honestly that the team will be informed.','Patients’ worries about medication, the future and how others see them are very real. Take them seriously and encourage them to talk to the doctor.'];
const COND={
dep:['😔 Depression',['Listen more, talk less, and give them time; sitting quietly together is a form of support too.','Acknowledge that their pain is real, and separate symptoms from personality: having no energy and not being able to get up are symptoms, not laziness.','If you’re worried they have suicidal thoughts, you can ask directly. Asking doesn’t increase risk — it gives them a chance to talk about it.','Encourage them to see a doctor, and do small things together, like going for a short walk.'],'“Look on the bright side”, “Be strong”, “Everyone gets stressed”','“It sounds like things have been really hard lately. I’m here with you.”'],
ano:['🥄 Anorexia',['Don’t comment on body shape, weight or portion sizes, and don’t count calories.','Understand that restricting food is often a way to cope with anxiety and regain a sense of control; show interest in how they feel first.','Separate the illness from the person: talk about their interests and life, not just food.','Keep them company at mealtimes in a relaxed atmosphere; don’t force them to eat or use guilt to persuade them.'],'“You’re not fat, just eat more”, “Your family are so worried about you like this”','“Mealtimes seem to make you really tense — is that right?”'],
fep:['🎧 Psychosis',['Acknowledge their experience and feelings; don’t argue with the content of voices or delusions, and don’t agree with it either.','Use calm, simple, clear words, and avoid too much stimulation.','Use accurate information to reduce stigma: psychosis can be treated, and early treatment works better.','Respect their privacy and decisions, and encourage regular follow-up and medication.'],'“Nobody’s talking, you heard wrong”, “You’ve gone mad”','“Hearing those voices must be really frightening. I’m here with you.”'],
eld:['👴 Dementia',['Use simple words and short sentences, one thing at a time; speak slowly and wait for a reply.','Use yes/no or either/or questions rather than open questions; use gestures, photos and name badges.','Don’t correct or argue — respond to the feeling first. “I want to go home” may mean unease, missing family, or being hungry, cold or needing the toilet.','Keep surroundings and routines familiar; be patient and give plenty of reassurance.'],'“Have you forgotten again?”, “I literally just told you”','“Do you need the toilet? I’ll come with you.”'],
alc:['🍺 Alcohol dependence',['Don’t judge or blame; affirm their motivation to change — every attempt deserves recognition.','Understand the reasons behind the drinking, such as stress, insomnia or loneliness, and think of other ways to cope together.','Watch for withdrawal signs such as shaking, sweating, a racing heart or seeing things that aren’t there, and seek medical help straight away if needed.','Relapse isn’t failure; encourage them to join a mutual-help group and attend regular follow-up.'],'“You shouldn’t have drunk in the first place”, “You’ve got no willpower”','“Being willing to try to stop drinking is already a really important step.”'],
mania:['⚡ Mania',['Short sentences, a steady tone, and less stimulation — lights, noise and crowds.','Don’t go along with or argue against grandiose ideas; gently guide them to put off big decisions, like spending or quitting a job.','Help them rest and keep a regular sleep pattern; lack of sleep makes the illness worse.','Learn the warning signs of relapse together: sleeping little without feeling tired, talking fast, lots of big plans, a strong urge to buy things.'],'“You’ve gone mad”, “You’ll never manage that”','“You’ve got a lot of ideas right now. Let’s go and sit somewhere quieter first.”'],
grief:['🕯️ Grief',['Grief has no timetable. The five stages (denial, anger, bargaining, depression, acceptance) don’t necessarily come in order and can come back again.','Being there and listening helps more than telling someone to “let go”. You can invite them to share memories of the person who died.','Accept their emotions, including anger, self-blame and guilt; watch for suicidal thoughts.','Check in especially around anniversaries and festivals; if grief affects daily life for a long time, encourage bereavement counselling.'],'“They’re in a better place”, “Be strong and look forward”','“You miss them so much. I’d love to hear about them.”']};

const LONGS={"ano": {"title": "A Full Stomach, a Sleepless Night", "sub": "Anorexia | 18, first-year university student", "nodes": [{"p": "The patient sits on the edge of the bed, arms wrapped around their stomach: “I can’t sleep… my stomach feels so bloated.”", "i": "I ate a whole bowl of rice tonight. I’m so scared.", "stage": "", "ch": [["“The bloating is really uncomfortable — and it sounds like something else is keeping you awake too.”", 2, "", "Skill used: Reflection"], ["“Of course you feel full after eating. Go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Dismissing the feeling misses the worry behind it."]]}, {"p": "“I feel like I ate way too much tonight.”", "i": "The scales will definitely be up tomorrow morning.", "stage": "", "ch": [["“Thinking about how much you ate tonight makes you really tense. Can you tell me a bit more about what that tension feels like?”", 2, "", "Skills used: Reflection + Open question"], ["“You didn’t eat that much.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Talking about portion sizes makes them focus even more on numbers."]]}, {"p": "“My heart’s racing and my hands are shaking… I feel so panicky.”", "i": "I can’t control myself.", "stage": "", "ch": [["“You’re feeling really panicky right now — your heart’s racing and your hands are shaking, your body can feel it. Shall we breathe in slowly together, and then breathe out slowly?”", 2, "", "Skills used: Reflection + Guided relaxation"], ["“You’re overthinking it. Don’t be so tense.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Dismissing anxiety only makes them feel nobody understands."]]}, {"p": "(After a few slow breaths) “…A bit better.”", "i": "So that’s something I can do.", "stage": "", "ch": [["“You were willing to try it with me, and you noticed yourself feeling a bit better. That’s not easy.”", 2, "", "Skill used: Affirmation"], ["“See? I told you it was nothing.”", 0, "They say nothing more, as if they’ve shut themselves away.", "It sounds like you’re saying they were making a fuss."]]}, {"p": "“When I don’t eat, I actually feel less panicky — like everything’s under my control.”", "i": "This is the only thing I can control.", "stage": "", "ch": [["“It sounds like restricting food is how you cope with anxiety — it gives you a sense of control. But it’s also really hard on your body.”", 2, "", "Skills used: Reflection + Education: the link between anxiety and restrictive eating"], ["“You’ll die if you don’t eat!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Scare tactics only increase anxiety and resistance."]]}, {"p": "“Since starting university, everything’s been chaos — coursework, classmates, my family’s expectations…”", "i": "I’m so scared of letting people down.", "stage": "", "ch": [["“Lots of pressure all at once, and it sounds like you feel you have to be the best. Which one weighs on you most?”", 2, "", "Skills used: Reflection + Open question"], ["“Everyone at university feels like that.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Normalising in the wrong place makes them feel they’re too weak."]]}, {"p": "“I don’t want my family to think I’m a burden.”", "i": "They’re so worried about me being in hospital.", "stage": "", "ch": [["“You care a lot about how your family feels. Being in hospital doesn’t make you a burden — you’re unwell and need care, just like with any other illness.”", 2, "", "Skills used: Affirmation + Reducing stigma"], ["“If you know they’re worried, just eat more.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Using guilt to make them eat damages trust."]]}, {"p": "“Breakfast tomorrow… I’m really scared.”", "i": "I’m scared I won’t be able to eat, and scared I’ll panic even more after eating.", "stage": "", "ch": [["“Lots of patients in your situation find the time before and after meals frightening — you’re not alone. At breakfast tomorrow, the nurses and the dietitian will be with you, and we’ll face it together.”", 2, "", "Skills used: Normalising + Support"], ["“You must eat all of it tomorrow.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Adds pressure without offering support."]]}, {"p": "“What can I do when I get scared?”", "i": "I’d like to try something different.", "stage": "", "ch": [["“It’s great that you want to try other ways. Let me teach you one called ’5-4-3-2-1’: name five things you can see… four things you can hear… three things you can touch… two things you can smell… one thing you can taste.” The patient follows along slowly: “The curtains, the bedside lamp… the air con… the blanket’s soft…” Their shoulders relax. “You can use it whenever you’re scared, or come and talk to a nurse.”", 2, "", "Skills used: Affirmation + Teaching a grounding exercise"], ["“Just don’t think about it.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Vague advice that doesn’t help."]]}, {"p": "“…After talking to you tonight, I don’t feel so scared.”", "i": "So talking about it does help.", "stage": "", "ch": [["“Thank you for trusting me. Tonight you told me you felt really panicky after eating, that restricting food is how you cope with anxiety, and that you’re worried about your family and tomorrow’s breakfast. I’ll pass your worries on at handover so the team can help you together. Try to get some rest.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“OK, go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to summarise and follow up."]]}], "end": "They finally fall asleep. At 06:30 they ask quietly: “Tomorrow morning… could someone have breakfast with me?”", "lessons": ["Anxiety is often closely linked to restrictive eating.", "Don’t talk about calories, weight or portion sizes.", "Use reflection, affirmation, open questions and summarising to help the patient voice the worries underneath."], "principle": ""}, "dep": {"title": "By the Window Before Dawn", "sub": "Depression | 40s, admitted after losing their job", "nodes": [{"p": "The patient stands at the window looking out: “I can’t sleep.”", "i": "Every night it’s the same — I can’t sleep, and then I can’t get up.", "stage": "", "ch": [["Stand quietly beside them: “I’ll stand here with you for a while.”", 2, "", "Skill used: Therapeutic silence"], ["“It’s late. Go back to bed.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Sending them straight back to bed misses the chance to talk."]]}, {"p": "“I keep wondering how my family are doing now…”", "i": "How will they get by without my salary?", "stage": "", "ch": [["“You miss your family, and you’re worried about them too. Can you tell me more about what worries you most?”", 2, "", "Skills used: Reflection + Open question"], ["“They’ll be fine. Don’t worry.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Empty reassurance."]]}, {"p": "“I’ve lost my job, and I don’t know how we’ll pay the mortgage. I used to be the one holding the family together.”", "i": "I’m useless now.", "stage": "", "ch": [["“You’ve always held things up for your family. Now without your job, it’s as if you’ve lost your role as well.”", 2, "", "Skill used: Reflection"], ["“Just find another job.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Jumping to solutions too fast ignores their sense of loss."]]}, {"p": "“My family think I’m lazy — I can’t even get up in the morning.”", "i": "I feel useless too.", "stage": "", "ch": [["“Having no energy to get up is a symptom of depression, not laziness. Coming into hospital for treatment is already a step for your family and for yourself.”", 2, "", "Skills used: Education + Affirmation"], ["“You just need to try harder.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Makes them blame themselves even more."]]}, {"p": "“Sometimes… I think if I went to sleep and didn’t wake up, I wouldn’t have to suffer like this anymore.”", "i": "Now I’ve said it — what will they think of me?", "stage": "", "ch": [["Calmly and directly: “Thank you for telling me. I want to ask you clearly: are you having thoughts of ending your life right now?”", 2, "", "Skill used: Asking directly about suicide risk"], ["“Don’t talk nonsense!”", 0, "They say nothing more, as if they’ve shut themselves away.", "The patient will hide their thoughts."]]}, {"p": "“…I’ve thought about it, but I don’t have a plan.”", "i": "They weren’t shocked, and they’re still listening.", "stage": "", "ch": [["“It takes a lot of courage to say that. I need to tell the doctor and the team, so we can all keep you safe — I can’t keep it secret, but I’ll be here the whole time.”", 2, "", "Skills used: Affirmation + Being honest that it can’t be kept secret"], ["“OK, I won’t tell anyone.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Promising secrecy is wrong and delays help."]]}, {"p": "“My mind won’t stop. It just keeps going and going.”", "i": "Alone here, the more I think, the darker it gets.", "stage": "", "ch": [["“Let me show you something. Let’s sit down together and close our eyes. Breathe in slowly for a count of four, pause, then breathe out slowly for a count of six. If thoughts drift by, that’s fine — just bring your attention back to your breathing.” The patient does it with you a few times.", 2, "", "Skill used: Breathing meditation"], ["“Don’t think so much.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Easier said than done — no method offered."]]}, {"p": "“…My mind’s a bit calmer.”", "i": "I haven’t felt like this in ages.", "stage": "", "ch": [["“You did really well. When you can’t sleep or your thoughts are racing, you can do this too — and you can come to a nurse any time.”", 2, "", "Skills used: Affirmation + Reinforcing the technique"], ["“There you go, all sorted.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Treating the problem as solved too quickly."]]}, {"p": "“Is there any way back for me?”", "i": "I really want to believe I’ll get better.", "stage": "", "ch": [["“Depression can be treated. Many people slowly get better with medication and counselling. The social worker can also help you think about work and finances.”", 2, "", "Skills used: Instilling hope + Practical support"], ["“How would I know?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Cold, and it makes them more hopeless."]]}, {"p": "“Thank you for staying with me tonight.”", "i": "Saying it out loud wasn’t as frightening as I thought.", "stage": "", "ch": [["“Thank you for trusting me. Tonight you told me you’re worried about your family, that you feel useless, and that you’ve thought about not waking up. I’ll hand this over to the doctor and the team to follow up, and I’ll check on you more often tonight. Try to get some rest.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“No problem. Go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to summarise and follow up."]]}], "end": "They go back to bed. On every 15-minute check after that, they’re in bed, and by 04:30 they’re asleep.", "lessons": ["Asking directly about suicidal thoughts doesn’t increase risk.", "Suicidal thoughts can’t be kept secret: tell the patient honestly that the team will be informed.", "Having no energy to get up is a symptom of depression, not laziness.", "Breathing meditation can bring you back from racing thoughts to the present moment."], "principle": ""}, "fep": {"title": "Am I Going Mad?", "sub": "First-episode psychosis | 19, first admission", "nodes": [{"p": "The patient sits on the bed wearing earphones, with no music playing: “I can’t sleep.”", "i": "With earphones on, maybe I’ll hear less.", "stage": "", "ch": [["Sit on the chair beside them: “I see you’ve got your earphones in, but there’s no music on. Shall I sit with you for a bit?”", 2, "", "Skills used: Observation + Being present"], ["“Take your earphones out and go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "An order — and it misses the reason behind the earphones."]]}, {"p": "“The voices haven’t come tonight, but I’m scared they’ll come back.”", "i": "If my classmates knew I hear voices, what would they think of me?", "stage": "", "ch": [["“Scared they’ll come back… What’s it like when you hear those voices?”", 2, "", "Skill used: Open question"], ["“Nobody’s talking. You just heard wrong.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Denying their experience means they won’t tell you again."]]}, {"p": "“It’s like someone’s yelling in my ear, saying I’m useless… I’m so scared.”", "i": "I can’t tell what’s real.", "stage": "", "ch": [["“I can’t hear those voices, but I believe you really do hear them, and that it’s really frightening. You’re in hospital now, you’re safe, and I’m here.”", 2, "", "Skill used: Acknowledging feelings, without arguing or agreeing"], ["“What are they saying? What are they telling you to do?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Only probing the content, without tending to their fear."]]}, {"p": "“Have I gone mad? Will I ever be able to go back to uni?”", "i": "Is my life over?", "stage": "", "ch": [["“You haven’t ’gone mad’ — you’re unwell. Psychosis can be treated, and lots of young people who get treatment early go back to their studies and do the things they love.”", 2, "", "Skills used: Reducing stigma + Instilling hope"], ["“You’re worrying about uni right now?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Brushes off their biggest worry."]]}, {"p": "“The doctor says I need medication… Will I have to take it forever? Will it make me slow?”", "i": "Will my classmates find out I’m on medication?", "stage": "", "ch": [["“Lots of people worry about that. The medication will help reduce the voices, and how long you take it depends on how you get on. If there are side effects, like feeling very tired, you can talk to the doctor about adjusting it.”", 2, "", "Skills used: Normalising + Giving information"], ["“If the doctor says take it, take it.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Without explanation, it can put them off taking it."]]}, {"p": "“I’m scared of putting on weight, and scared I’ll be so drowsy I’ll fall asleep in class.”", "i": "I’ve finally said what’s really worrying me.", "stage": "", "ch": [["“You’re worried about your weight and staying alert in class — those are very real concerns. I’ll note them down and hand over so the doctor can talk with you tomorrow morning.”", 2, "", "Skills used: Reflection + Follow-up"], ["“Your health matters more than your weight.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Overlooks their worry."]]}, {"p": "“I don’t want my classmates to know I’m in here.”", "i": "They’d definitely think I’m weird.", "stage": "", "ch": [["“Your health is your private information — whether you tell anyone, and how much, is up to you. The social worker and occupational therapist can also help you plan going back to uni.”", 2, "", "Skills used: Respecting autonomy + Practical support"], ["“What’s there to be scared of?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Brushes off their fear of stigma."]]}, {"p": "“If the voices come back, what should I do?”", "i": "I’m so scared I won’t be able to control myself.", "stage": "", "ch": [["“Let me teach you something called ’5-4-3-2-1’: name five things you can see, four things you can hear, three things you can touch, two things you can smell, one thing you can taste.” The patient goes slowly: “The bedside lamp, the curtains… the air con, your voice… the blanket…”", 2, "", "Skill used: Teaching a grounding exercise"], ["“Just ignore them.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Easier said than done."]]}, {"p": "“…I feel a bit steadier after that.”", "i": "So there is something I can do.", "stage": "", "ch": [["“You did really well. When the voices come back, you can use this, or listen to music, breathe deeply, or come straight to a nurse. You don’t have to cope alone.”", 2, "", "Skills used: Affirmation + Reinforcing the technique"], ["“There, that’s it.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Doesn’t help them reinforce the technique."]]}, {"p": "“Thanks for talking with me.”", "i": "Maybe… my life isn’t over yet.", "stage": "", "ch": [["“Thank you for trusting me. Tonight you told me you’re scared the voices will come back, worried about uni and what your classmates think, and concerned about the medication. I’ll note it down and hand over for the doctor to follow up. Try to get some rest.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“OK, go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to summarise and follow up."]]}], "end": "At 02:55 they take off the earphones and finally start to feel sleepy. At 06:30 they ask: “What time is the doctor’s round? I want to ask about side effects.”", "lessons": ["Don’t argue with or agree with the content of voices; acknowledge the patient’s feelings.", "Psychosis can be treated, and early treatment is important.", "The 5-4-3-2-1 grounding exercise can help bring you back to the present.", "Respecting privacy eases the fear that stigma brings."], "principle": ""}, "eld": {"title": "I’m Getting the Bus Home", "sub": "Older man with dementia | 80s, Alzheimer’s disease", "nodes": [{"p": "The old man stands at the door clutching a plastic bag: “I’m getting the bus home!”", "i": "It’s dark — my family are waiting for me.", "stage": "", "ch": [["Approach slowly, crouch to his eye level and say softly: “You want to go home.”", 2, "", "Skill used: Brief reflection"], ["“You’re in hospital now — you can’t go home!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Contradicting him flatly makes him more agitated."]]}, {"p": "“Yes! My son’s waiting for me for dinner!”", "i": "I’m late — he’ll be worried.", "stage": "", "ch": [["“You love your son very much.”", 2, "", "Skill used: Responding to the feeling, not correcting"], ["“Your son visited you this afternoon — don’t you remember?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too much information, and it makes him feel his memory is failing."]]}, {"p": "“Who are you? I don’t know you.”", "i": "Why is there a stranger here?", "stage": "", "ch": [["Point to your name badge: “I’m a nurse. I’m here with you.”", 2, "", "Skill used: Simple introduction, with name badge"], ["“You’ve forgotten me again? I was just talking to you!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Blaming his memory hurts him."]]}, {"p": "“I need my money! There’s money in my bag!”", "i": "How can I get the bus without money?", "stage": "", "ch": [["“You’re worried about your money. Shall we look in the bag together?” (Open it with him — inside are a towel and an old photo)", 2, "", "Skill used: One thing at a time"], ["“Your money’s in the hospital safe — it was logged when you were admitted.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too complicated for him to follow."]]}, {"p": "The old man picks up the photo: “This is my son.”", "i": "He was so cute when he was little.", "stage": "", "ch": [["“He’s very handsome. Is this your son?”", 2, "", "Skill used: Yes/no question to keep the conversation going"], ["“How old is your son now? What does he do?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too many questions, too hard to answer."]]}, {"p": "“Yes… he’s a good boy.” The old man sits down.", "i": "Thinking of the old days settles my heart.", "stage": "", "ch": [["Sit with him and gently pat his hand, without rushing to talk.", 2, "", "Skills used: Therapeutic silence + Body language"], ["“Right, back to bed now.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Cutting him off too soon — he may try to leave again."]]}, {"p": "“I’m cold.”", "i": "It’s cold at night.", "stage": "", "ch": [["“Shall I get you a blanket?”", 2, "", "Skill used: Either/or / yes-no question, meeting a practical need"], ["“The air con isn’t that cold.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Denies how he feels."]]}, {"p": "The old man hugs the blanket and looks at you: “I’m a bit scared.”", "i": "This place is strange to me.", "stage": "", "ch": [["“Don’t be scared, I’m here. Let’s breathe in slowly together… and breathe out slowly.” The nurse holds his hand and they do a few simple breaths together.", 2, "", "Skill used: Simple breathing relaxation, with touch"], ["“What’s there to be scared of?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Denies his feelings."]]}, {"p": "“Do you want to go to the toilet, or sit a bit longer?” The old man answers: “Toilet.”", "i": "So that’s what he needed.", "stage": "", "ch": [["Take him to the toilet, then walk him back to bed.", 2, "", "Skill used: Either/or question, finding the real need"], ["“You went to the toilet just now.”", 0, "They say nothing more, as if they’ve shut themselves away.", "He may not remember, and his need is real."]]}, {"p": "The old man lies down: “Thank you, nurse.”", "i": "This person’s kind.", "stage": "", "ch": [["“You’re welcome. I’m here — sleep easy.”", 2, "", "Skill used: Short, gentle words that give a sense of safety"], ["Walk away without a word", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to help him feel safe."]]}], "end": "Holding the photo, he slowly falls asleep. At handover you record that he tried to leave the ward at night, was worried about money and family, actually needed the toilet, and which approaches worked.", "lessons": ["“I want to go home” may mean unease, missing family, or a physical need (e.g. hunger, cold, needing the toilet).", "Don’t correct or argue — respond to the feeling first.", "Use simple words, short sentences, and yes/no or either/or questions.", "Use name badges, gestures and touch."], "principle": "Simple words and short sentences; one thing at a time; yes/no or either/or questions, not open questions; gestures and body language; respond to the feeling first."}, "alc": {"title": "Just One Sip", "sub": "Alcohol dependence | 50s, second night of alcohol detox", "nodes": [{"p": "The patient tosses and turns in bed, covered in sweat: “I can’t sleep… normally I need a couple of cans first.”", "i": "Without a drink, I’m all wrong.", "stage": "", "ch": [["“Without a drink, tonight’s especially hard to sleep, and your body feels awful too.”", 2, "", "Skill used: Reflection"], ["“If you need a drink to sleep, you’ve got a problem.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Judgement knocks his motivation."]]}, {"p": "“My hands are shaking and my heart’s racing.”", "i": "Is it starting again? Last time was horrible.", "stage": "", "ch": [["“These could be withdrawal symptoms. I’ll check your blood pressure, pulse and temperature right now, do a withdrawal assessment, and let the doctor know.”", 2, "", "Skill used: Prompt assessment of withdrawal symptoms"], ["“Just tough it out.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Ignores potentially dangerous withdrawal symptoms."]]}, {"p": "“Just let me have one sip. One sip’s enough.”", "i": "One sip and it wouldn’t be this bad.", "stage": "After the checks", "ch": [["“You’re having a really hard time and you badly want a drink. Cravings like this come in waves, and they do pass. The doctor has medication to ease the withdrawal.”", 2, "", "Skills used: Reflection + Education that cravings pass"], ["“No! You’re here to stop drinking!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Just a refusal, with no response to how hard it is."]]}, {"p": "“I’ve tried to quit loads of times. I always fail.”", "i": "Can I really never quit?", "stage": "", "ch": [["“You’ve tried many times — that means you’ve always wanted to change, and that matters a lot. This time you’ve come into hospital, with doctors and nurses supporting you. That’s different from before.”", 2, "", "Skill used: Affirming the motivation to change"], ["“If you keep failing, you’re just not determined enough.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Makes him more hopeless."]]}, {"p": "“My wife says if I drink again, she’ll divorce me.”", "i": "I don’t want to lose my family.", "stage": "", "ch": [["“Your family matters a lot to you, and you don’t want to lose them. For you, what’s the most important reason to stop drinking?”", 2, "", "Skills used: Reflection + Open question to find motivation"], ["“If you’d never drunk, none of this would’ve happened.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Blame doesn’t help."]]}, {"p": "“I want… to see my daughter get married.”", "i": "I want to be a good dad.", "stage": "", "ch": [["“You want to be there for your daughter and see the big days of her life. That’s a powerful reason — when it gets tough, you can think of her.”", 2, "", "Skills used: Reflection + Strengthening motivation"], ["“Then stop drinking.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too simplistic."]]}, {"p": "“My job… if my boss finds out I’m in hospital, will he sack me?”", "i": "Without the job, what happens to my family?", "stage": "", "ch": [["“You’re worried about your job and household bills. The social worker can talk with you about a sick note and financial support. We’ll take it one step at a time.”", 2, "", "Skill used: Addressing practical worries"], ["“Don’t think about work yet.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Sidesteps his worry."]]}, {"p": "“I used to drink whenever I was stressed… what do I do after I’m discharged?”", "i": "Without alcohol, I don’t know how to unwind.", "stage": "", "ch": [["“Let me show you something called progressive muscle relaxation: clench both fists tight for a count of five, then slowly let go and feel the difference in your hands; then do the same with your shoulders, face and feet.” The patient tries it once.", 2, "", "Skill used: Teaching progressive muscle relaxation"], ["“Worry about that when you’re discharged.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to teach a coping skill."]]}, {"p": "“…My hands don’t seem to shake as much.”", "i": "So I can relax without a drink.", "stage": "", "ch": [["“You did really well. When you’re stressed or craving a drink, you can use this — or talk to someone, or go for a walk. After discharge there are mutual-help groups and follow-up appointments too.”", 2, "", "Skills used: Affirmation + Relapse prevention plan"], ["“So you don’t need to drink anymore.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too simplistic, with nothing about long-term support."]]}, {"p": "“Thank you for staying with me tonight.”", "i": "Maybe this time it’ll really work.", "stage": "", "ch": [["“Thank you for trusting me. Tonight you told me how much you want a drink, that you’re scared you can’t quit, and that you’re worried about your family and your job; and you said you want to be there for your daughter. I’ll hand over so the doctor can follow up your withdrawal symptoms, and I’ll check on you more often tonight.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“OK, go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to summarise and follow up."]]}], "end": "He takes the medication the doctor prescribed and falls asleep at 04:00. His symptoms have improved at the next set of vital signs.", "lessons": ["Shaking, sweating and a racing heart may be withdrawal reactions; assess straight away and inform the doctor.", "Cravings come in waves, and they pass.", "Affirm the patient’s motivation to change — don’t judge.", "Progressive muscle relaxation can help you relax."], "principle": ""}, "mania": {"title": "I Don’t Need Sleep", "sub": "Mania | 30s, bipolar disorder, manic phase", "nodes": [{"p": "The patient paces up and down the corridor, talking fast: “I don’t need sleep! I’ve got loads of plans!”", "i": "My mind won’t stop. I’m so buzzing.", "stage": "", "ch": [["In a steady, slow voice: “You’ve got a lot of ideas right now and loads of energy. Shall we go and sit somewhere quieter in the day room and talk?”", 2, "", "Skills used: Reflection + Reducing stimulation"], ["“Keep your voice down! Everyone’s asleep!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Loud reprimands make them more agitated."]]}, {"p": "“I’m going to start a company! I’ve got it all worked out — I’ll make a fortune!”", "i": "Why doesn’t anyone see how brilliant I am?", "stage": "", "ch": [["“You’re really passionate about this plan. How about writing it down, and once you’ve rested, going through it with the doctor and your family?”", 2, "", "Skill used: Not agreeing or arguing; guiding them to put off decisions"], ["“Where would you get money to start a company?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Arguing causes conflict."]]}, {"p": "“I don’t want to sleep anymore — sleep’s a waste of time!”", "i": "My mind has so much waiting for me to do.", "stage": "", "ch": [["“You feel full of energy. But after several days without sleep your body can’t keep up, and your mood swings more too. Let’s try dimming the lights — even lying down to rest helps.”", 2, "", "Skills used: Education + Setting gentle limits"], ["“Sleep or don’t, up to you.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Leaving it makes the illness worse."]]}, {"p": "“Are you trying to control me?” Their voice gets louder.", "i": "They don’t understand me.", "stage": "", "ch": [["Keep your distance and a steady tone: “I can see you’re really angry. I’m not trying to control you — I want you to get some rest.”", 2, "", "Skills used: Reflection + De-escalation"], ["“Keep this up and you’re getting an injection!”", 0, "They say nothing more, as if they’ve shut themselves away.", "Threats escalate the situation."]]}, {"p": "(Sitting down) “…Actually I’m exhausted, but I can’t stop.”", "i": "My body’s exhausted, but my mind’s still running.", "stage": "", "ch": [["“Your body’s exhausted but your mind won’t stop — that must be really hard. It’s good that you told me.”", 2, "", "Skills used: Reflection + Affirmation"], ["“If you’re tired, go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too simplistic."]]}, {"p": "“How can I make my mind stop?”", "i": "I want to try.", "stage": "", "ch": [["“Let me show you something: put your attention on your breathing. Breathe in slowly for four, pause, then breathe out slowly for six. If your thoughts wander off, that’s fine — just bring them back to counting your breaths.” The patient does it a few times and their speech slows a little.", 2, "", "Skill used: Breathing meditation"], ["“Just stop thinking.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Easier said than done."]]}, {"p": "“I just sent loads of messages to my friends… will they think I’m weird?”", "i": "Have I messed things up again?", "stage": "", "ch": [["“You’re worried about what your friends think. Once your mood is steadier, we can work out together how to explain to them. For now, I’ll look after your phone so you can rest.”", 2, "", "Skills used: Reflection + Protecting relationships"], ["“Well, of course that’s weird.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Judgement hurts the patient."]]}, {"p": "“Last time I got ill, I spent all my money… I’m so scared it’ll happen again.”", "i": "I don’t want to hurt my family again.", "stage": "", "ch": [["“You know exactly what happened last time, and you want to protect yourself and your family. Later you can make a plan with the doctor and social worker — like spotting the warning signs of relapse early.”", 2, "", "Skills used: Affirming insight + Relapse prevention"], ["“If you know, don’t do it again.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Blame doesn’t help."]]}, {"p": "“What are the warning signs?”", "i": "I want to know earlier.", "stage": "", "ch": [["“Lots of people notice: sleeping very little without feeling tired, talking fast, lots of big plans, a strong urge to buy things. If you spot these, see the doctor early. Would you like to write them down together now?”", 2, "", "Skills used: Teaching relapse warning signs + Shared involvement"], ["“The doctor will tell you.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to teach self-management."]]}, {"p": "“…I’d like to try lying down.”", "i": "Slowing down actually feels quite nice.", "stage": "", "ch": [["“Great. Tonight you told me your mind won’t stop and you’re exhausted, and that you’re worried about your friends and spending all your money last time; you also tried the breathing technique. I’ll hand over to the doctor to follow up, and I’ll walk you back to bed.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“You should have gone to sleep ages ago.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Makes them feel blamed."]]}], "end": "They lie down and fall asleep at 04:30. At handover you record their hours of sleep, mood, impulsive behaviour and worries.", "lessons": ["With a manic patient, keep your words short and steady and reduce stimulation.", "Don’t go along with or argue against grandiose ideas.", "Lack of sleep makes mania worse.", "Know the warning signs of relapse and seek help early.", "Breathing meditation can help slow the mind down."], "principle": "Short sentences and a steady tone; reduce stimulation (lights, noise, crowds); set limits gently but clearly; don’t go along with grandiose ideas, and don’t argue either."}, "grief": {"title": "She’s Still Here", "sub": "Bereavement | 50s, admitted with low mood after their mother died two months ago", "nodes": [{"p": "The patient is holding their phone: “I want to call Mum. She hasn’t replied to me tonight.”", "i": "She must be asleep.", "stage": "Denial", "ch": [["Sit beside them and say gently: “You really miss your mum.”", 2, "", "Skill used: Responding to the feeling first"], ["“Your mum has passed away — don’t you remember?”", 0, "They say nothing more, as if they’ve shut themselves away.", "Too blunt and too fast; it doesn’t consider how they feel."]]}, {"p": "“I keep feeling like she’s still here, like I’ll see her as soon as I get home.”", "i": "I don’t want to believe she’s gone.", "stage": "Denial", "ch": [["“When you lose someone very close, many people feel as if they’re still here. It’s a very common reaction.”", 2, "", "Skill used: Normalising | Denial: the mind protecting itself, slowly taking in news that’s hard to accept."], ["“You need to face reality.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Pushing too hard, too soon."]]}, {"p": "Their voice rises: “Why didn’t the doctors catch it sooner? Why did it have to be her?”", "i": "The world is so unfair.", "stage": "Anger", "ch": [["“You’re really angry, and it feels so unfair. It’s OK to say these things. I’m here, listening.”", 2, "", "Skills used: Reflection + Accepting emotions | Anger: may be directed at doctors, family, oneself, or even the person who died."], ["“Don’t blame the doctors — they did their best.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Rushing to defend others makes them feel misunderstood."]]}, {"p": "“I’m angry with myself too… I was so busy back then. I didn’t make time for her.”", "i": "It’s all my fault.", "stage": "Anger", "ch": [["“You loved your mum so much — that’s why you’re blaming yourself like this. Would you like to tell me about some of your memories of her?”", 2, "", "Skills used: Reflection + Open question"], ["“Yes, you should have spent more time with her.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Adds to their guilt."]]}, {"p": "“If only I’d taken her to the doctor sooner that day… if only I hadn’t moved out…”", "i": "If I’d done better, she might still be here.", "stage": "Bargaining", "ch": [["“You keep thinking ’if only’, wishing you could turn back time. Many bereaved people have thoughts like these.”", 2, "", "Skills used: Reflection + Normalising | Bargaining: thinking “if only… then…” over and over, wanting to change what has already happened."], ["“There’s no point thinking about it.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Dismisses their feelings."]]}, {"p": "The patient cries: “Without her, I don’t know how to go on living.”", "i": "Everything feels empty. Nothing means anything.", "stage": "Depression", "ch": [["Pass them a tissue and sit quietly with them; after a while: “It hurts so much. I’m here with you.”", 2, "", "Skills used: Therapeutic silence + Empathy | Depression: deep sadness, emptiness, no energy for anything."], ["“Don’t cry. Your mum wouldn’t want to see you like this.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Suppresses their emotions."]]}, {"p": "“Sometimes I think I might as well go with her.”", "i": "Will it help to say it out loud?", "stage": "Depression", "ch": [["Calmly and directly: “Thank you for telling me. I want to ask you clearly: are you having thoughts of ending your life right now?” Patient: “I’ve thought about it, but I don’t have a plan.” Nurse: “It’s really important that you told me. I’ll let the doctor and the team know, so we can all keep you safe.”", 2, "", "Skills used: Asking directly about suicide risk + Being honest that it can’t be kept secret"], ["“Don’t talk nonsense.”", 0, "They say nothing more, as if they’ve shut themselves away.", "The patient will hide their thoughts."]]}, {"p": "“My heart’s in pieces. It hurts so much.”", "i": "Once I start thinking of her, I can’t stop.", "stage": "", "ch": [["“Let me teach you something called ’5-4-3-2-1’: name five things you can see, four things you can hear, three things you can touch, two things you can smell, one thing you can taste.” The patient goes through it slowly, and their breathing steadies.", 2, "", "Skill used: Teaching a grounding exercise"], ["“Look on the bright side.”", 0, "They say nothing more, as if they’ve shut themselves away.", "No technique offered."]]}, {"p": "“Mum always used to make soup for me… I miss that soup so much.”", "i": "Thinking of her can feel warm, too.", "stage": "The beginning of acceptance", "ch": [["“It sounds like your mum loved you very much. Her soup is such a warm memory between the two of you.”", 2, "", "Skills used: Reflection + Helping recall positive memories"], ["“You can get soup anywhere.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Completely misses the point."]]}, {"p": "“Maybe… I could learn to make her soup. Then it’d be like she’s still with me.”", "i": "She’ll always be in my heart.", "stage": "Acceptance", "ch": [["“That’s a lovely idea. Acceptance isn’t forgetting your mum — it’s carrying your love for her as you go on living. Take it slowly; there’s no rush.”", 2, "", "Skills used: Affirmation + Explaining what acceptance means | Acceptance: not “letting go” or “being fine”, but learning to live alongside the loss."], ["“Great, so you’re fine now.”", 0, "They say nothing more, as if they’ve shut themselves away.", "Grief doesn’t end in one night."]]}, {"p": "“Thank you for letting me talk about Mum tonight.”", "i": "I haven’t talked to anyone about her in ages.", "stage": "", "ch": [["“Thank you for sharing your mum with me. Tonight you told me how much you miss her, about your anger and self-blame, that you’ve thought about not wanting to live, and about the soup she used to make. I’ll hand over to the doctor and the team to follow up, and I’ll check on you more often tonight. Try to get some rest.”", 2, "", "Skills used: Summarising + Explaining follow-up"], ["“OK, go to sleep.”", 0, "They say nothing more, as if they’ve shut themselves away.", "A missed chance to summarise and follow up."]]}], "end": "Holding their mum’s photo, they fall asleep at 04:00. At handover you record their mood, suicidal thoughts and key points of the conversation, and recommend referral to a clinical psychologist for bereavement counselling.", "lessons": ["The five stages of grief (denial, anger, bargaining, depression, acceptance) don’t necessarily come in order and can come back again.", "Everyone grieves differently.", "Being there and listening helps more than telling someone to “look on the bright side”.", "Bereaved people can have suicidal thoughts too — ask directly.", "Acceptance isn’t forgetting; it’s carrying love with you as you go on living."], "principle": "Lets the public experience the five common stages of grief: denial, anger, bargaining, depression, acceptance. The explanation bubbles make clear that the stages don’t necessarily come in order, can repeat and overlap, and everyone’s grief is different — there’s no “right” or “wrong” way to grieve."}};

STORIES.ano.lessons=['Why do people with anorexia feel bloated? After eating very little for a long time, the stomach empties more slowly and the gut moves more slowly, so even a little food feels very full and bloated, and constipation is common. It’s most noticeable early in refeeding and gradually improves as nutrition gets better; anxiety also makes patients extra sensitive to body sensations. So when a patient says they feel bloated, it’s a real feeling, not an excuse.',...(STORIES.ano.lessons||[])];
{const n0=STORIES.ano.nodes[0];n0.p='The patient sits on the edge of the bed, arms wrapped around their stomach: “I can’t sleep… my stomach’s so bloated, like my whole stomach is pushing up.”';n0.ch.forEach(c=>{if(c[1]===2)c[3]+='| 💡 Why the bloating? After eating very little for a long time, people with anorexia have slower stomach emptying and gut movement; early in refeeding, even a small amount feels very full and heavy. It’s a common physical reaction that eases as nutrition improves, but it can make patients more anxious and more inclined to eat less.'})}

function bil(t){return t}
const WD_R=['They turn away, hugging their pillow, their voice much quieter.','The light goes out of their eyes, and they say quietly: “…Forget it.”','They curl back under the blanket, and their answers become much shorter.','They sigh and stop looking at you.'];

function scrStoryPick(){return `<div class="card"><h2>🌙 N shift (night): dialogue mode</h2>
 <p>The 21:00 handover, 22:00 sleep medication and 22:30 lights-out are all done. Late at night, when everything is quiet, many patients only then open up. Tonight you’ll have a long talk with a<b>patient who can’t sleep</b>.</p>
 <ul class="det small"><li>The screen shows the patient’s<b>inner thoughts 💭</b>, so you can feel the worries inside them.</li><li>Every reply affects the patient’s trust, and after each choice you’ll see the communication skill behind it.</li><li>On nights you must patrol regularly — the 💭 bubble above the charge nurse will remind you, and the patient will walk with you. Remember to complete the sleep chart before handover.</li></ul>
 ${Object.entries(STORIES).map(([k,s])=>B(`<span style="font-size:28px">${s.e}</span><span><b>${s.title}</b><br><span class="small mute">${s.sub}</span></span>`,()=>startNight(k),'block')).join('')}
 ${B('🎲 Pick a patient at random',()=>startNight(pick(Object.keys(STORIES))),'block ctr')}
 ${B('◀ Back to shift choice',()=>go('shift'),'ghost block ctr')}</div>`}
function startNight(k){const keep=S.speed;newState();S.speed=keep;S.mode='night';S.shift='N';S.cfg={name:'N shift',range:'21:00–07:30',start:1380,end:1890,support:1};S.t=1380;
 const st=STORIES[k];const beds=shuffle([...Array(22)].map((_,i)=>i+1));let bi=0;
 const mine=mkPatient(beds[bi++],SCN.find(x=>x.id===st.scn)||(PBG[st.scn]?{id:st.scn,dx:PBG[st.scn].dx}:null));S.patients.push(mine);
 const ng=mkPatient(beds[bi++],SCN.find(x=>x.id===10));const fol=mkPatient(beds[bi++],SCN.find(x=>x.id===11));S.patients.push(ng,fol);
 while(bi<22)S.patients.push(mkPatient(beds[bi++],null));S.patients.sort((a,b)=>a.bed-b.bed);
 S.diary=[{x:`🌙 From P shift: Bed ${mine.bed} has been sleeping badly lately — watch their mood`,done:false},{x:`🩸 Bed ${pick(S.patients).bed} Fasting tomorrow morning, blood test at 08:30`,done:false}];
 S.tasks=[];
 const ev=pickFresh(['snore','ng','foley','selfharm'],1,'pw_nev',x=>x)[0];const eb=ev==='ng'?ng.bed:ev==='foley'?fol.bed:pick(S.patients.filter(p=>p.bed!==mine.bed)).bed;
 S.nightEv={kind:'gen',d:NIGHTEV[ev],bed:eb,state:'pending'};
 S.msgs.push({t:1830,msg:'⏰ 06:30 support staff start waking patients to wash (continues into A shift)'});
 S.pos={x:2.4,y:1.9};S.zoneNow='bed';S.follow={x:1.8,y:2.2};S.storyOn=true;
 S.story={k,st,nodes:st.nodes.slice(),rep:0,bed:mine.bed,i:0,trust:50,chat:[{c:'s',x:st.intro}],answered:false,good:0};pushNode();
 S.tab='tasks';startGame();setBubble('💭 At night, patients often open up more…')}
function setBubble(t){S.bubble={t,until:performance.now()+7000}}
function nodeTime(i,n){return 1385+Math.round(i*(1615-1385)/Math.max(1,n-1))}
function pushNode(){const s=S.story,n=s.nodes[s.i];const old=S.t;S.t=Math.max(S.t,nodeTime(s.i,s.nodes.length));
 if(Math.floor(S.t/30)>Math.floor(old/30))setBubble('💭 Nearly time for another patrol…');
 s.chat.push({c:'s',x:`🕐 ${fmt(S.t)}${n.s?'　'+n.s:''}${n.stage?'　| Stage of grief: '+n.stage:''}`});const wd=s.wd>0;const core=n.p.replace(/[“” ()]/g,'').slice(0,10);const lastR=[...s.chat].reverse().find(c=>c.c==='r');const dup=lastR&&lastR.x.includes(core);s.chat.push({c:'p',x:dup?'':(wd?'(quietly, not looking at you) '+n.p:n.p),inner:n.i?(wd?n.i+'…they wouldn’t understand anyway.':n.i):''})}
function storyHTML(){const s=S.story;if(!s)return '';const st=s.st;const done=s.i>=s.nodes.length;
 const items=s.chat;const chat=items.map(c=>c.c==='s'?`<div class="bub s">${c.x}</div>`:c.c==='p'?`<div class="bub p"><span class="who">${st.e} Bed ${s.bed} Patient</span>${c.x}${c.inner?`<div class="innerin">💭 ${c.inner}</div>`:''}</div>`:c.c==='i'?`<div class="inner">💭 Inner thought: ${c.x}</div>`:c.c==='n'?`<div class="bub n"><span class="who">🧑‍⚕️ You</span>${c.x}</div>`:c.c==='r'?`<div class="bub s">${c.x}</div>`:c.c==='l'?`<div class="learn small">💡 ${c.x}</div>`:c.c==='h'?hotHTML():'').join('');
 let ctl;if(!S.storyOn)ctl=`<div class="small mute">🌙 The patient has gone to sleep. Carry on with your night shift: patrol regularly, handle anything unexpected, and complete the sleep chart before handover.</div>`;
 else if(done)ctl=B('Patient’s asleep — continue the night shift ▶',endStory,'pri block ctr');
 else if(s.answered)ctl=B('Continue ▶',nextNode,'pri block ctr');
 else{const n=s.nodes[s.i];ctl=`<p><b>👉 How will you respond?</b></p>${shuffle(n.ch.map((c,i)=>i)).map((i,x)=>B(`${'ABC'[x]}. ${n.ch[i][0]}`,()=>answer(i),'block')).join('')}`}
 if(S.chatHidden)return B('🔼 Show conversation',()=>{S.chatHidden=false;refreshStory()},'block ctr');
 return `${B('🔽 Hide conversation',()=>{S.chatHidden=true;refreshStory()},'sm')}<div class="night"><span class="moon">🌙</span><b>${st.e} ${st.title}</b><div class="small" style="opacity:.8">${st.sub} | The patient will follow you — you can take them on your patrol</div>${s.wd>0?'<div class="small" style="color:#ffb3b3">😶 The patient has withdrawn</div>':''}<div class="chat" id="chat">${chat}</div></div><div id="choices">${ctl}</div>`}
function refreshStory(){const el=$('#story');if(el)el.innerHTML=storyHTML();const h=$('#hud');if(h)h.innerHTML=hudHTML();setTimeout(()=>{const c=$('#choices');if(c)c.scrollIntoView({behavior:'smooth',block:'end'})},40)}
function answer(i){const s=S.story,n=s.nodes[s.i],c=n.ch[i];if(c[1]===0&&s.rep<2&&n!==REPAIR&&n!==REPAIR_ELD){s.nodes.splice(s.i+1,0,s.k==='eld'?REPAIR_ELD:REPAIR);s.rep++}
 s.chat.push({c:'n',x:c[0]});
 if(c[1]===0){s.wd=2;s.chat.push({c:'r',x:'❌ '+(s.k==='eld'?'He frowns, grips the plastic bag and won’t look at you anymore.':pick(WD_R))+'　😶 The patient’s mood has dropped and trust has fallen; they’ll say less from now on.'})}
 else{if(s.wd>0)s.wd--;s.chat.push({c:'r',x:(c[1]===2?'✅ ':'🟡 ')+(c[2]||'Good response')})}
 if(c[3])s.chat.push({c:'l',x:(c[1]===0?'Why it’s not ideal: ':'')+bil(c[3])});
 if(c[1]===2){s.trust=cl(s.trust+9);s.good++;SFX.ok()}else if(c[1]===1){s.trust=cl(s.trust+1);SFX.ping()}else{s.trust=cl(s.trust-15);SFX.bad()}
 if(c[1]!==2)s.chat.push({c:'l',x:'A better response: '+n.ch.find(x=>x[1]===2)[0]});
 if(n.hot)s.chat.push({c:'h'});addLearn(c[3]);
 s.answered=false;s.i++;if(s.nodes[s.i])pushNode();refreshStory()}
function nextNode(){const s=S.story;s.i++;s.answered=false;if(s.nodes[s.i])pushNode();refreshStory()}
function endStory(){S.storyOn=false;S.follow=null;S.t=Math.max(S.t,1620);S.nightEv.t=S.t+R(15,40);S.events.push(S.nightEv);S.tasks.push(T(1770,'sleep','Complete the sleep chart','📝',50));S.people=null;log(`💬 After talking with Bed ${S.story.bed}, the patient has gone to sleep`);setBubble('💭 They’re finally asleep… I need to carry on patrolling and doing the records.');last=performance.now();S.dirty=true;render()}
function nightTick(){if(S.t===1770)setBubble('💭 Nearly handover — I need to finish the charts…');else if(S.t%30===0)setBubble(pick(['💭 Nearly time for another patrol…','💭 Let’s see how everyone’s sleeping in the dormitory…','💭 Need to keep a closer eye on the high-risk ones…']));
 const sl=S.tasks.find(k=>k.type==='sleep');if(!S.storyOn&&sl&&sl.state==='done'&&S.nightEv&&S.nightEv.state==='done'&&!S.over)endShift()}
function sleepChart(k){const n=Object.keys(S.patrol).filter(x=>+x*30>=1380).length;
 const awake=shuffle(S.patients).slice(0,3).map(p=>p.bed);
 openM(`<h2>📝 Sleep chart</h2><p class="small">Record when each patient fell asleep, whether they woke, and whether they slept.</p><div class="sys">Tonight you patrolled the dormitory <b>${n}</b> time(s)</div>
 ${n>=2?`<div class="small">From your patrols: most patients were asleep before 23:30; Bed ${awake.join(', ')} woke during the night; Bed ${S.story.bed}  only fell asleep after 03:00.</div>${B('Fill in from observation ✅',()=>{eff(15,0,-2);SFX.ok();addLearn('Sleep charts must be completed from actual patrol observations; they help the doctor assess the patient and adjust medication.');finishTask(k,10)},'pri block ctr')}`
 :`<div class="fb m">You didn’t patrol enough — many patients’ sleep is unclear.</div>${B('Just put “slept well” for everyone',()=>{eff(-15,0,4);SFX.bad();addLearn('Sleep charts must be filled in from actual patrol observations — not guessed.');openM(`<div class="fb b">❌ Records must be based on actual observation, not guesswork. Doctors use sleep charts to assess patients and adjust medication.</div>${B('Done',()=>finishTask(k,0),'block ctr')}`)},'block')}${B('Record what you actually saw, note what you didn’t observe, and hand it over',()=>{eff(3,0,0);addLearn('Sleep charts must be completed from actual patrol observations; they help the doctor assess the patient.');finishTask(k,5)},'block')}`}`)}
function scrNightEnd(){const s=S.story,st=s.st,tot=s.nodes.length;const good=s.trust>=70;
 return `<div class="card" style="text-align:center"><div style="font-size:44px">${good?'🌅':'🌤️'}</div><h1>N shift complete</h1><div class="mute">${st.title} | ${st.sub}</div><div style="font-size:28px;font-weight:800;margin:6px 0">🤝 Trust ${Math.round(s.trust)}</div><div class="small">Best responses: ${s.good}/${tot} | ⭐ ${S.score}</div></div>
 <div class="card"><div class="night"><div class="chat"><div class="bub s">${good?st.endGood:st.endMid}</div></div></div></div>
 <div class="card"><h2>💬 How to talk with someone with ${COND[s.k][0]}</h2><h3>Key points</h3><ul class="det">${COND[s.k][1].map(x=>`<li>${x}</li>`).join('')}</ul><div class="fb b small">🚫 Avoid saying: ${COND[s.k][2]}</div><div class="fb g small">✅ Try saying: ${COND[s.k][3]}</div></div>
 <div class="card"><h2>📚 What you learned tonight</h2>${[...(st.lessons||[]),...STORY_LESSONS].filter((v,i,a)=>a.indexOf(v)===i).map(l=>`<div class="learn small">💡 ${l}</div>`).join('')}</div>
 <div class="card">${CLOSING}${hotHTML()}</div>
 <div class="card">${B('🌙 Choose another patient',()=>go('story'),'block ctr')}${B('🔁 Play another shift',()=>go('shift'),'pri block ctr')}${B('🏠 Back to home',()=>go('intro'),'block ctr')}${shareBtn()}${SITE_URL?`<a class="btn block ctr" href="${SITE_URL}" target="_blank" rel="noopener">🌻 Visit the Sunflower website</a>`:''}</div>${CREDIT}<div id="fbwrap">${fbHTML()}</div>`}

render();
</script>
